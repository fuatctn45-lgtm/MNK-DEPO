// Actions
function stockVisibleForRole(list, role) {
  if (!Array.isArray(list)) return [];
  if (role === 'YONETICI' || role === 'OP') return list;
  if (role === 'MEK_ADMIN') return list.filter(x => !isIsgItem(x));
  if (role === 'ISG_ADMIN') return list.filter(isIsgItem);
  return list;
}
function hasQrInStock(list, qr) {
  if (!qr) return false;
  if (isIsgCabinetCode(qr)) return list.some(isIsgItem);
  const q = norm(qr);
  if (!q) return false;
  return list.some(x => norm(x.id) === q || norm(x.code) === q);
}

async function submitOpPin(pinRaw) {
  const pin = String(pinRaw || '').replace(/\s+/g, '').trim();
  if (!pin) return toast('Lütfen operatör PIN’inizi tuşlayın.', 'err');
  beginSave('PIN doğrulanıyor...');
  try {
    const auth = await api('auth', {pin, client: 'QR_TERMINAL'});
    state.user = auth.user;
    state.session = auth.session;
    const reqSession = auth.session;
    const cached = loadStockCache();
    const cachedVisible = cached ? stockVisibleForRole(cached.stock, auth.user.role) : [];

    const isOrder = state.intent === 'order';
    if (cached && cachedVisible.length && (isOrder || hasQrInStock(cachedVisible, state.scannedQr))) {
      state.stock = cachedVisible;
      state.machines = cached.machines?.length ? cached.machines : DEMO.machines;
      state.costCenters = cached.costCenters?.length ? cached.costCenters : (state.mode === 'demo' ? DEMO.costCenters : []);
      state.machineCostCenters = (cached.machineCostCenters && Object.keys(cached.machineCostCenters).length) ? cached.machineCostCenters : (state.mode === 'demo' ? DEMO.machineCostCenters : {});
      state.companies = cached.companies || [];
      state.units = cached.units || [];
      state.apiVersion = cached.apiVersion || '';
      endSave(true, isOrder ? 'Doğrulandı · Sipariş formu hazır' : 'Doğrulandı · Stok hazır');
      vibrate(35);
      if (isOrder) {
        if (!state.orderDraft) state.orderDraft = createOrderDraft();
        state.orderDraft.requestedBy = state.user.name || '';
        if (!state.orderDraft.approvals) state.orderDraft.approvals = {};
        state.orderDraft.approvals.requirer = state.user.name || '';
        if (state.orderDraft.department && !state.orderDraft.costCenter) {
          state.orderDraft.costCenter = resolveCostCenterForDepartment(state.orderDraft.department) || '';
        }
        state.step = 'order';
        render();
      } else {
        resolveScannedItem();
      }
      // Silently refresh live stock & cost center maps in background
      api('bootstrap', {}, reqSession).then(boot => {
        if (!boot?.stock) return;
        const freshMac = boot.lists?.machines || state.machines;
        const freshCc = boot.lists?.costCenters || state.costCenters;
        const freshMap = boot.lists?.machineCostCenters || state.machineCostCenters;
        const freshComp = boot.lists?.companies || state.companies;
        const freshUnits = boot.lists?.units || state.units;
        const freshVer = boot.apiVersion || '';
        saveStockCache(boot.stock, freshMac, freshCc, freshMap, freshVer, freshComp, freshUnits);
        if (state.session === reqSession) {
          const hadMap = Object.keys(state.machineCostCenters || {}).length;
          state.stock = boot.stock;
          state.machines = freshMac;
          state.costCenters = freshCc;
          state.machineCostCenters = freshMap;
          state.companies = freshComp;
          state.units = freshUnits;
          state.apiVersion = freshVer;
          if (state.step === 'part' && state.item) {
            const fresh = boot.stock.find(x => x.id === state.item.id);
            if (fresh && fresh.stock !== state.item.stock) {
              state.item = fresh;
              render();
            }
          } else if (state.step === 'cabinet') {
            render();
          } else if (state.step === 'order' && Object.keys(freshMap || {}).length !== hadMap) {
            syncOrderDraftFromDom();
            if (state.orderDraft?.department) {
              const autoCc = resolveCostCenterForDepartment(state.orderDraft.department);
              if (autoCc && (!state.orderDraft.costCenter || flatKey(state.orderDraft.costCenter) === flatKey(state.orderDraft.department))) {
                state.orderDraft.costCenter = autoCc;
              }
            }
            render();
          }
        }
      }).catch(() => {});
      return;
    }

    showSaveBar('saving', 'Stok bilgisi alınıyor...');
    const boot = await api('bootstrap', {}, reqSession);
    state.stock = boot.stock || [];
    state.machines = boot.lists?.machines || DEMO.machines;
    state.costCenters = boot.lists?.costCenters || (state.mode === 'demo' ? DEMO.costCenters : []);
    state.machineCostCenters = boot.lists?.machineCostCenters || (state.mode === 'demo' ? DEMO.machineCostCenters : {});
    state.companies = boot.lists?.companies || [];
    state.units = boot.lists?.units || [];
    state.apiVersion = boot.apiVersion || '';
    saveStockCache(state.stock, state.machines, state.costCenters, state.machineCostCenters, state.apiVersion, state.companies, state.units);
    endSave(true, isOrder ? 'Sipariş formu hazır' : 'Stok bilgisi alındı');
    vibrate(35);
    if (isOrder) {
      if (!state.orderDraft) state.orderDraft = createOrderDraft();
      state.orderDraft.requestedBy = state.user.name || '';
      if (!state.orderDraft.approvals) state.orderDraft.approvals = {};
      state.orderDraft.approvals.requirer = state.user.name || '';
      if (state.orderDraft.department && !state.orderDraft.costCenter) {
        state.orderDraft.costCenter = resolveCostCenterForDepartment(state.orderDraft.department) || '';
      }
      state.step = 'order';
      render();
    } else {
      resolveScannedItem();
    }
  } catch (err) {
    endSave(false, err.message);
    vibrate([40, 40, 40]);
    toast(err.message, 'err');
    const inp = $('#opPinInput');
    if (inp) { inp.value = ''; $('#opPinBox')?.classList.remove('filled'); }
  }
}

function syncOrderDraftFromDom() {
  const d = state.orderDraft;
  if (!d || !$('#akgOrderForm')) return d;
  d.docCode = $('#poDocCode')?.value.trim() || 'IZM_350600_LJT_001';
  d.requestDate = $('#poRequestDate')?.value.trim() || todayTr();
  d.department = $('#poDepartment')?.value.trim() || '';
  d.formNo = $('#poFormNo')?.value.trim() || d.formNo;
  d.requestedBy = state.user?.name || $('#poRequestedBy')?.value.trim() || d.requestedBy || '';
  d.costCenter = d.department ? resolveCostCenterForDepartment(d.department) : '';
  if ($('#poCostCenter')) $('#poCostCenter').value = d.costCenter;
  d.attachmentQty = $('#poAttachmentQty')?.value.trim() || '';
  d.paymentTerm = $('#poPaymentTerm')?.value || 'Peşin / Cash';
  d.paymentMaturity = $('#poPaymentMaturity')?.value || '';
  d.transport = $('#poTransport')?.value || '';
  d.deliveryPlace = $('#poDeliveryPlace')?.value.trim() || '';
  d.details = $('#poDetails')?.value.trim() || '';
  d.approvals = {
    requirer: d.requestedBy,
    managerName: $('#poSigManager')?.value.trim() || 'FUAT ÇETİN',
    managerDate: $('#poSigManagerDate')?.value.trim() || d.requestDate,
    approval1Name: $('#poSig1Name')?.value.trim() || 'İbrahim Özdemir',
    approval1Date: $('#poSig1Date')?.value.trim() || d.requestDate,
    approval2Name: $('#poSig2Name')?.value.trim() || 'Yüksel Kurun',
    approval2Date: $('#poSig2Date')?.value.trim() || d.requestDate,
    approval3Name: $('#poSig3Name')?.value.trim() || 'İbrahim Özdemir',
    approval3Date: $('#poSig3Date')?.value.trim() || d.requestDate
  };
  if ($('#poSigRequirer')) $('#poSigRequirer').value = d.requestedBy;
  $$('[data-po-field]').forEach(el => {
    const idx = Number(el.dataset.idx), f = el.dataset.poField;
    if (d.items[idx]) {
      d.items[idx][f] = (f === 'qty' || f === 'unitPrice') ? (Number(el.value) || 0) : el.value;
      d.items[idx].total = Math.round((Number(d.items[idx].qty) || 0) * (Number(d.items[idx].unitPrice) || 0) * 100) / 100;
    }
  });
  d.totalAmount = Math.round(d.items.reduce((s, x) => s + (Number(x.total) || 0), 0) * 100) / 100;
  const filled = d.items.filter(x => String(x.name || '').trim() || String(x.code || '').trim());
  d.currency = filled[0]?.currency || 'TL';
  return d;
}

function updateOrderDetailsCounter() {
  const el = $('#poDetails');
  const cnt = $('#poDetailsCount');
  if (!el || !cnt) return;
  const len = String(el.value || '').trim().length;
  const isSheet = state.orderViewMode === 'sheet';
  cnt.classList.toggle('ok', len >= 10);
  cnt.classList.toggle('err', len > 0 && len < 10);
  cnt.textContent = len >= 10
    ? (isSheet ? `✓ ${len} krk` : `✓ ${len} karakter`)
    : (isSheet ? `${len}/10 krk` : `${len} / 10 karakter (zorunlu)`);
  if (len >= 10) el.classList.remove('po-field-err');
}

function focusOrderErrorField(el, msg) {
  if (el) {
    el.classList.add('po-field-err');
    try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch {}
    setTimeout(() => { try { el.focus(); } catch {} }, 120);
  }
  vibrate([30, 30, 30]);
  toast(msg, 'err');
  return null;
}

function validateOrderDraft(d) {
  if (!d) return null;
  $$('.po-field-err').forEach(x => x.classList.remove('po-field-err'));
  const dept = String(d.department || '').trim();
  const details = String(d.details || '').trim();
  const fallbackDate = d.requestDate || todayTr();
  const filledItems = (d.items || []).filter(r => String(r.name || '').trim() || String(r.code || '').trim()).map((r, i) => ({
    no: i + 1,
    itemId: String(r.itemId || ''),
    name: String(r.name || '').trim(),
    code: String(r.code || '').trim(),
    supplier: String(r.supplier || '').trim(),
    qty: Number(r.qty) || 0,
    unit: String(r.unit || 'AD').trim() || 'AD',
    unitPrice: Number(r.unitPrice) || 0,
    currency: String(r.currency || 'TL').trim() || 'TL',
    total: Math.round((Number(r.qty) || 0) * (Number(r.unitPrice) || 0) * 100) / 100,
    deliveryDate: String(r.deliveryDate || '').trim() || fallbackDate
  }));
  if (!filledItems.length && !dept && !details) {
    return focusOrderErrorField($('#poDepartment') || $('[data-po-field="name"]'), 'Sipariş formu boş! Bölüm/makine, malzeme ve en az 10 karakter açıklama girin.');
  }
  if (!dept) {
    return focusOrderErrorField($('#poDepartment'), 'Talep eden bölüm veya makineyi seçin.');
  }
  if (!filledItems.length) {
    return focusOrderErrorField($('[data-po-field="name"]'), 'Form boş! En az bir malzeme seçin veya yazın.');
  }
  const badQtyIdx = (d.items || []).findIndex(r => (String(r.name || '').trim() || String(r.code || '').trim()) && !(Number(r.qty) > 0));
  if (badQtyIdx >= 0) {
    return focusOrderErrorField($(`[data-po-field="qty"][data-idx="${badQtyIdx}"]`), 'Eklenen her malzeme için 0’dan büyük miktar girin.');
  }
  if (!details) {
    const cnt = $('#poDetailsCount');
    if (cnt) cnt.classList.add('err');
    return focusOrderErrorField($('#poDetails'), 'Detaylar / Açıklama alanı zorunludur (en az 10 karakter yazın).');
  }
  if (details.length < 10) {
    const cnt = $('#poDetailsCount');
    if (cnt) cnt.classList.add('err');
    return focusOrderErrorField($('#poDetails'), `Detaylar / Açıklama en az 10 karakter olmalıdır (şu an ${details.length} karakter).`);
  }
  return { dept, details, filledItems };
}

async function submitOrderForm() {
  const d = syncOrderDraftFromDom();
  if (!d) return;
  const opName = state.user?.name || '';
  if (!opName) return toast('Önce operatör PIN ile giriş yapın.', 'err');
  const valid = validateOrderDraft(d);
  if (!valid) return;
  const { dept, filledItems } = valid;

  const lockedCc = resolveCostCenterForDepartment(dept);
  saveOrderDefaults({
    docCode: d.docCode,
    department: dept,
    costCenter: lockedCc,
    deliveryPlace: d.deliveryPlace,
    paymentTerm: d.paymentTerm,
    paymentMaturity: d.paymentMaturity,
    transport: d.transport,
    managerName: d.approvals.managerName,
    approval1Name: d.approvals.approval1Name,
    approval2Name: d.approvals.approval2Name,
    approval3Name: d.approvals.approval3Name
  });

  const reqSession = state.session;
  const payload = {
    formNo: d.formNo,
    docCode: d.docCode || 'IZM_350600_LJT_001',
    requestDate: d.requestDate || todayTr(),
    requestedBy: opName,
    department: dept,
    costCenter: lockedCc,
    attachmentQty: String(d.attachmentQty || '').trim(),
    paymentTerm: d.paymentTerm || 'Peşin / Cash',
    paymentMaturity: d.paymentMaturity || '',
    transport: d.transport || '',
    deliveryPlace: d.deliveryPlace || '',
    details: String(d.details || '').trim(),
    approvals: { ...d.approvals, requirer: opName },
    items: filledItems,
    totalAmount: Math.round(filledItems.reduce((s, r) => s + (r.total || 0), 0) * 100) / 100,
    currency: filledItems[0]?.currency || 'TL',
    source: 'QR_TERMINAL'
  };

  beginSave('Sipariş talebi kaydediliyor...');
  try {
    let res;
    try {
      res = await api('purchaseOrderCreate', payload, reqSession);
    } catch (err) {
      if (state.mode !== 'demo' && /Bilinmeyen işlem|Desteklenmeyen/i.test(String(err.message || ''))) {
        const localRec = {
          ...payload,
          id: uid('SIP'),
          formNo: payload.formNo || nextOrderFormNo(),
          status: 'TALEP_OLUSTURULDU',
          createdAt: nowStr(),
          createdBy: opName,
          updatedAt: nowStr(),
          _localOnly: true
        };
        saveLocalOrder(localRec);
        res = {order: localRec, formNo: localRec.formNo};
        toast('Sipariş yerel kaydedildi (Kod.gs V8.8.3-MAIL güncellenince Sheets’e aktarılır).', 'warn');
      } else {
        throw err;
      }
    }

    const savedOrder = {
      ...payload,
      ...(res?.order || {}),
      formNo: res?.order?.formNo || res?.formNo || payload.formNo,
      items: filledItems,
      approvals: { ...payload.approvals, ...(res?.order?.approvals || {}) }
    };
    const first = filledItems[0];
    const summaryName = filledItems.length > 1 ? `${first.name || first.code} (+${filledItems.length - 1} kalem)` : (first.name || first.code);
    const totalQty = filledItems.reduce((s, r) => s + (Number(r.qty) || 0), 0);
    const historyEntry = {
      status: 'order',
      title: 'Sipariş Talebi Oluşturuldu',

    };

}

async function initiatePartCheckout(item, qty, machine) {
  if (!item) return;
  if (!qty || qty <= 0) return toast('Geçerli bir miktar girin.', 'err');
  if (qty > item.stock) return toast('Stok yetersiz. Mevcut: ' + num(item.stock) + ' ' + item.unit, 'err');
  if (item.depot !== 'ISG' && !machine) return toast('Kullanılacak makine / bölümü seçin.', 'err');

  const reqDepot = needsDepotApproval(item) && !isUserDepotApprover(state.user, item.depot);
  if (reqDepot) {
    state.pendingCheckout = {
      item, qty, machine,
      requiresManagerFallback: false,
      message: 'Depocu PIN ile anında onay verilebilir veya Onay Havuzuna gönderilebilir.'
    };
    state.approvalTab = 'pin';
    state.showPin = false;
    state.step = 'approval';
    render();
    return;
  }

  await executeCheckout({item, qty, machine, extra: {}});
}

async function executeCheckout({item, qty, machine, extra = {}}) {
  const reqSession = state.session;
  const opName = state.user?.name || '';
  const opUser = state.user ? {...state.user} : null;
  const payload = {
    itemId: item.id,
    qty,
    machine,
    source: 'QR_TERMINAL',
    qrTerminal: true,
    promptDepotApproval: true,
    ...extra
  };

  // Safe for instant optimistic receipt + background save bar:
  // (1) sendApproval to pool, OR (2) direct checkout of ISG / consumable that cannot trigger Kural A or PIN mismatch
  const canOptimistic =
    !!extra.sendApproval ||
    (!extra.depotApproverPin && !extra.managerPin && (item.depot === 'ISG' || isConsumable(item)) && (!needsDepotApproval(item) || isUserDepotApprover(opUser, item.depot)));

  if (canOptimistic) {
    const localId = uid('LOC');
    const prevStock = Number(item.stock) || 0;
    const estRemaining = extra.sendApproval ? prevStock : Math.max(0, prevStock - qty);
    if (!extra.sendApproval) patchCachedStock(item.id, estRemaining, true);

    const optimisticReceipt = extra.sendApproval ? {
      _localId: localId,
      status: 'pending',
      title: 'Depocu Onayına Gönderiliyor',
      subtitle: 'Talep sisteme kaydediliyor...',
      refId: 'Kaydediliyor...',
      itemName: item.name,
      itemCode: item.code,
      qty,
      unit: item.unit,
      remaining: prevStock,
      machine,
      operator: opName,
      approvalLabel: 'Depocu Onayı Bekliyor',
      time: nowStr()
    } : {
      _localId: localId,
      status: 'deducted',
      title: 'Stoktan Düşüldü',
      subtitle: 'Kayıt Google Sheets’e aktarılıyor...',
      refId: 'Kaydediliyor...',
      itemName: item.name,
      itemCode: item.code,
      qty,
      unit: item.unit,
      remaining: estRemaining,
      machine,
      operator: opName,
      approvalLabel: isUserDepotApprover(opUser, item.depot) && needsDepotApproval(item) ? 'Yetkili Onaylı (' + opName + ')' : 'Direkt Çıkış',
      time: nowStr()
    };

    vibrate(55);
    pushHistory(optimisticReceipt);
    state.receipt = optimisticReceipt;
    state.user = null;
    state.session = '';
    state.pendingCheckout = null;
    state.step = 'receipt';
    render();

    beginSave(extra.sendApproval ? 'Onay talebi kaydediliyor...' : `${item.name} çıkışı kaydediliyor...`);
    api('checkout', payload, reqSession).then(r => {
      if (r.depotApprovalRequired || r.approvalRequired) {
        if (!extra.sendApproval) patchCachedStock(item.id, prevStock, true);
        removeHistoryEntry(localId);
        endSave(false, r.message || 'Ek onay gerekli.');
        toast(r.message || 'Ek onay gerekli.', 'warn');
        return;
      }
      const finalRemaining = r.remaining !== undefined ? r.remaining : estRemaining;
      if (!r.pending) patchCachedStock(item.id, finalRemaining, true);
      const patch = r.pending ? {
        title: 'Depocu Onayına Gönderildi',
        subtitle: 'Depocu onayladığında stoktan düşülecektir.',
        refId: r.id || ''
      } : {
        subtitle: 'Parça başarıyla stoktan düşüldü.',
        refId: r.id || '',
        remaining: finalRemaining
      };
      updateHistoryEntry(localId, patch);
      if (state.receipt && state.receipt._localId === localId) {
        Object.assign(state.receipt, patch);
        if (state.tab === 'scan' && state.step === 'receipt') render();
      }
      endSave(true, extra.sendApproval ? 'Onay talebi kaydedildi ✓' : `Çıkış kaydedildi (${num(qty)} ${item.unit}) ✓`);
    }).catch(err => {
      if (!extra.sendApproval) patchCachedStock(item.id, prevStock, true);
      removeHistoryEntry(localId);
      endSave(false, 'Kayıt başarısız: ' + err.message);
      vibrate([50, 40, 50]);
      toast('Kayıt hatası: ' + err.message, 'err');
    });
    return;
  }

  // Synchronous verification path (Kural A machine part or PIN approval) — uses non-blocking top saving bar
  beginSave(extra.depotApproverPin || extra.managerPin ? 'Onay doğrulanıyor ve kaydediliyor...' : 'Çıkış kaydediliyor...');
  try {
    const r = await api('checkout', payload, reqSession);

    if (r.depotApprovalRequired || r.approvalRequired) {
      endSave(false, 'Onay gerekli');
      state.pendingCheckout = {
        item, qty, machine,
        requiresManagerFallback: !r.depotApprovalRequired && !!r.approvalRequired,
        message: r.message
      };
      state.approvalTab = 'pin';
      state.showPin = false;
      state.step = 'approval';
      render();
      return;
    }

    if (r.pending) {
      state.receipt = {
        status: 'pending',
        title: 'Depocu Onayına Gönderildi',
        subtitle: 'Depocu onayladığında stoktan düşülecektir.',
        refId: r.id,
        itemName: item.name,
        itemCode: item.code,
        qty,
        unit: item.unit,
        remaining: item.stock,
        machine,
        operator: opName,
        approvalLabel: 'Depocu Onayı Bekliyor',
        time: nowStr()
      };
    } else {
      const finalRem = r.remaining !== undefined ? r.remaining : Math.max(0, item.stock - qty);
      patchCachedStock(item.id, finalRem, true);
      const apprLabel = r.depotApproved && r.approver
        ? 'Depocu Onaylı (' + r.approver + ')'
        : isUserDepotApprover(opUser, item.depot) && needsDepotApproval(item)
          ? 'Yetkili Onaylı (' + opName + ')'
          : 'Direkt Çıkış';
      state.receipt = {
        status: 'deducted',
        title: 'Stoktan Düşüldü',
        subtitle: r.depotApproved ? 'Depocu onayı alındı ve stok güncellendi.' : 'Parça doğrudan stoktan düşüldü.',
        refId: r.id || '',
        itemName: item.name,
        itemCode: item.code,
        qty,
        unit: item.unit,
        remaining: finalRem,
        machine,
        operator: opName,
        approvalLabel: apprLabel,
        time: nowStr()
      };
    }

    endSave(true, r.pending ? 'Onay talebi kaydedildi ✓' : `Çıkış kaydedildi (${num(qty)} ${item.unit}) ✓`);
    vibrate(60);
    pushHistory(state.receipt);
    if (r.autoLogout !== false) {
      state.user = null;
      state.session = '';
    }
    state.pendingCheckout = null;
    state.step = 'receipt';
    render();
  } catch (err) {
    endSave(false, err.message);
    vibrate([40, 40, 40]);
    toast(err.message, 'err');
  }
}

function updatePinInput(inp, nextVal) {
  if (!inp) return;
  inp.value = nextVal.slice(0, 8);
  inp.closest('.pin-box')?.classList.toggle('filled', inp.value.length > 0);
}

// Events

// Physical keyboard support for PIN screens without opening mobile soft keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#qrModal').hidden) { closeQrModal(); return; }
  if (!$('#installModal').hidden || !$('#qrModal').hidden) return;
  if (state.tab !== 'scan') return;
  const inp = state.step === 'pin' ? $('#opPinInput') : (state.step === 'approval' && state.approvalTab === 'pin' ? $('#depotPinInput') : null);
  if (!inp) return;
  if (/^\d$/.test(e.key)) {
    e.preventDefault();
    updatePinInput(inp, inp.value + e.key);
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    updatePinInput(inp, inp.value.slice(0, -1));
  } else if (e.key === 'Enter') {
    e.preventDefault();
    inp.closest('form')?.requestSubmit();
  }
});

document.addEventListener('click', async e => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) {
    vibrate(10);
    const target = navBtn.dataset.nav;
    if (target === 'scan' && (state.step === 'closed' || (state.tab === 'scan' && state.step !== 'scan'))) return resetToScan();
    state.tab = target;
    render();
    return;
  }

  const prefBtn = e.target.closest('[data-pref]');
  if (prefBtn) {
    const k = prefBtn.dataset.pref;
    state.prefs[k] = !state.prefs[k];
    savePrefs(state.prefs);
    vibrate(12);
    if (k === 'wakeLock' && !state.prefs.wakeLock) releaseWakeLock();
    render();
    return;
  }

  const qrBtn = e.target.closest('[data-qr]');
  if (qrBtn) { vibrate(25); return selectQrCode(qrBtn.dataset.qr); }

  const keyBtn = e.target.closest('[data-key]');
  if (keyBtn) {
    vibrate(12);
    const pad = keyBtn.closest('[data-keypad]');
    const inp = $('#' + pad.dataset.keypad);
    if (!inp) return;
    const k = keyBtn.dataset.key;
    if (k === 'CLR') updatePinInput(inp, '');
    else if (k === 'DEL') updatePinInput(inp, inp.value.slice(0, -1));
    else updatePinInput(inp, inp.value + k);
    return;
  }

  const fillOp = e.target.closest('[data-fill-op]');
  if (fillOp) { vibrate(15); return updatePinInput($('#opPinInput'), fillOp.dataset.fillOp); }

  const fillDepot = e.target.closest('[data-fill-depot]');
  if (fillDepot) { vibrate(15); return updatePinInput($('#depotPinInput'), fillDepot.dataset.fillDepot); }

  const qtyBtn = e.target.closest('[data-qty]');
  if (qtyBtn) {
    vibrate(12);
    const inp = $('#qtyInput');
    if (!inp || inp.disabled) return;
    const max = Number(inp.max) || 999999;
    const min = Number(inp.min) || 1;
    const next = Math.min(max, Math.max(min, Number((Number(inp.value || 0) + Number(qtyBtn.dataset.qty)).toFixed(2))));
    inp.value = next;
    return;
  }

  const apTab = e.target.closest('[data-ap-tab]');
  if (apTab) {
    state.approvalTab = apTab.dataset.apTab;
    render();
    return;
  }

  const mailPreset = e.target.closest('[data-mail-preset]');
  if (mailPreset) {
    vibrate(10);
    toggleMailPreset(mailPreset.dataset.mailPreset);
    return;
  }

  const poPickBtn = e.target.closest('[data-po-pick]');
  if (poPickBtn) {
    openOrderStockPicker(Number(poPickBtn.dataset.poPick));
    return;
  }

  const poPickItem = e.target.closest('[data-po-pick-item]');
  if (poPickItem && state.orderDraft) {
    const it = (state.stock || []).find(x => x.id === poPickItem.dataset.poPickItem);
    const idx = Number(poPickItem.dataset.poPickRow);
    if (it && state.orderDraft.items[idx]) {
      const defQty = Math.max(1, Number(((Number(it.min) || 1) - (Number(it.stock) || 0)).toFixed(2)) || 1);
      state.orderDraft.items[idx] = {
        ...state.orderDraft.items[idx],
        itemId: it.id,
        name: it.name,
        code: it.code || '',
        supplier: it.company || '',
        qty: defQty,
        unit: it.unit || 'AD',
        unitPrice: Number(it.unitPrice) || 0,
        currency: 'TL',
        total: Math.round(defQty * (Number(it.unitPrice) || 0) * 100) / 100,
        deliveryDate: state.orderDraft.items[idx].deliveryDate || state.orderDraft.requestDate || todayTr()
      };
      if (!state.orderDraft.department && it.machine) {
        const firstMac = String(it.machine).split('|')[0].trim();
        state.orderDraft.department = firstMac;
        state.orderDraft.costCenter = resolveCostCenterForDepartment(firstMac);
      }
      closeQrModal();
      render();
    }
    return;
  }

  const ordViewBtn = e.target.closest('[data-order-view]');
  if (ordViewBtn) {
    syncOrderDraftFromDom();
    state.orderViewMode = ordViewBtn.dataset.orderView === 'sheet' ? 'sheet' : 'mobile';
    render();
    return;
  }

  const poClearBtn = e.target.closest('[data-po-clear]');
  if (poClearBtn && state.orderDraft) {
    syncOrderDraftFromDom();
    const idx = Number(poClearBtn.dataset.poClear);
    if (state.orderDraft.items[idx]) {
      state.orderDraft.items[idx] = makeOrderRow();
      render();
    }
    return;
  }

  const act = e.target.closest('[data-action]')?.dataset.action;
  if (!act) return;

  if (act === 'install-pwa') return triggerInstallPwa();
  if (act === 'close-install') { $('#installModal').hidden = true; return; }
  if (act === 'close-qr-modal') { closeQrModal(); return; }
  if (act === 'dismiss-install') {
    state.installDismissed = true;
    try { sessionStorage.setItem('depo.qr.installDismissed', '1'); } catch {}
    render();
    return;
  }
  if (act === 'clear-history') {
    state.history = [];
    try { localStorage.removeItem(HIST_KEY); } catch {}
    toast('Son işlemler temizlendi.');
    render();
    return;
  }
  if (act === 'open-settings') { state.tab = 'settings'; render(); return; }
  if (act === 'start-cam') return startCamera(false);
  if (act === 'stop-cam') return closeCameraByUser();
  if (act === 'exit-terminal') return exitTerminal();
  if (act === 'toggle-torch') return toggleTorch();
  if (act === 'reset-scan') return resetToScan();
  if (act === 'cabinet-show-all') { state.cabinetShowAll = true; state.cabinetQuery = ''; render(); return; }
  if (act === 'refresh-cabinet') {
    if (!state.session) return resetToScan();
    beginSave('Canlı stok yenileniyor...');
    try {
      const boot = await api('bootstrap', {}, state.session);
      state.stock = boot.stock || [];
      saveStockCache(state.stock, boot.lists?.machines || state.machines, boot.lists?.costCenters || state.costCenters, boot.lists?.machineCostCenters || state.machineCostCenters, boot.apiVersion || '', boot.lists?.companies || state.companies, boot.lists?.units || state.units);
      endSave(true, 'Stok güncellendi ✓');
      render();
    } catch (err) {
      endSave(false, err.message);
      toast(err.message, 'err');
    }
    return;
  }
  if (act === 'start-order') { vibrate(18); return startOrderFlow(null); }
  if (act === 'order-this-part') { vibrate(18); return startOrderFlow(state.item); }
  if (act === 'order-notfound') { vibrate(18); return startOrderFlow({code: state.scannedQr, name: state.scannedQr, unit: 'AD', stock: 0, min: 1}); }
  if (act === 'ord-add-row') {
    syncOrderDraftFromDom();
    if (state.orderDraft) {
      if (state.orderViewMode === 'mobile') {
        const emptyIdx = state.orderDraft.items.findIndex((it, i) => i > 0 && !String(it.name || '').trim() && !String(it.code || '').trim() && !(Number(it.qty) > 0) && !it._showMobile);
        if (emptyIdx >= 0) state.orderDraft.items[emptyIdx]._showMobile = true;
        else state.orderDraft.items.push(Object.assign(makeOrderRow(), {_showMobile: true}));
      } else {
        state.orderDraft.items.push(makeOrderRow());
      }
      render();
    }
    return;
  }
  if (act === 'ord-submit') return submitOrderForm();
  if (act === 'ord-print-draft') {
    const d = syncOrderDraftFromDom();
    if (!d || !validateOrderDraft(d)) return;
    printPurchaseOrder(d);
    return;
  }
  if (act === 'ord-email-draft') {
    const d = syncOrderDraftFromDom();
    if (!d || !validateOrderDraft(d)) return;
    openOrderEmailModal(d, state.session);
    return;
  }
  if (act === 'ord-email-preview') {
    if (activeEmailOrder) printPurchaseOrder(activeEmailOrder);
    return;
  }
  if (act === 'ord-email-send') return submitOrderEmail();
  if (act === 'ord-email-all') return toggleAllMailPresets();
  if (act === 'receipt-email-order') {
    if (state.receipt?._order) openOrderEmailModal(state.receipt._order, state.receipt._session || '');
    return;
  }
  if (act === 'receipt-print-order') {
    if (state.receipt?._order) printPurchaseOrder(state.receipt._order);
    return;
  }
  if (act === 'back-to-part') { state.step = 'part'; return render(); }
  if (act === 'toggle-pin-eye') {
    state.showPin = !state.showPin;
    const inp = $('#opPinInput') || $('#depotPinInput');
    if (inp) inp.type = state.showPin ? 'text' : 'password';
    return;
  }

  if (act === 'reject-local') {
    const pc = state.pendingCheckout;
    state.receipt = {
      status: 'rejected',
      title: 'Çıkış Onaylanmadı',
      subtitle: 'Depocu onayı verilmediği için stoktan düşüm yapılmadı.',
      refId: '',
      itemName: pc.item.name,
      itemCode: pc.item.code,
      qty: pc.qty,
      unit: pc.item.unit,
      remaining: pc.item.stock,
      machine: pc.machine,
      operator: state.user?.name || '',
      approvalLabel: 'Depocu İptal Etti',
      time: nowStr()
    };
    pushHistory(state.receipt);
    state.user = null;
    state.session = '';
    state.pendingCheckout = null;
    state.step = 'receipt';
    render();
    return;
  }

  if (act === 'send-pool') {
    const pc = state.pendingCheckout;
    if (!pc) return;
    return executeCheckout({item: pc.item, qty: pc.qty, machine: pc.machine, extra: {sendApproval: true}});
  }

  if (act === 'test-conn') {
    const oldMode = state.mode, oldUrl = state.directUrl;
    state.mode = $('#connMode')?.value || state.mode;
    state.directUrl = ($('#connUrl')?.value || '').trim();
    setBusy(true);
    try { await api('health'); toast('Bağlantı başarılı.'); }
    catch (err) { toast(err.message, 'err'); }
    finally { state.mode = oldMode; state.directUrl = oldUrl; setBusy(false); }
    return;
  }
  if (act === 'save-conn') {
    const mode = $('#connMode')?.value || 'demo';
    const url = ($('#connUrl')?.value || '').trim();
    if (mode === 'direct' && !url) return toast('Doğrudan mod için /exec adresi girin.', 'err');
    state.mode = mode;
    state.directUrl = url;
    localStorage.setItem('depo.mode', mode);
    localStorage.setItem('depo.directUrl', url);
    updateConnBadge();
    toast('Bağlantı ayarı kaydedildi.');
    resetToScan();
    return;
  }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === 'opPinForm') return submitOpPin($('#opPinInput')?.value);
  if (id === 'partCheckoutForm') {
    const fd = new FormData(e.target);
    return initiatePartCheckout(state.item, Number(fd.get('qty')), String(fd.get('machine') || '').trim());
  }
  if (id === 'cabinetForm') {
    const fd = new FormData(e.target);
    const item = state.stock.find(x => x.id === fd.get('cabItem'));
    if (!item) return toast('Bir İSG ekipmanı seçin.', 'err');
    return initiatePartCheckout(item, Number(fd.get('qty')), 'PERSONEL KKD');
  }
  if (id === 'depotApproveForm') {
    const pc = state.pendingCheckout;
    const pin = String($('#depotPinInput')?.value || '').replace(/\s+/g, '').trim();
    if (!pin) return toast('Depocu PIN’ini tuşlayın.', 'err');
    const extra = pc.requiresManagerFallback ? {managerPin: pin} : {depotApproverPin: pin};
    return executeCheckout({item: pc.item, qty: pc.qty, machine: pc.machine, extra});
  }
  if (id === 'akgOrderForm') return submitOrderForm();
  if (id === 'orderEmailForm') return submitOrderEmail();
});

document.addEventListener('input', e => {

  }

  if (e.target.dataset?.poField && state.orderDraft) {
    const idx = Number(e.target.dataset.idx), f = e.target.dataset.poField;
    e.target.classList.remove('po-field-err');
    if (state.orderDraft.items[idx]) {
      state.orderDraft.items[idx][f] = (f === 'qty' || f === 'unitPrice') ? (Number(e.target.value) || 0) : e.target.value;

        const autoDate = state.orderDraft.requestDate || todayTr();

        if (dtInp && !dtInp.value.trim()) dtInp.value = autoDate;
      }
      if (f === 'qty' || f === 'unitPrice') recalcOrderRow(idx);
    }
    return;
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'poDepartment' && state.orderDraft) {
    e.target.classList.remove('po-field-err');
    const dep = e.target.value.trim();
    state.orderDraft.department = dep;
    const cc = dep ? resolveCostCenterForDepartment(dep) : '';
    state.orderDraft.costCenter = cc;
    if ($('#poCostCenter')) $('#poCostCenter').value = cc;
    return;
  }
  if (e.target.dataset?.poField && state.orderDraft) {
    const idx = Number(e.target.dataset.idx), f = e.target.dataset.poField;
    if (state.orderDraft.items[idx]) {
      state.orderDraft.items[idx][f] = (f === 'qty' || f === 'unitPrice') ? (Number(e.target.value) || 0) : e.target.value;
      if (f === 'qty' || f === 'unitPrice') recalcOrderRow(idx);
    }
  }
});

$('#installModal').addEventListener('click', e => {
  if (e.target === $('#installModal')) $('#installModal').hidden = true;
});
$('#qrModal').addEventListener('click', e => {
  if (e.target === $('#qrModal')) closeQrModal();
});
$('#saveBar').addEventListener('click', () => {
  if ($('#saveBar').classList.contains('err')) $('#saveBar').hidden = true;
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera();
  else if (state.tab === 'scan' && state.step === 'scan' && !state.camActive && !state.camError && !state.camStoppedByUser) startCamera(true);
});
window.addEventListener('pagehide', () => stopCamera());
window.addEventListener('pageshow', () => {
  if (state.tab === 'scan' && state.step === 'scan' && !state.camActive && !state.camError && !state.camStoppedByUser) startCamera(true);
});

warmupGas();
if (autoConfiguredNow) toast('Canlı depo bağlantısı otomatik kuruldu. Üstten "Kur" diyerek ana ekrana ekleyin.');
if (state.scannedQr) state.step = 'pin';
render();
})();
</script>
</body>
</html>
