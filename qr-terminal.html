<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Depo QR Çıkış Terminali · Mekanik + İSG Depo V8.7</title>
<meta name="description" content="Bağımsız depo QR okuma, operatör PIN doğrulama ve depocu onaylı malzeme çıkış terminali.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9;
  --surface:#FFFFFF;
  --surface-2:#F8FAFC;
  --ink:#0F172A;
  --ink-2:#334155;
  --muted:#64748B;
  --border:#E2E8F0;
  --border-strong:#CBD5E1;
  --orange:#EA580C;
  --orange-hover:#C2410C;
  --orange-soft:#FFF7ED;
  --orange-line:#FED7AA;
  --green:#16A34A;
  --green-soft:#F0FDF4;
  --green-line:#BBF7D0;
  --amber:#D97706;
  --amber-soft:#FFFBEB;
  --amber-line:#FDE68A;
  --blue:#2563EB;
  --blue-soft:#EFF6FF;
  --blue-line:#BFDBFE;
  --red:#DC2626;
  --red-soft:#FEF2F2;
  --red-line:#FECACA;
  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 3px rgba(15,23,42,.06),0 8px 24px -6px rgba(15,23,42,.06);
  --font:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:17px;height:17px}
.ic-lg{width:26px;height:26px}

/* Top Bar */
.topbar{
  position:sticky;top:0;z-index:20;
  background:#0F172A;color:#F8FAFC;
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:12px 16px;
}
.topbar-in{
  max-width:540px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{
  width:36px;height:36px;border-radius:10px;flex:none;
  background:var(--orange);color:#fff;font-weight:800;font-size:16px;
  display:grid;place-items:center;letter-spacing:-.02em;
}
.brand b{display:block;font-size:15px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:#94A3B8;font-weight:500}
.conn-btn{
  display:inline-flex;align-items:center;gap:7px;
  height:36px;padding:0 12px;border-radius:9px;
  border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);
  color:#E2E8F0;font-size:13px;font-weight:600;transition:.15s;flex:none;
}
.conn-btn:hover{background:rgba(255,255,255,.12)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.demo{background:#F59E0B}
.dot.direct{background:#22C55E}
.dot.proxy{background:#38BDF8}

/* Main Container */
.wrap{max-width:540px;margin:0 auto;padding:18px 16px 40px}

/* Stepper */
.steps{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  margin-bottom:16px;
}
.step{
  display:flex;align-items:center;gap:8px;
  padding:10px 11px;border-radius:11px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--muted);font-size:13px;font-weight:600;
  transition:.15s;
}
.step i{
  width:22px;height:22px;border-radius:7px;flex:none;
  display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;
  background:var(--surface-2);border:1px solid var(--border);color:var(--muted);
}
.step.active{border-color:var(--orange);color:var(--ink);background:var(--orange-soft)}
.step.active i{background:var(--orange);border-color:var(--orange);color:#fff}
.step.done{border-color:var(--green-line);color:#15803D;background:var(--green-soft)}
.step.done i{background:var(--green);border-color:var(--green);color:#fff}

/* Card */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow);
  overflow:hidden;
}
.card + .card{margin-top:14px}
.card-head{
  padding:18px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.card-head h1,.card-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.card-head p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
.card-body{padding:20px}

/* Scanned QR Banner */
.qr-banner{
  background:#0F172A;color:#F8FAFC;
  padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.qr-banner-left{display:flex;align-items:center;gap:12px;min-width:0}
.qr-badge-ic{
  width:40px;height:40px;border-radius:10px;flex:none;
  background:rgba(234,88,12,.18);color:#FB923C;
  border:1px solid rgba(234,88,12,.35);display:grid;place-items:center;
}
.qr-banner small{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#94A3B8;font-weight:700}
.qr-banner strong{display:block;font-size:17px;font-weight:700;color:#FFFFFF;word-break:break-all}
.qr-change{
  border:1px solid rgba(255,255,255,.18);background:transparent;color:#CBD5E1;
  border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:600;flex:none;
}
.qr-change:hover{background:rgba(255,255,255,.1);color:#fff}

/* Camera Scanner */
.cam-box{
  position:relative;border-radius:12px;overflow:hidden;
  background:#0B1220;aspect-ratio:4/3;margin-bottom:14px;
  border:1px solid #1E293B;display:grid;place-items:center;
}
.cam-box video{width:100%;height:100%;object-fit:cover;display:block}
.cam-placeholder{text-align:center;padding:24px;color:#94A3B8}
.cam-placeholder .cam-ic{
  width:56px;height:56px;margin:0 auto 12px;border-radius:14px;
  background:rgba(234,88,12,.14);color:#FB923C;border:1px solid rgba(234,88,12,.3);
  display:grid;place-items:center;
}
.cam-placeholder b{display:block;color:#F8FAFC;font-size:15.5px;margin-bottom:4px}
.cam-placeholder p{margin:0 0 14px;font-size:13.5px;color:#94A3B8}
.cam-reticle{
  position:absolute;inset:16% 20%;pointer-events:none;
  border:2px solid rgba(255,255,255,.35);border-radius:14px;
  box-shadow:0 0 0 999px rgba(11,18,32,.42);
}
.cam-reticle::after{
  content:'';position:absolute;left:8%;right:8%;top:50%;height:2px;
  background:var(--orange);box-shadow:0 0 12px var(--orange);
  animation:scanline 2s ease-in-out infinite;
}
@keyframes scanline{0%,100%{transform:translateY(-44px)}50%{transform:translateY(44px)}}
.cam-status{
  position:absolute;left:12px;right:12px;bottom:12px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:rgba(15,23,42,.82);color:#F8FAFC;backdrop-filter:blur(6px);
  padding:8px 12px;border-radius:9px;font-size:12.5px;font-weight:600;
}

/* Inputs & Buttons */
.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:13.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.field > small{display:block;margin-top:5px;font-size:12.5px;color:var(--muted)}
.input,select.input{
  width:100%;height:48px;padding:0 14px;
  border:1.5px solid var(--border-strong);border-radius:var(--radius-sm);
  background:#fff;color:var(--ink);font-size:15.5px;font-weight:500;
  outline:none;transition:.15s;
}
.input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(234,88,12,.14)}
.input[readonly]{background:var(--surface-2);color:var(--ink-2);border-color:var(--border)}

.input-row{display:flex;gap:8px}
.input-row .input{flex:1}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:48px;padding:0 18px;border-radius:var(--radius-sm);
  border:1.5px solid transparent;font-size:15px;font-weight:700;
  transition:.15s;text-decoration:none;white-space:nowrap;
}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wide{width:100%}
.btn.sm{height:40px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--orange);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--orange-hover)}
.btn.success{background:var(--green);color:#fff}
.btn.success:hover:not(:disabled){background:#15803D}
.btn.dark{background:var(--ink);color:#fff}
.btn.dark:hover:not(:disabled){background:#1E293B}
.btn.ghost{background:#fff;border-color:var(--border-strong);color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2);border-color:#94A3B8}
.btn.danger-outline{background:#fff;border-color:var(--red-line);color:var(--red)}
.btn.danger-outline:hover:not(:disabled){background:var(--red-soft)}
.btn-stack{display:flex;flex-direction:column;gap:10px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Demo Samples */
.divider{
  display:flex;align-items:center;gap:10px;
  margin:18px 0 14px;color:var(--muted);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.sample-list{display:flex;flex-direction:column;gap:8px}
.sample-btn{
  width:100%;text-align:left;padding:12px 14px;
  border:1px solid var(--border);border-radius:11px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  transition:.15s;
}
.sample-btn:hover{border-color:var(--orange);background:var(--orange-soft)}
.sample-btn b{display:block;font-size:14.5px;color:var(--ink)}
.sample-btn small{display:block;font-size:12.5px;color:var(--muted)}
.tag{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap;flex:none;
}
.tag.green{background:var(--green-soft);color:#15803D;border:1px solid var(--green-line)}
.tag.amber{background:var(--amber-soft);color:#B45309;border:1px solid var(--amber-line)}
.tag.blue{background:var(--blue-soft);color:#1D4ED8;border:1px solid var(--blue-line)}
.tag.red{background:var(--red-soft);color:#B91C1C;border:1px solid var(--red-line)}
.tag.slate{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}

/* PIN Entry & Keypad */
.pin-display{
  display:flex;align-items:center;justify-content:center;gap:10px;
  height:56px;border-radius:12px;background:var(--surface-2);
  border:1.5px solid var(--border-strong);margin-bottom:12px;padding:0 16px;
}
.pin-display input{
  width:100%;border:0;background:transparent;text-align:center;outline:none;
  font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.35em;color:var(--ink);
}
.keypad{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;
}
.keypad button{
  height:54px;border-radius:11px;border:1px solid var(--border);
  background:#fff;font-size:20px;font-weight:700;font-family:var(--mono);
  color:var(--ink);transition:.12s;
}
.keypad button:hover{background:var(--surface-2);border-color:var(--border-strong)}
.keypad button:active{transform:scale(.97);background:var(--orange-soft);border-color:var(--orange)}
.keypad button.fn{font-family:var(--font);font-size:14px;font-weight:700;color:var(--muted);background:var(--surface-2)}

.demo-hint{
  margin-top:12px;padding:11px 13px;border-radius:10px;
  background:var(--surface-2);border:1px dashed var(--border-strong);
  font-size:13px;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
}
.demo-chips{display:flex;gap:6px;flex-wrap:wrap}
.demo-chip{
  border:1px solid var(--border-strong);background:#fff;border-radius:7px;
  padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--ink);
}
.demo-chip:hover{border-color:var(--orange);color:var(--orange)}

/* Operator Strip */
.op-strip{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);
  font-size:13.5px;
}
.op-user{display:flex;align-items:center;gap:9px;min-width:0}
.op-avatar{
  width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;
  font-size:13px;font-weight:800;display:grid;place-items:center;flex:none;
}
.op-user b{display:block;font-size:13.5px;line-height:1.2}
.op-user small{display:block;font-size:12px;color:var(--muted)}
.link-btn{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:700;padding:6px 8px;border-radius:7px}
.link-btn:hover{background:var(--border);color:var(--ink)}

/* Part Hero Card */
.part-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:16px;
}
.part-title{margin:8px 0 4px;font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.part-meta{font-size:13.5px;color:var(--muted)}
.stock-box{
  text-align:right;padding:10px 14px;border-radius:11px;flex:none;
  background:var(--surface-2);border:1px solid var(--border);min-width:96px;
}
.stock-box.low{background:var(--red-soft);border-color:var(--red-line)}
.stock-box small{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.stock-box strong{display:block;font-size:26px;font-weight:800;line-height:1.15;color:var(--ink)}
.stock-box.low strong{color:var(--red)}
.stock-box span{font-size:12.5px;font-weight:600;color:var(--ink-2)}

.meta-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;
}
.meta-cell{
  padding:10px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);
}
.meta-cell small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.meta-cell b{display:block;font-size:14px;font-weight:700;color:var(--ink);margin-top:2px;word-break:break-word}

/* Rule Callout */
.callout{
  display:flex;align-items:flex-start;gap:11px;
  padding:13px 14px;border-radius:11px;margin-bottom:16px;border:1px solid;
  font-size:13.5px;line-height:1.45;
}
.callout.green{background:var(--green-soft);border-color:var(--green-line);color:#14532D}
.callout.amber{background:var(--amber-soft);border-color:var(--amber-line);color:#78350F}
.callout.red{background:var(--red-soft);border-color:var(--red-line);color:#7F1D1D}
.callout b{display:block;font-size:14px;margin-bottom:2px}

/* Qty Stepper */
.qty-wrap{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.qty-wrap button{
  height:52px;border-radius:10px;border:1.5px solid var(--border-strong);
  background:var(--surface-2);font-size:22px;font-weight:700;color:var(--ink);
}
.qty-wrap button:hover{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
.qty-wrap input{
  height:52px;text-align:center;font-family:var(--mono);font-size:22px;font-weight:800;
  border:1.5px solid var(--border-strong);border-radius:10px;background:#fff;outline:none;
}
.qty-wrap input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(234,88,12,.14)}

/* Cabinet List (ISG-DOLAP) */
.cab-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:290px;overflow:auto}
.cab-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border:1.5px solid var(--border);border-radius:11px;background:#fff;cursor:pointer;transition:.15s;
}
.cab-item:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.cab-item input{width:18px;height:18px;accent-color:var(--blue);flex:none}
.cab-item > div{flex:1;min-width:0}
.cab-item b{display:block;font-size:15px}
.cab-item small{display:block;font-size:12.5px;color:var(--muted)}
.cab-item strong{font-size:15px;font-weight:800;white-space:nowrap}

/* Approval Mode Tabs */
.seg-tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
  padding:4px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);
  margin-bottom:16px;
}
.seg-tabs button{
  height:42px;border:0;border-radius:8px;background:transparent;
  font-size:13.5px;font-weight:700;color:var(--muted);transition:.15s;
}
.seg-tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.1)}

/* Summary Strip inside Approval */
.req-summary{
  padding:13px 14px;border-radius:11px;background:var(--surface-2);border:1px solid var(--border);
  margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
}
.req-summary b{display:block;font-size:15.5px}
.req-summary small{display:block;font-size:13px;color:var(--muted)}
.req-summary strong{font-size:20px;font-weight:800;color:var(--orange)}

/* Receipt */
.receipt-hero{
  text-align:center;padding:24px 20px 18px;border-bottom:1px solid var(--border);
}
.receipt-icon{
  width:60px;height:60px;margin:0 auto 12px;border-radius:16px;
  display:grid;place-items:center;
}
.receipt-icon.green{background:var(--green-soft);color:var(--green);border:1.5px solid var(--green-line)}
.receipt-icon.amber{background:var(--amber-soft);color:var(--amber);border:1.5px solid var(--amber-line)}
.receipt-icon.red{background:var(--red-soft);color:var(--red);border:1.5px solid var(--red-line)}
.receipt-hero h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.receipt-hero p{margin:6px 0 0;font-size:14px;color:var(--muted)}

.receipt-rows{display:flex;flex-direction:column;margin-bottom:18px}
.receipt-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 0;border-bottom:1px solid var(--border);font-size:14.5px;
}
.receipt-row:last-child{border-bottom:0}
.receipt-row span{color:var(--muted);font-weight:500}
.receipt-row b{color:var(--ink);font-weight:700;text-align:right}

/* Modal (Connection Settings) */
.modal-back{
  position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.55);
  backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;
}
.modal-back[hidden]{display:none}
.modal{
  width:100%;max-width:440px;background:#fff;border-radius:var(--radius);
  box-shadow:0 20px 50px rgba(15,23,42,.25);overflow:hidden;border:1px solid var(--border);
}
.modal-head{
  padding:16px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{margin:0;font-size:17px;font-weight:800}
.icon-btn{
  width:34px;height:34px;border-radius:8px;border:1px solid var(--border);
  background:#fff;color:var(--ink-2);display:grid;place-items:center;
}
.icon-btn:hover{background:var(--surface-2)}
.modal-body{padding:18px}

/* Toast */
.toasts{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:60;
  width:calc(100% - 32px);max-width:460px;display:flex;flex-direction:column;gap:8px;pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:12px;
  background:#0F172A;color:#fff;font-size:14px;font-weight:600;
  box-shadow:0 12px 30px rgba(15,23,42,.28);pointer-events:auto;
}
.toast.ok{border-left:4px solid var(--green)}
.toast.err{border-left:4px solid var(--red)}
.toast.warn{border-left:4px solid var(--amber)}

/* Busy bar */
.busy-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:70;overflow:hidden;display:none}
body.busy .busy-bar{display:block}
.busy-bar::after{
  content:'';display:block;width:40%;height:100%;background:var(--orange);
  animation:loading 1s ease-in-out infinite;
}
@keyframes loading{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}

/* Footer */

<script>
(() => {
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s ?? '').trim().toLocaleUpperCase('tr-TR')
  .replace(/İ/g,'I').replace(/Ş/g,'S').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/Ç/g,'C')
  .replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'');
const num = v => new Intl.NumberFormat('tr-TR',{maximumFractionDigits:2}).format(Number(v)||0);
const uid = p => p + '-' + Math.random().toString(36).slice(2,8).toUpperCase();
const nowStr = () => new Date().toLocaleString('tr-TR');

const SVG = {
  qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v3h-3M14 20h7"/>',
  scan: '<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',

  alert: '<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4M12 17h.01"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  arrow: '<path d="M5 12h14M13 5l7 7-7 7"/>',
  camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>'
};
const ic = (name, cls='') => `<span class="ic ${cls}" aria-hidden="true"><svg viewBox="0 0 24 24">${SVG[name]||''}</svg></span>`;

const ROLE_LABEL = {

  MEK_ADMIN: 'Mekanik Depo Sorumlusu',
  ISG_ADMIN: 'İSG Depo Sorumlusu',

};

// Built-in Demo Dataset (matches main application)
const DEMO = {
  users: [
    {name:'Bakım Operatörü',pin:'1111',role:'OP',active:true},
    {name:'Mekanik Depo Sorumlusu',pin:'2222',role:'MEK_ADMIN',active:true},
    {name:'İSG Depo Sorumlusu',pin:'3333',role:'ISG_ADMIN',active:true},
    {name:'Bakım Şefi',pin:'4444',role:'YONETICI',active:true},

    {name:'Ayşe Demir',pin:'1177',role:'OP',active:true}
  ],
  stock: [
    {id:'MEK-0001',depot:'MEKANIK',type:'MAKİNE PARÇASI',code:'RUL-6205',name:'Rulman 6205 2RS',category:'RULMAN',company:'SKF',unit:'AD',usage:'KRİTİK MALZEME',shelf:'A-01',machine:'Kondanser Boru Makinesi',min:8,stock:24},
    {id:'MEK-0002',depot:'MEKANIK',type:'MAKİNE PARÇASI',code:'KAY-A42',name:'A42 V Kayışı',category:'KAYIŞ',company:'Optibelt',unit:'AD',usage:'PLANLI BAKIM',shelf:'A-04',machine:'Paketleme Makinesi',min:6,stock:4},
    {id:'MEK-0003',depot:'MEKANIK',type:'SARF / ORTAK KULLANIM',code:'YAG-46',name:'Hidrolik Yağ ISO VG 46',category:'YAĞ',company:'Petrol Ofisi',unit:'LİTRE',usage:'BAKIM SARF',shelf:'Y-02',machine:'',min:40,stock:120},
    {id:'MEK-0004',depot:'MEKANIK',type:'MAKİNE PARÇASI',code:'SEN-M18',name:'M18 Endüktif Sensör',category:'SENSÖR',company:'Omron',unit:'AD',usage:'KRİTİK MALZEME | Depo Onayı Gerekli',shelf:'E-03',machine:'Dolum Makinesi',min:5,stock:6},
    {id:'MEK-0005',depot:'MEKANIK',type:'SARF / ORTAK KULLANIM',code:'WD-40',name:'Çok Amaçlı Sprey 400 ml',category:'KİMYASAL',company:'WD-40',unit:'AD',usage:'BAKIM SARF',shelf:'K-02',machine:'',min:12,stock:18},
    {id:'ISG-0001',depot:'ISG',type:'İSG MALZEME',code:'ELD-NIT-L',name:'Nitril Eldiven L',category:'İSG MALZEME',company:'Beybi',unit:'ÇİFT',usage:'İSG / KKD',shelf:'İSG-01',machine:'',min:50,stock:140},
    {id:'ISG-0002',depot:'ISG',type:'İSG MALZEME',code:'GOZ-SEF',name:'Şeffaf Koruyucu Gözlük',category:'İSG MALZEME',company:'3M',unit:'AD',usage:'İSG / KKD',shelf:'İSG-02',machine:'',min:15,stock:32},
    {id:'ISG-0003',depot:'ISG',type:'İSG MALZEME',code:'MAS-FFP2',name:'FFP2 Toz Maskesi',category:'İSG MALZEME',company:'3M',unit:'AD',usage:'İSG / KKD',shelf:'İSG-03',machine:'',min:40,stock:25},
    {id:'ISG-0004',depot:'ISG',type:'İSG MALZEME',code:'KUL-SNR32',name:'Kulak Koruyucu SNR 32',category:'İSG MALZEME',company:'Uvex',unit:'AD',usage:'İSG / KKD',shelf:'İSG-04',machine:'',min:10,stock:16}
  ],

function readInitialQr() {
  const qs = new URLSearchParams(location.search);
  const q = qs.get('qr') || qs.get('code') || qs.get('id') || '';
  if (q) return q.trim();
  if (location.hash && location.hash.startsWith('#qr=')) {
    return decodeURIComponent(location.hash.slice(4)).trim();
  }
  return '';
}

const state = {
  mode: localStorage.getItem('depo.mode') || 'demo',
  directUrl: localStorage.getItem('depo.directUrl') || '',
  step: 'scan', // 'scan' | 'pin' | 'part' | 'cabinet' | 'approval' | 'receipt'
  scannedQr: readInitialQr(),
  user: null,
  session: '',
  stock: [],
  machines: [],
  item: null,
  pendingCheckout: null, // { item, qty, machine, requiresManagerFallback }
  approvalTab: 'pin', // 'pin' | 'pool'
  receipt: null
};

let cameraStream = null;
let cameraTimer = null;

function needsDepotApproval(item) {
  return norm(item?.usage || '').includes('DEPO_ONAYI_GEREKLI');
}
function isUserDepotApprover(user, depot) {
  if (!user) return false;
  if (user.role === 'YONETICI') return true;
  if (depot === 'ISG' && user.role === 'ISG_ADMIN') return true;
  if (depot !== 'ISG' && user.role === 'MEK_ADMIN') return true;
  return false;
}
function isConsumable(item) {
  return !item.machine || /SARF|ORTAK/.test(norm(item.type + ' ' + item.usage));
}

function setBusy(v) {
  document.body.classList.toggle('busy', v);
}
function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `${ic(type === 'err' ? 'alert' : type === 'warn' ? 'clock' : 'check', 'ic-sm')}<span>${esc(msg)}</span>`;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), 4200);
}

function updateConnBadge() {
  const dot = $('#connDot'), lbl = $('#connLabel');
  dot.className = 'dot ' + state.mode;
  lbl.textContent = state.mode === 'demo' ? 'Demo' : state.mode === 'direct' ? 'Canlı GAS' : '/api/gas';
}

function updateStepper() {
  const stepNum = state.step === 'scan' ? 1 : state.step === 'pin' ? 2 : 3;
  $$('#stepper .step').forEach(el => {
    const n = Number(el.dataset.step);
    el.classList.toggle('active', n === stepNum);
    el.classList.toggle('done', n < stepNum || state.step === 'receipt');
  });
}

// API client (Demo / Direct GAS / Proxy /api/gas)
async function api(action, payload = {}) {
  if (state.mode === 'demo') return demoApi(action, payload);
  const endpoint = state.mode === 'direct' ? state.directUrl : '/api/gas';
  if (!endpoint) throw new Error('Apps Script /exec adresi tanımlı değil. Sağ üstten Bağlantı Ayarı’nı açın.');
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: {'Content-Type': state.mode === 'direct' ? 'text/plain;charset=utf-8' : 'application/json'},
    body: JSON.stringify({action, payload, session: state.session})
  });
  const out = await res.json().catch(() => ({ok:false, error:'Sunucu geçerli JSON döndürmedi.'}));
  if (!res.ok || !out.ok) throw new Error(out.error || ('HTTP ' + res.status));
  return out.data;
}

async function demoApi(action, p = {}) {
  await new Promise(r => setTimeout(r, 110));
  if (action === 'health') return {service:'DEMO', time: nowStr()};
  if (action === 'auth') {
    const clean = String(p.pin || '').replace(/\s+/g, '').trim();
    if (!/^\d{4,8}$/.test(clean)) throw new Error('PIN 4-8 rakam olmalıdır.');
    const u = DEMO.users.find(x => x.pin === clean && x.active);
    if (!u) throw new Error('Geçersiz PIN. (Demo OP PIN: 1111)');
    return {user:{name:u.name, role:u.role}, session:'demo-' + u.role};
  }
  if (!state.user) throw new Error('Oturum gerekli.');
  if (action === 'bootstrap') {
    const stock = DEMO.stock.filter(x =>
      state.user.role === 'YONETICI' || state.user.role === 'OP' ||
      (state.user.role === 'MEK_ADMIN' && x.depot === 'MEKANIK') ||
      (state.user.role === 'ISG_ADMIN' && x.depot === 'ISG')
    );
    return {user:state.user, stock, lists:{machines: DEMO.machines}};
  }
  if (action === 'checkout') {
    const item = DEMO.stock.find(x => x.id === p.itemId || norm(x.code) === norm(p.code));
    if (!item) throw new Error('Stok kartı bulunamadı.');
    const qty = Number(p.qty);
    if (!qty || qty <= 0) throw new Error('Miktar 0’dan büyük olmalıdır.');
    if (qty > item.stock) throw new Error('Yetersiz stok. Mevcut: ' + item.stock + ' ' + item.unit);
    const machine = item.depot === 'ISG' ? (p.machine || 'PERSONEL KKD') : (isConsumable(item) ? String(p.machine || '').trim() : item.machine);
    if (item.depot !== 'ISG' && !machine) throw new Error('Kullanılacak makine / bölüm seçin.');

    const reqDepot = needsDepotApproval(item) && !isUserDepotApprover(state.user, item.depot);
    if (reqDepot) {
      if (p.depotApproverPin) {
        const clean = String(p.depotApproverPin).replace(/\s+/g, '').trim();
        const approver = DEMO.users.find(x => x.pin === clean && x.active && isUserDepotApprover(x, item.depot));
        if (!approver) throw new Error('Depocu PIN geçersiz veya bu depo için yetkisiz. (Demo: 2222 / 3333 / 4444)');
        item.stock = Number((item.stock - qty).toFixed(2));
        return {
          completed: true,
          depotApproved: true,
          approver: approver.name,
          id: uid('CIK'),
          remaining: item.stock,
          autoLogout: state.user.role === 'OP'
        };
      }
      if (p.sendApproval) {
        const reqId = uid('ONAY');
        DEMO.approvals.unshift({id:reqId, itemId:item.id, qty, machine, requester:state.user.name, status:'BEKLIYOR'});
        return {
          pending: true,
          depotApproval: true,
          id: reqId,
          remaining: item.stock,
          message: 'Depocu onay havuzuna gönderildi. Talep No: ' + reqId,
          autoLogout: state.user.role === 'OP'
        };
      }
      return {depotApprovalRequired: true, message: 'Bu parça için Depo Onayı Gerekli.'};
    }

    // Depo onayı gerekmiyorsa direkt düşer
    item.stock = Number((item.stock - qty).toFixed(2));
    return {
      completed: true,
      id: uid('CIK'),
      remaining: item.stock,
      autoLogout: state.user.role === 'OP'
    };
  }
  throw new Error('Desteklenmeyen işlem: ' + action);
}

// Camera Scanner Controls
function stopCamera() {
  if (cameraTimer) clearInterval(cameraTimer);
  cameraTimer = null;
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}

async function startCamera() {
  stopCamera();
  const box = $('#camBox');
  if (!box) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('Bu tarayıcıda kamera desteği yok; kodu elle girebilirsiniz.', 'warn');
    return;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    box.innerHTML = `<video id="camVideo" playsinline muted autoplay></video><div class="cam-reticle"></div><div class="cam-status"><span>${'BarcodeDetector' in window ? 'QR kodu çerçeveye hizalayın...' : 'Kamera açık · Otomatik okuma desteklenmiyor, kodu alta yazın'}</span><button class="qr-change" type="button" data-action="stop-cam">Kapat</button></div>`;
    const v = $('#camVideo');
    v.srcObject = cameraStream;
    await v.play();
    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({formats:['qr_code']});
      cameraTimer = setInterval(async () => {
        try {
          const codes = await detector.detect(v);
          if (codes[0]?.rawValue) {
            const raw = extractCodeFromQr(codes[0].rawValue);
            if (raw) selectQrCode(raw);
          }
        } catch {}
      }, 380);
    }
  } catch (err) {
    toast('Kamera açılamadı. Kodu elle girebilir veya aşağıdan seçebilirsiniz.', 'err');
  }
}

function extractCodeFromQr(raw) {
  const s = String(raw || '').trim();
  if (!s) return '';
  // If QR contains a URL with ?qr=CODE, extract the CODE parameter
  try {
    if (/^https?:\/\//i.test(s)) {
      const u = new URL(s);
      const q = u.searchParams.get('qr') || u.searchParams.get('code') || u.searchParams.get('id');
      if (q) return q.trim();
    }
  } catch {}
  return s;
}

function selectQrCode(code) {
  const clean = extractCodeFromQr(code);
  if (!clean) return toast('Lütfen geçerli bir QR kodu girin.', 'err');
  stopCamera();
  state.scannedQr = clean;
  // Always require OP PIN first when scanning a new QR code!
  state.user = null;
  state.session = '';
  state.item = null;
  state.pendingCheckout = null;
  state.step = 'pin';
  render();
}

function resetToScan() {
  stopCamera();
  state.scannedQr = '';
  state.user = null;
  state.session = '';
  state.stock = [];
  state.item = null;
  state.pendingCheckout = null;
  state.receipt = null;
  state.step = 'scan';
  if (location.search) {
    try { history.replaceState(null, '', location.pathname); } catch {}
  }
  render();
}

function resolveScannedItem() {
  const code = state.scannedQr;
  if (norm(code) === 'ISG_DOLAP') {
    state.item = null;
    state.step = 'cabinet';
    render();
    return;
  }
  const found = state.stock.find(x => norm(x.id) === norm(code) || norm(x.code) === norm(code));
  if (!found) {
    toast('Okutulan QR stok kartıyla eşleşmedi: ' + code, 'err');
    state.item = null;
    state.step = 'notfound';
    render();
    return;
  }
  state.item = found;
  state.step = 'part';
  render();
}

// Render Views
function render() {
  updateConnBadge();
  updateStepper();
  const root = $('#view');
  if (state.step === 'scan') root.innerHTML = renderScan();
  else if (state.step === 'pin') root.innerHTML = renderPin();
  else if (state.step === 'part') root.innerHTML = renderPart();
  else if (state.step === 'cabinet') root.innerHTML = renderCabinet();
  else if (state.step === 'approval') root.innerHTML = renderApproval();
  else if (state.step === 'receipt') root.innerHTML = renderReceipt();
  else if (state.step === 'notfound') root.innerHTML = renderNotFound();

  // Auto-focus PIN input on desktop without disturbing mobile keyboard unnecessarily
  if (state.step === 'pin') {
    const inp = $('#opPinInput');
    if (inp && window.innerWidth > 720) inp.focus();
  }
}

  return `
  <section class="card">
    <div class="qr-banner">
      <div class="qr-banner-left">
        <div class="qr-badge-ic">${ic('qr')}</div>

// Actions
async function submitOpPin(pinRaw) {
  const pin = String(pinRaw || '').replace(/\s+/g, '').trim();
  if (!pin) return toast('Lütfen operatör PIN’inizi girin.', 'err');
  setBusy(true);
  try {
    const auth = await api('auth', {pin});
    state.user = auth.user;
    state.session = auth.session;
    const boot = await api('bootstrap');
    state.stock = boot.stock || [];
    state.machines = boot.lists?.machines || DEMO.machines;
    resolveScannedItem();
  } catch (err) {
    toast(err.message, 'err');
    const inp = $('#opPinInput');
    if (inp) { inp.value = ''; inp.focus(); }
  } finally {
    setBusy(false);
  }
}

async function initiatePartCheckout(item, qty, machine) {
  if (!item) return;
  if (!qty || qty <= 0) return toast('Geçerli bir miktar girin.', 'err');
  if (qty > item.stock) return toast('Stok yetersiz. Mevcut: ' + num(item.stock) + ' ' + item.unit, 'err');
  if (item.depot !== 'ISG' && !machine) return toast('Kullanılacak makine / bölümü seçin.', 'err');

  const reqDepot = needsDepotApproval(item) && !isUserDepotApprover(state.user, item.depot);
  if (reqDepot) {
    state.pendingCheckout = {
      item, qty, machine,
      requiresManagerFallback: false,
      message: 'Bu parça Depo Onayı Gerekli işaretli. Depocu PIN ile anında onaylayabilir veya havuza gönderebilirsiniz.'
    };
    state.approvalTab = 'pin';
    state.step = 'approval';
    render();
    return;
  }

  // Depo onayı gerekmiyorsa direkt stoktan düş
  await executeCheckout({item, qty, machine, extra: {}});
}

async function executeCheckout({item, qty, machine, extra = {}}) {
  setBusy(true);
  try {
    const payload = {
      itemId: item.id,
      qty,
      machine,
      source: 'QR_TERMINAL',
      qrTerminal: true,
      promptDepotApproval: true,
      ...extra
    };
    const r = await api('checkout', payload);

    // Server indicates depot or manager approval is required
    if (r.depotApprovalRequired || r.approvalRequired) {
      state.pendingCheckout = {
        item, qty, machine,
        requiresManagerFallback: !r.depotApprovalRequired && !!r.approvalRequired,
        message: r.message
      };
      state.approvalTab = 'pin';
      state.step = 'approval';
      render();
      return;
    }

    const opName = state.user?.name || '';
    if (r.pending) {
      state.receipt = {
        status: 'pending',
        title: 'Depocu Onayına Gönderildi',
        subtitle: 'Depocu onayladığında stoktan düşülecektir.',
        refId: r.id,
        itemName: item.name,
        itemCode: item.code,
        qty,
        unit: item.unit,
        remaining: item.stock,
        machine,
        operator: opName,
        approvalLabel: 'Depocu Onayı Bekliyor',
        time: nowStr()
      };
    } else {
      const apprLabel = r.depotApproved && r.approver
        ? 'Depocu Onaylı (' + r.approver + ')'
        : isUserDepotApprover(state.user, item.depot) && needsDepotApproval(item)
          ? 'Yetkili Onaylı (' + opName + ')'
          : 'Direkt Çıkış (Onay Gerektirmez)';
      state.receipt = {
        status: 'deducted',
        title: 'Stoktan Düşüldü',
        subtitle: r.depotApproved ? 'Depocu onayı alındı ve stok güncellendi.' : 'Parça doğrudan stoktan düşüldü.',
        refId: r.id || '',
        itemName: item.name,
        itemCode: item.code,
        qty,
        unit: item.unit,
        remaining: r.remaining !== undefined ? r.remaining : Math.max(0, item.stock - qty),
        machine,
        operator: opName,
        approvalLabel: apprLabel,
        time: nowStr()
      };
    }

    // Auto-clear operator session for warehouse terminal security
    if (r.autoLogout !== false) {
      state.user = null;
      state.session = '';
    }
    state.pendingCheckout = null;
    state.step = 'receipt';
    render();
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    setBusy(false);
  }
}

// Event Delegation
document.addEventListener('click', async e => {
  const qrBtn = e.target.closest('[data-qr]');
  if (qrBtn) return selectQrCode(qrBtn.dataset.qr);

  const keyBtn = e.target.closest('[data-key]');
  if (keyBtn) {
    const pad = keyBtn.closest('[data-keypad]');
    const inp = $('#' + pad.dataset.keypad);
    if (!inp) return;
    const k = keyBtn.dataset.key;
    if (k === 'CLR') inp.value = '';
    else if (k === 'DEL') inp.value = inp.value.slice(0, -1);
    else if (inp.value.length < 8) inp.value += k;
    return;
  }

  const fillOp = e.target.closest('[data-fill-op]');
  if (fillOp) {
    const inp = $('#opPinInput');
    if (inp) inp.value = fillOp.dataset.fillOp;
    return;
  }

  const fillDepot = e.target.closest('[data-fill-depot]');
  if (fillDepot) {
    const inp = $('#depotPinInput');
    if (inp) inp.value = fillDepot.dataset.fillDepot;
    return;
  }

  const qtyBtn = e.target.closest('[data-qty]');
  if (qtyBtn) {
    const inp = $('#qtyInput');
    if (!inp || inp.disabled) return;
    const max = Number(inp.max) || 999999;
    const min = Number(inp.min) || 1;
    const next = Math.min(max, Math.max(min, Number((Number(inp.value || 0) + Number(qtyBtn.dataset.qty)).toFixed(2))));
    inp.value = next;
    return;
  }

  const apTab = e.target.closest('[data-ap-tab]');
  if (apTab) {
    state.approvalTab = apTab.dataset.apTab;
    render();
    return;
  }

  const act = e.target.closest('[data-action]')?.dataset.action;
  if (!act) return;

  if (act === 'start-cam') return startCamera();
  if (act === 'stop-cam') { stopCamera(); return render(); }
  if (act === 'reset-scan') return resetToScan();
  if (act === 'back-to-part') { state.step = 'part'; return render(); }

  if (act === 'reject-local') {
    const pc = state.pendingCheckout;
    state.receipt = {
      status: 'rejected',
      title: 'Çıkış Onaylanmadı',
      subtitle: 'Depocu onayı verilmediği için stoktan düşüm yapılmadı.',
      refId: '',
      itemName: pc.item.name,
      itemCode: pc.item.code,
      qty: pc.qty,
      unit: pc.item.unit,
      remaining: pc.item.stock,
      machine: pc.machine,
      operator: state.user?.name || '',
      approvalLabel: 'Depocu Tarafından İptal Edildi',
      time: nowStr()
    };
    state.user = null;
    state.session = '';
    state.pendingCheckout = null;
    state.step = 'receipt';
    render();
    return;
  }

  if (act === 'send-pool') {
    const pc = state.pendingCheckout;
    if (!pc) return;
    return executeCheckout({item: pc.item, qty: pc.qty, machine: pc.machine, extra: {sendApproval: true}});
  }

  if (act === 'open-conn') {
    $('#connMode').value = state.mode;
    $('#connUrl').value = state.directUrl;
    $('#connModal').hidden = false;
    return;
  }
  if (act === 'close-conn') {
    $('#connModal').hidden = true;
    return;
  }
  if (act === 'test-conn') {
    const oldMode = state.mode, oldUrl = state.directUrl;
    state.mode = $('#connMode').value;
    state.directUrl = $('#connUrl').value.trim();
    setBusy(true);
    try {
      await api('health');
      toast('Bağlantı başarılı.');
    } catch (err) {
      toast(err.message, 'err');
    } finally {
      state.mode = oldMode;
      state.directUrl = oldUrl;
      setBusy(false);
    }
    return;
  }
  if (act === 'save-conn') {
    const mode = $('#connMode').value;
    const url = $('#connUrl').value.trim();
    if (mode === 'direct' && !url) return toast('Doğrudan mod için /exec adresi girin.', 'err');
    state.mode = mode;
    state.directUrl = url;
    localStorage.setItem('depo.mode', mode);
    localStorage.setItem('depo.directUrl', url);
    $('#connModal').hidden = true;
    updateConnBadge();
    toast('Bağlantı ayarı kaydedildi.');
    resetToScan();
    return;
  }
});

document.addEventListener('submit', async e => {
  e.preventDefault();
  const id = e.target.id;

  if (id === 'manualQrForm') {
    return selectQrCode($('#manualQrInput')?.value);

  if (id === 'opPinForm') {
    return submitOpPin($('#opPinInput')?.value);
  }
  if (id === 'partCheckoutForm') {
    const fd = new FormData(e.target);
    return initiatePartCheckout(state.item, Number(fd.get('qty')), String(fd.get('machine') || '').trim());
  }
  if (id === 'cabinetForm') {
    const fd = new FormData(e.target);
    const itemId = fd.get('cabItem');
    const qty = Number(fd.get('qty'));
    const item = state.stock.find(x => x.id === itemId);
    if (!item) return toast('Bir İSG ekipmanı seçin.', 'err');
    return initiatePartCheckout(item, qty, 'PERSONEL KKD');
  }
  if (id === 'depotApproveForm') {
    const pc = state.pendingCheckout;
    const pin = String($('#depotPinInput')?.value || '').replace(/\s+/g, '').trim();
    if (!pin) return toast('Depocu PIN’ini girin.', 'err');
    const extra = pc.requiresManagerFallback ? {managerPin: pin} : {depotApproverPin: pin};
    return executeCheckout({item: pc.item, qty: pc.qty, machine: pc.machine, extra});
  }
});

$('#connModal').addEventListener('click', e => {
  if (e.target === $('#connModal')) $('#connModal').hidden = true;
});

// Boot: If opened with ?qr=CODE, go straight to Step 2 (OP PIN)!
if (state.scannedQr) {
  state.step = 'pin';
}
render();
})();
</script>
</body>
</html>
