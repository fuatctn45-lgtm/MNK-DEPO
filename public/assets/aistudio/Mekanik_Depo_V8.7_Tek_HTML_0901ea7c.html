const REGISTRATION_USAGE_UI=['Kritik Malzeme','Planlı Bakım','Sarf','İSG','Tekli Makine','Çoklu Makine'];
function needsDepotApprovalUi(item){return norm(item?.usage||'').includes('DEPO_ONAYI_GEREKLI');}
function selectedRegistrationUsage(){return $$('[name="usageOption"]:checked').map(x=>x.value);}
function selectedRegistrationMachines(){return $$('[name="machineOption"]:checked').map(x=>x.value);}
function registrationNeedsMachine(values=selectedRegistrationUsage()){return values.some(x=>['Kritik Malzeme','Planlı Bakım','Tekli Makine','Çoklu Makine'].includes(x));}
function updateRegistrationTotal(){const qty=Number($('#itemInitial')?.value)||0,price=Number($('#itemUnitPrice')?.value)||0,total=$('#itemTotal');if(total)total.value=num(qty*price);}
function filterRegistrationMachines(q=''){q=norm(q);$$('.machine-options label').forEach(x=>x.hidden=!!q&&!norm(x.textContent).includes(q));}
function syncItemForm(){
  const usage=selectedRegistrationUsage(),needs=registrationNeedsMachine(usage),box=$('#itemMachineBlock'),machines=selectedRegistrationMachines(); if(!box)return;
  box.hidden=!needs; if(!needs)$$('[name="machineOption"]').forEach(x=>x.checked=false);
  const mode=usage.includes('Tekli Makine')?'Yalnız 1 makine':usage.includes('Çoklu Makine')?'En az 2 makine':'Bir veya birden fazla makine';
  $('#machineRule').textContent=needs?mode+' seçin · '+machines.length+' seçim':'Sadece Sarf/İSG seçildi; makine gerekmez.';
  updateRegistrationTotal();
}

uired>`)}${field('Birim fiyat',`<input name="unitPrice" type="number" min="0" step="0.01" value="${item.unitPrice||0}" required>`)}${field('Durum',`<select name="active"><option value="AKTİF">AKTİF</option><option value="PASİF">PASİF</option></select>`)}</form>`,`<button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" data-action="item-update-save">Değişiklikleri Kaydet</button>`);}

const RECIPE_PERIODS=['AYLIK','3 AYLIK','6 AYLIK','YILLIK'];
function isAllRecipePeriods(period){return norm(period)==='TUMU';}
function recipeRows(machine,period){const all=isAllRecipePeriods(period);return(state.data.recipes||[]).filter(x=>(!machine||x.machine===machine)&&(!period||all||norm(x.period)===norm(period))).map(r=>{const i=state.data.stock.find(x=>x.id===r.itemId);return{...r,code:r.code||i?.code,name:r.name||i?.name,unit:r.unit||i?.unit,shelf:r.shelf||i?.shelf,stock:i?.stock??r.stock??0,ready:(i?.stock??r.stock??0)>=r.qty};}).sort((a,b)=>all?RECIPE_PERIODS.indexOf(norm(a.period))-RECIPE_PERIODS.indexOf(norm(b.period)):0);}
function recipeMachineSummaries(){const map=new Map(),stock=state.data.stock||[];(state.data.recipes||[]).forEach(r=>{const machine=String(r.machine||'').trim();if(!machine)return;const key=norm(machine),item=stock.find(x=>x.id===r.itemId),available=item?.stock??r.stock??0,ready=typeof r.ready==='boolean'?r.ready:available>=Number(r.qty||0);if(!map.has(key))map.set(key,{machine,count:0,missing:0,periods:new Set()});const row=map.get(key);row.count++;if(!ready)row.missing++;const period=norm(r.period);if(RECIPE_PERIODS.includes(period))row.periods.add(period);});return[...map.values()].map(x=>({...x,periods:RECIPE_PERIODS.filter(p=>x.periods.has(p))})).sort((a,b)=>a.machine.localeCompare(b.machine,'tr'));}
function recipeMachineTable(selectedMachine,summaries=recipeMachineSummaries()){if(!summaries.length)return'<div class="recipe-machines-empty">Henüz reçete tanımlanmış makine yok.</div>';return`<div class="recipe-machine-scroll"><table class="data-table recipe-machine-table"><thead><tr><th>SIRA NO</th><th>MAKİNE</th><th>KALEM SAYISI</th><th>PERİYOTLAR</th><th>DURUM</th></tr></thead><tbody>${summaries.map((x,i)=>`<tr class="recipe-machine-row ${norm(x.machine)===norm(selectedMachine)?'selected':''}" data-recipe-machine="${esc(x.machine)}" aria-selected="${norm(x.machine)===norm(selectedMachine)?'true':'false'}" title="${esc(x.machine)}"><td class="recipe-machine-order">${i+1}</td><td class="recipe-machine-name">${esc(x.machine)}</td><td class="recipe-machine-count">${x.count}</td><td><span class="recipe-period-tags">${x.periods.map(p=>`<span class="recipe-period-tag">${esc(p)}</span>`).join('')}</span></td><td><span class="recipe-machine-status ${x.missing?'missing':'ready'}">${x.missing?'Eksik: '+x.missing:'Hazır'}</span></td></tr>`).join('')}</tbody></table></div>`;}
function recipeMachinesPanel(selectedMachine){const summaries=recipeMachineSummaries();return`<section class="recipe-machines-panel"><div class="recipe-machines-head"><div><b>REÇETESİ OLAN MAKİNELER</b><small>Makine satırına tıklayarak reçete içeriğini açın.</small></div><span class="pill">${summaries.length} makine</span></div>${recipeMachineTable(selectedMachine,summaries)}</section>`;}

function renderMaintenance(){const listed=state.data.lists.machines||[],recipeMachines=recipeMachineSummaries().map(x=>x.machine),machines=[...new Set([...listed,...recipeMachines])],first=machines[0]||'',period='TÜMÜ',rows=recipeRows(first,period);$('#content').innerHTML=`<section class="maintenance-top"><div>${field('Makine',`<select id="recipeMachine">${opts(machines,first)}</select>`)}${field('Periyot',`<select id="recipePeriod">${opts(['TÜMÜ',...RECIPE_PERIODS],period)}</select>`)}</div><div class="maintenance-actions">${state.user.role!=='OP'?'<button class="btn ghost" data-action="recipe-edit">✎ Reçeteyi Düzenle</button>':''}<button class="btn primary" data-action="recipe-bulk">Seti Toplu Düş</button></div></section>${recipeMachinesPanel(first)}<section class="panel" id="recipePanel">${recipeTable(first,period,rows)}</section>`;}
function recipeRowHtml(x,i,showPeriod=false){return`<div><span class="recipe-no">${String(i+1).padStart(2,'0')}</span><div><b>${esc(x.name)}</b><small>${esc(x.code)} · Raf ${esc(x.shelf)}${showPeriod?` · Periyot ${esc(x.period)}`:''}</small></div><p><small>Gerekli</small><b>${num(x.qty)} ${esc(x.unit)}</b></p><p><small>Stok</small><b>${num(x.stock)} ${esc(x.unit)}</b></p><span class="badge ${x.ready?'success':'danger'}">${x.ready?'HAZIR':'EKSİK'}</span></div>`;}
function recipeListHtml(rows,period){if(!rows.length)return'<div class="empty">Bu makine/periyot için reçete yok.</div>';if(!isAllRecipePeriods(period))return rows.map((x,i)=>recipeRowHtml(x,i)).join('');let index=0;return RECIPE_PERIODS.map(p=>{const group=rows.filter(x=>norm(x.period)===norm(p));if(!group.length)return'';return`<div class="recipe-period-group"><span>${esc(p)}</span><small>${group.length} kalem</small></div>${group.map(x=>recipeRowHtml(x,index++,true)).join('')}`;}).join('');}

let cameraStream=null,cameraTimer=null;
async function openScanner(){modal('QR Kodunu Okut',`<div class="camera"><video id="cameraVideo" playsinline muted></video><div class="camera-frame"></div></div><p class="camera-help">Kamera izni verin ve kodu çerçeveye hizalayın. Desteklenmiyorsa kodu elle girin.</p>${field('Manuel kod','<input id="scanManual" placeholder="RUL-6205 veya ISG-DOLAP">')}`,`<button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" data-action="scan-manual-go">Devam Et</button>`);try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const v=$('#cameraVideo');v.srcObject=cameraStream;await v.play();if('BarcodeDetector'in window){const det=new BarcodeDetector({formats:['qr_code']});cameraTimer=setInterval(async()=>{try{const codes=await det.detect(v);if(codes[0]?.rawValue){handleQr(codes[0].rawValue);}}catch{}},500);}}catch(e){toast('Kamera açılamadı; kodu elle girebilirsiniz.','error');}}
function stopCamera(){if(cameraTimer)clearInterval(cameraTimer);cameraTimer=null;if(cameraStream)cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}
function handleQr(code){stopCamera();closeModal();code=String(code).trim();if(norm(code)==='ISG-DOLAP')return cabinetModal();const item=state.data.stock.find(x=>norm(x.code)===norm(code)||norm(x.id)===norm(code));if(!item)return toast('QR kodu stok kartıyla eşleşmedi: '+code,'error');checkoutModal(item);}

function qrMatrix(text){const CH='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';text=String(text).toUpperCase().replace(/[^0-9A-Z $%*+\-./:]/g,'-').slice(0,25);let bits='0010'+text.length.toString(2).padStart(9,'0');for(let i=0;i<text.length;i+=2){if(i+1<text.length)bits+=(CH.indexOf(text[i])*45+CH.indexOf(text[i+1])).toString(2).padStart(11,'0');else bits+=CH.indexOf(text[i]).toString(2).padStart(6,'0');}bits+='0'.repeat(Math.min(4,152-bits.length));bits+='0'.repeat((8-bits.length%8)%8);let data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8),2));for(let p=0;data.length<19;p++)data.push(p%2?17:236);const exp=new Array(512),log=new Array(256);let gx=1;for(let i=0;i<255;i++){exp[i]=gx;log[gx]=i;gx<<=1;if(gx&256)gx^=0x11d;}for(let i=255;i<512;i++)exp[i]=exp[i-255];const mul=(a,b)=>a&&b?exp[log[a]+log[b]]:0;let gen=[1];for(let i=0;i<7;i++){let nx=new Array(gen.length+1).fill(0);for(let j=0;j<gen.length;j++){nx[j]^=gen[j];nx[j+1]^=mul(gen[j],exp[i]);}gen=nx;}let rem=new Array(7).fill(0);for(const b of data){const f=b^rem[0];rem.shift();rem.push(0);for(let j=0;j<7;j++)rem[j]^=mul(gen[j+1],f);}let stream='';data.concat(rem).forEach(b=>stream+=b.toString(2).padStart(8,'0'));const n=21,m=Array.from({length:n},()=>Array(n).fill(false)),fun=Array.from({length:n},()=>Array(n).fill(false));const set=(r,c,v)=>{if(r>=0&&r<n&&c>=0&&c<n){m[r][c]=!!v;fun[r][c]=true;}};function finder(r,c){for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const rr=r+dr,cc=c+dc;if(rr<0||rr>=n||cc<0||cc>=n)continue;set(rr,cc,dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)));}}finder(0,0);finder(0,n-7);finder(n-7,0);for(let i=8;i<n-8;i++){set(6,i,i%2===0);set(i,6,i%2===0);}for(let i=0;i<=8;i++)if(i!==6){set(8,i,false);set(i,8,false);}for(let i=0;i<8;i++)set(8,n-1-i,false);for(let i=0;i<7;i++)set(n-1-i,8,false);set(n-8,8,true);let k=0,up=true;for(let right=n-1;right>=1;right-=2){if(right===6)right--;for(let v=0;v<n;v++){const r=up?n-1-v:v;for(let j=0;j<2;j++){const c=right-j;if(fun[r][c])continue;let b=k<stream.length&&stream[k++]==='1';if((r+c)%2===0)b=!b;m[r][c]=b;}}up=!up;}let dat=8,rf=dat;for(let i=0;i<10;i++)rf=(rf<<1)^(((rf>>9)&1)*0x537);const f=((dat<<10)|rf)^0x5412,fb=i=>((f>>i)&1)!==0;for(let i=0;i<=5;i++)m[i][8]=fb(i);m[7][8]=fb(6);m[8][8]=fb(7);m[8][7]=fb(8);for(let i=9;i<15;i++)m[14-i][8]=fb(i);for(let i=0;i<8;i++)m[8][n-1-i]=fb(i);for(let i=8;i<15;i++)m[n-15+i][8]=fb(i);m[n-8][8]=true;return m;}
function qrSvg(text){const m=qrMatrix(text),q=4,n=m.length;let p='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])p+=`M${x+q},${y+q}h1v1h-1z`;return`<svg viewBox="0 0 ${n+q*2} ${n+q*2}" xmlns="http://www.w3.org/2000/svg" aria-label="QR ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#111827"/></svg>`;}
