<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Depo QR">
<meta name="application-name" content="Depo QR">
<meta name="description" content="Mekanik ve İSG depoları için rol bazlı QR stok yönetimi">
<meta property="og:title" content="Mekanik + İSG Depo 2027 · V8.7">
<meta property="og:description" content="Mekanik ve İSG depoları için rol bazlı QR stok yönetimi">
<title>Mekanik + İSG Depo 2027 · V8.7</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#ea580c;--orange-hover:#c2410c;--orange2:#f97316;--orange-soft:#fff7ed;--orange-border:#fed7aa;
  --navy:#0f172a;--navy2:#1e293b;--navy3:#334155;
  --ink:#0f172a;--ink2:#334155;--muted:#64748b;--muted2:#94a3b8;
  --line:#e2e8f0;--line-soft:#f1f5f9;--bg:#f4f6f9;--surface:#ffffff;--surface-alt:#f8fafc;
  --green:#15803d;--green-soft:#ecfdf5;--green-border:#bbf7d0;
  --red:#b91c1c;--red-soft:#fef2f2;--red-border:#fecaca;
  --blue:#1d4ed8;--blue-soft:#eff6ff;--blue-border:#bfdbfe;
  --yellow:#b45309;--yellow-soft:#fffbeb;--yellow-border:#fde68a;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);--shadow:0 10px 28px rgba(15,23,42,.08);--shadow-lg:0 24px 64px rgba(15,23,42,.24);
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --ease:cubic-bezier(.16,1,.3,1);
  --font-sans:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  font-family:var(--font-sans);color:var(--ink);background:var(--bg);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;max-width:100%;overflow-x:clip;background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-size:15px;line-height:1.5;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.025em}
small{color:var(--muted)}
code,pre,.mono{font-family:var(--font-mono)}
.num,.kpi strong,.data-table .big,.stock-number b,.ready-summary b,.critical-list strong,.donut span{font-variant-numeric:tabular-nums}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;vertical-align:middle}
.ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic-sm svg{width:15px;height:15px}
.ic-lg svg{width:22px;height:22px}
.busy{cursor:progress}
.loader{display:none;position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.18);backdrop-filter:blur(2px)}
.busy .loader{display:grid;place-items:center}
.loader span{width:42px;height:42px;border:3px solid rgba(255,255,255,.35);border-top-color:var(--orange);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(480px,1.15fr) minmax(400px,.85fr);background:var(--surface)}
.login-art{position:relative;overflow:hidden;padding:48px 56px;color:#f8fafc;background:radial-gradient(circle at 82% 18%,rgba(234,88,12,.22),transparent 46%),linear-gradient(160deg,#0b1220 0%,#0f172a 58%,#162133 100%);display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid rgba(255,255,255,.06)}
.art-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,black 30%,transparent 100%);pointer-events:none}
.login-brand,.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.brand-mark{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--orange);color:#fff;font-size:19px;font-weight:800;letter-spacing:-.04em;flex-shrink:0}
.login-brand div,.brand div{display:flex;flex-direction:column}
.login-brand b{font-size:16px;font-weight:700;letter-spacing:-.01em;color:#fff}
.login-brand small{color:#94a3b8;font-size:12px;margin-top:2px}
.login-copy{position:relative;z-index:1;max-width:560px}
.login-kicker{font-size:13px;font-weight:600;color:#fb923c;letter-spacing:.01em}
.login-copy h1{font-size:clamp(40px,4.6vw,62px);line-height:1.06;letter-spacing:-.04em;font-weight:800;margin:14px 0 18px;color:#fff}
.login-copy p{font-size:16.5px;line-height:1.65;max-width:480px;color:#cbd5e1}
.login-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;position:relative;z-index:1;padding-top:28px;border-top:1px solid rgba(148,163,184,.18);max-width:520px}
.login-stats div{display:flex;flex-direction:column;gap:4px}
.login-stats b{font-size:30px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.login-stats span{font-size:13px;color:#94a3b8}
.login-form{display:grid;place-items:center;padding:48px 40px 64px;position:relative;background:var(--surface)}
.login-form form{width:min(410px,100%)}
.login-form .kicker{font-size:13px;font-weight:600;color:var(--orange)}
.login-form h2{font-size:30px;font-weight:800;margin:8px 0 10px;color:var(--ink)}
.login-form form>p{color:var(--muted);font-size:14.5px;line-height:1.55;margin-bottom:24px}
.login-form>footer{position:absolute;bottom:20px;color:var(--muted2);font-size:12.5px}
.pin-wrap{position:relative}
.pin-wrap input{font-family:var(--font-mono);font-size:22px;letter-spacing:.26em;padding-right:48px;height:50px}
.pin-wrap button{position:absolute;right:6px;top:5px;border:0;background:transparent;width:40px;height:40px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.pin-wrap button:hover{background:var(--line-soft);color:var(--ink)}
.login-mode{margin-top:16px;text-align:center;color:var(--muted);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.login-mode i,.connection i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#94a3b8;flex-shrink:0}
.login-mode i.demo,.connection.demo i{background:#d97706}
.login-mode i.proxy,.connection.proxy i{background:#16a34a}
.login-mode i.direct,.connection.direct i{background:#2563eb}
details{margin-top:14px;background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--ink);font-size:13.5px;user-select:none}
details p{margin-top:8px;font-size:13.5px}
.demo-pins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.demo-pins button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--ink);transition:border-color .15s var(--ease),background .15s var(--ease)}
.demo-pins button:hover{border-color:var(--orange);background:var(--orange-soft)}
.demo-pins button b{color:var(--orange);font-family:var(--font-mono);font-weight:700}
.login-conn-body{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.login-conn-body .field{margin-bottom:0}
.login-conn-body .button-row{justify-content:space-between}
.setup-sec{border:1px solid var(--line);border-radius:11px;padding:14px 16px;background:var(--surface-alt)}
.setup-sec+.setup-sec{margin-top:12px}
.setup-sec-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.setup-sec-head b{font-size:13.5px;font-weight:700;color:var(--ink)}
.setup-sec-head small{font-size:12px;color:var(--muted)}
.setup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:540px){.setup-actions{grid-template-columns:1fr}}
.wide{width:100%}

/* App Shell & Top Navigation */
#app{min-height:100vh;display:flex;flex-direction:column;min-width:0}
.sidebar{position:sticky;z-index:60;top:0;left:0;right:0;width:100%;background:var(--navy);color:#f8fafc;display:flex;flex-direction:column;border-bottom:1px solid rgba(255,255,255,.1)}
.nav-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 14px;padding:7px 20px;min-height:50px}
.nav-left{display:flex;align-items:center;gap:12px;min-width:0}
.nav-right{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-left:auto}
.brand{padding:0;border:0;flex-shrink:0}
.brand .brand-mark{width:32px;height:32px;font-size:16px;border-radius:8px}
.brand b{font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:#fff;white-space:nowrap}
.brand small{font-size:11px;color:#94a3b8;margin-top:0;white-space:nowrap}
.nav-menu-btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;height:34px;padding:0 12px;border-radius:8px;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;white-space:nowrap;transition:background .15s var(--ease),border-color .15s var(--ease)}
.nav-menu-btn:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3)}
.sidebar.open .nav-menu-btn{background:var(--orange);border-color:var(--orange);color:#fff}
.nav-menu-btn .nav-caret{display:inline-block;font-size:11px;opacity:.85;transition:transform .16s var(--ease)}
.sidebar.open .nav-menu-btn .nav-caret{transform:rotate(180deg)}
.nav-menu-btn .nav-menu-badge{background:var(--orange);color:#fff;font-style:normal;font-size:11px;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:6px;display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.sidebar.open .nav-menu-btn .nav-menu-badge{background:#fff;color:var(--orange)}
.sidebar .connection{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#e2e8f0;padding:5px 10px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sidebar nav.nav-dropdown{display:none;position:absolute;top:100%;left:20px;width:min(540px,calc(100vw - 24px));max-height:calc(100vh - 68px);overflow:auto;background:#0f172a;border:1px solid rgba(255,255,255,.14);border-top:0;border-radius:0 0 14px 14px;box-shadow:0 22px 48px rgba(2,6,23,.48);padding:12px;z-index:70}
.sidebar.open nav.nav-dropdown{display:block;animation:navDrop .14s var(--ease)}
@keyframes navDrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.nav-dropdown-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.nav-item{border:1px solid transparent;background:rgba(255,255,255,.03);color:#cbd5e1;text-align:left;display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:9px;font-size:13px;font-weight:600;white-space:nowrap;width:100%;transition:color .15s var(--ease),background .15s var(--ease),border-color .15s var(--ease)}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.1)}
.nav-item.active{color:#fff;font-weight:700;background:rgba(234,88,12,.22);border-color:rgba(234,88,12,.6)}
.nav-item.active .ic{color:#fb923c}
.nav-item span{overflow:hidden;text-overflow:ellipsis}
.nav-item em{margin-left:auto;background:var(--orange);color:#fff;font-style:normal;font-size:11.5px;font-weight:700;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;border-radius:6px;font-variant-numeric:tabular-nums}
.nav-dropdown-foot{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav-dropdown-foot .btn{flex:1;min-height:36px;padding:6px 12px;font-size:12.5px;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#f8fafc}
.nav-dropdown-foot .btn:hover{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.26)}
.side-foot{margin-top:0;border-left:1px solid rgba(255,255,255,.12);padding-left:12px;display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:8px;background:rgba(234,88,12,.22);border:1px solid rgba(234,88,12,.45);color:#fdba74;display:grid;place-items:center;font-weight:700;font-size:13.5px;flex-shrink:0}
.side-foot>div:nth-child(2){min-width:0;display:flex;flex-direction:column;max-width:170px}
.side-foot b{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot small{font-size:11px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .icon-btn{color:#94a3b8;width:32px;height:32px;display:grid;place-items:center;border-radius:8px}
.side-foot .icon-btn:hover{color:#fff;background:rgba(255,255,255,.1)}

/* Main Workspace & Page Header */
.main{margin-left:0;width:100%;flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
.topbar{padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px}
.topbar-left{display:flex;flex-direction:column;gap:2px;min-width:0}
.crumb{font-size:12px;color:var(--muted);font-weight:500}
.topbar h1{font-size:21px;font-weight:800;color:var(--ink);line-height:1.2}
.topbar p{font-size:13px;color:var(--muted)}
.top-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;flex-shrink:0}
#content{width:100%;max-width:none;min-width:0;padding:18px 20px 44px;margin:0}

/* Surfaces, Buttons, Controls */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:20px 22px;min-width:0}
.panel+.panel{margin-top:20px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:12px 16px;margin-bottom:18px}
.panel-head h2{font-size:17.5px;font-weight:700;color:var(--ink)}
.panel-head p{font-size:13.5px;color:var(--muted);margin-top:3px}
.meta-inline{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.btn{border:1px solid transparent;border-radius:var(--radius-sm);padding:9px 16px;min-height:40px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;flex-shrink:0;transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn.primary:hover:not(:disabled){background:var(--orange-hover);border-color:var(--orange-hover)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--surface-alt);border-color:#cbd5e1}
.btn.white{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22)}
.btn.white:hover:not(:disabled){background:rgba(255,255,255,.18)}
.btn.large{padding:11px 20px;min-height:46px;font-size:14.5px;font-weight:700}
.btn.approve{background:var(--green);color:#fff}
.btn.approve:hover:not(:disabled){background:#166534}
.btn.reject{background:var(--surface);border-color:var(--red-border);color:var(--red)}
.btn.reject:hover:not(:disabled){background:var(--red-soft)}
.icon-btn{border:0;background:transparent;width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;color:var(--muted);transition:background .15s var(--ease),color .15s var(--ease)}
.icon-btn:hover{background:var(--line-soft);color:var(--ink)}
.link{border:0;background:transparent;color:var(--orange);font-weight:600;font-size:13.5px;padding:4px 0;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.link:hover{color:var(--orange-hover);text-decoration:underline}
.notice{padding:13px 16px;border-radius:var(--radius-sm);background:var(--yellow-soft);border:1px solid var(--yellow-border);color:var(--yellow);font-size:13.5px;margin-bottom:14px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface-alt);border:1px dashed #cbd5e1;border-radius:var(--radius-sm);font-size:14px}
.empty.good{color:var(--green);background:var(--green-soft);border-color:var(--green-border)}
.connection{font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}

/* KPI Strip & Dashboard */
.kpi-grid,.approval-kpis,.ppe-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.approval-kpis,.ppe-summary{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm)}
.kpi-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kpi small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--orange-soft);color:var(--orange);flex-shrink:0}
.kpi.blue .kpi-icon{background:var(--blue-soft);color:var(--blue)}
.kpi.red .kpi-icon{background:var(--red-soft);color:var(--red)}
.kpi.green .kpi-icon{background:var(--green-soft);color:var(--green)}
.kpi strong{font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.05;color:var(--ink)}
.kpi p{font-size:13px;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:20px;margin-bottom:20px;align-items:stretch}
.critical-list{display:flex;flex-direction:column}
.critical-list button{border:0;border-top:1px solid var(--line-soft);background:transparent;padding:13px 10px;margin:0 -10px;border-radius:8px;display:grid;grid-template-columns:1fr minmax(90px,130px) auto;gap:16px;text-align:left;align-items:center;transition:background .15s var(--ease)}
.critical-list button:first-child{border-top:0}
.critical-list button:hover{background:var(--surface-alt)}
.critical-list .crit-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.critical-list .crit-info b{font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.critical-list .crit-info small{font-size:12.5px;color:var(--muted)}
.crit-meter{display:flex;flex-direction:column;gap:5px}
.crit-bar{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.crit-bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.crit-meter small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.critical-list strong{font-size:16px;font-weight:700;color:var(--red);text-align:right;white-space:nowrap}
.critical-list strong small{font-size:12px;font-weight:500;color:var(--muted)}
.donut-wrap{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:10px 4px}
.donut{width:152px;height:152px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--orange) calc(var(--p)*1%),var(--blue) 0);position:relative;flex-shrink:0}
.donut:after{content:"";position:absolute;inset:22px;background:var(--surface);border-radius:50%}
.donut span{z-index:1;display:flex;flex-direction:column;align-items:center;font-size:28px;font-weight:800;line-height:1.1;color:var(--ink)}
.donut span small{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
.legend{flex:1;display:flex;flex-direction:column;gap:0}
.legend p{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:14px;color:var(--ink2)}
.legend p:last-child{border-bottom:0}
.legend p b{font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink)}
.legend i{width:9px;height:9px;border-radius:3px}
.legend i.orange{background:var(--orange)}
.legend i.blue{background:var(--blue)}
.legend i.red{background:var(--red)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.quick button{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:15px 16px;display:flex;align-items:center;gap:13px;text-align:left;transition:border-color .15s var(--ease),background .15s var(--ease)}
.quick button:hover{border-color:var(--orange-border);background:var(--orange-soft)}
.quick button>b{width:40px;height:40px;border-radius:9px;background:var(--surface-alt);border:1px solid var(--line);color:var(--orange);display:grid;place-items:center;flex-shrink:0}
.quick button:hover>b{background:var(--surface);border-color:var(--orange-border)}
.quick span{display:flex;flex-direction:column;font-weight:700;font-size:14px;color:var(--ink)}
.quick small{font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}

/* Operator QR */
.qr-hero{border-radius:var(--radius-lg);background:radial-gradient(circle at 86% 24%,rgba(234,88,12,.25),transparent 42%),linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#f8fafc;padding:34px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.08)}
.qr-hero>div{position:relative;z-index:1}
.qr-kicker{font-size:13px;font-weight:600;color:#fb923c}
.qr-hero h2{font-size:32px;font-weight:800;margin:8px 0 10px;color:#fff}
.qr-hero p{color:#cbd5e1;max-width:520px;font-size:15px}
.qr-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.scan-visual{width:200px;display:grid;place-items:center;flex-shrink:0}
.scan-frame{width:144px;height:144px;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.32)}
.scan-frame i{position:absolute;width:30px;height:30px;border-color:#fb923c;border-style:solid;border-radius:2px}
.scan-frame i:nth-child(1){left:0;top:0;border-width:3px 0 0 3px}
.scan-frame i:nth-child(2){right:0;top:0;border-width:3px 3px 0 0}
.scan-frame i:nth-child(3){left:0;bottom:0;border-width:0 0 3px 3px}
.scan-frame i:nth-child(4){right:0;bottom:0;border-width:0 3px 3px 0}
.scan-frame span{position:absolute;width:118px;height:2px;background:linear-gradient(90deg,transparent,#fb923c,transparent);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(-48px)}50%{transform:translateY(48px)}}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 20px}
.choice-grid>button{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:18px 20px;display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:15px;text-align:left;box-shadow:var(--shadow-sm);transition:border-color .15s var(--ease),background .15s var(--ease)}
.choice-grid>button:hover:not(:disabled){border-color:var(--orange-border);background:var(--orange-soft)}
.choice-icon{width:46px;height:46px;border-radius:10px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;flex-shrink:0}
.choice-icon.blue{background:var(--blue-soft);color:var(--blue)}
.choice-grid b{font-size:15.5px;font-weight:700;color:var(--ink)}
.choice-grid p{font-size:13px;color:var(--muted);margin-top:3px}
.choice-grid em{font-style:normal;color:var(--orange);font-size:13px;font-weight:700;white-space:nowrap}
.product-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
.product-strip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;display:flex;align-items:center;gap:12px;transition:border-color .15s var(--ease),background .15s var(--ease)}
.product-strip button:hover{border-color:#cbd5e1;background:var(--surface-alt)}
.product-strip button>span{width:36px;height:36px;border-radius:8px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;flex-shrink:0}
.product-strip button.isg-item>span{background:var(--blue-soft);color:var(--blue)}
.product-strip div{display:flex;flex-direction:column;min-width:0;flex:1}
.product-strip b{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-strip small{font-size:12.5px;margin-top:2px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Toolbars & High-Density Tables */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.table-panel .toolbar{padding-bottom:16px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface-alt);gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:6px;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s var(--ease),color .15s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.active{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.search{height:40px;border:1px solid var(--line);border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;padding:0 12px;flex:1;min-width:220px;background:var(--surface);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.search:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(234,88,12,.14)}
.search .ic{color:var(--muted2)}
.search input{border:0;outline:0;width:100%;font-size:14px;background:transparent}
.toolbar select,.field-inline select{height:40px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:0 12px;color:var(--ink);font-size:13.5px}
.table-scroll{overflow:auto;border:1px solid var(--line);border-radius:10px}
.data-table{width:100%;border-collapse:collapse;min-width:920px;background:var(--surface)}
.data-table th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface-alt);white-space:nowrap;position:sticky;top:0;z-index:1}
.data-table th.num-col,.data-table td.num-col{text-align:right}
.data-table td{padding:11px 12px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle;color:var(--ink2)}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tbody tr{transition:background .12s var(--ease)}
.data-table tbody tr[data-item],.data-table tbody tr[data-analysis-item],.data-table tbody tr[data-recipe-machine]{cursor:pointer}
.data-table tbody tr:hover{background:#f8fafc}
.data-table td>b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.data-table td>small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
.data-table .big{font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.data-table .big small{display:inline;font-size:12px;font-weight:500;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge.success{background:var(--green-soft);color:var(--green);border-color:var(--green-border)}
.badge.danger{background:var(--red-soft);color:var(--red);border-color:var(--red-border)}
.badge.warning{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow-border)}
.badge.neutral{background:var(--surface-alt);color:var(--ink2);border-color:var(--line)}
.depot{font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;display:inline-block;white-space:nowrap}
.depot.mekanik{background:var(--orange-soft);color:var(--orange)}
.depot.isg{background:var(--blue-soft);color:var(--blue)}
.table-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 14px;padding-top:12px;font-size:13px;color:var(--muted)}
.stock-table{table-layout:fixed;min-width:1040px}
.stock-table th:nth-child(1){width:7.5%}
.stock-table th:nth-child(2){width:20%}
.stock-table th:nth-child(3){width:7.5%}
.stock-table th:nth-child(4){width:20%}
.stock-table th:nth-child(5){width:7%}
.stock-table th:nth-child(6){width:5.5%}
.stock-table th:nth-child(7){width:5.5%}
.stock-table th:nth-child(8){width:5.5%}
.stock-table th:nth-child(9){width:7%}
.stock-table th:nth-child(10){width:14.5%}
.stock-table td:nth-child(2),.stock-table td:nth-child(10){overflow-wrap:anywhere}
.stock-table td{border-bottom:1px solid rgba(15,23,42,.08)}
.stock-table tbody tr.row-eksik{background:#FFE5E5}
.stock-table tbody tr.row-eksik:hover{background:#FFD6D6}
.stock-table tbody tr.row-tam{background:#E5FFE5}
.stock-table tbody tr.row-tam:hover{background:#D2F8D2}
.stock-table tbody tr.row-kritik{background:#FFFF99}
.stock-table tbody tr.row-kritik:hover{background:#F5F57A}
.stock-table tbody tr.row-planli{background:#FFDB99}
.stock-table tbody tr.row-planli:hover{background:#FFCE75}
mark.search-hl{background:#FFE600;color:#0F172A;font-weight:700;padding:0 3px;border-radius:4px;box-shadow:0 0 0 1px rgba(180,83,9,.38)}
.stock-legend{display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);font-weight:600}
.stock-legend span{display:inline-flex;align-items:center;gap:5px}
.stock-legend i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(15,23,42,.18);display:inline-block}
.stock-legend .sw-eksik{background:#FFE5E5}
.stock-legend .sw-tam{background:#E5FFE5}
.stock-legend .sw-kritik{background:#FFFF99}
.stock-legend .sw-planli{background:#FFDB99}
.usage-text{font-size:13px;color:var(--ink2);line-height:1.45}
.usage-text .usage-approval{color:var(--red);font-weight:700}
.usage-empty{color:var(--muted2)}

/* Approvals */
.approval-list{display:flex;flex-direction:column}
.approval-list article{display:grid;grid-template-columns:155px 1fr auto auto;align-items:center;gap:18px;padding:16px 4px;border-top:1px solid var(--line-soft)}
.approval-list article:first-child{border-top:0}
.approval-id{display:flex;flex-direction:column;gap:4px}
.approval-id span{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--ink)}
.approval-id small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.approval-list article>div:nth-child(2) b{font-size:15px;font-weight:700;color:var(--ink)}
.approval-list article>div:nth-child(2) p,.approval-list article>div:nth-child(2) small{font-size:13px;color:var(--muted);margin-top:3px;display:block}
.approval-buttons{display:flex;gap:8px}

/* Maintenance Master-Detail */
.maintenance-top{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.maintenance-top>div:first-child{display:flex;gap:14px;flex-wrap:wrap}
.maintenance-top .field{min-width:240px;margin-bottom:0}
.maintenance-actions{display:flex;gap:8px;flex-wrap:wrap}
.maintenance-grid{display:grid;grid-template-columns:minmax(380px,.95fr) minmax(0,1.35fr);gap:20px;align-items:start}
.recipe-machines-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}
.recipe-machines-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.recipe-machines-head>div{display:flex;flex-direction:column;gap:3px}
.recipe-machines-head b{font-size:16px;font-weight:700;color:var(--ink)}
.recipe-machines-head small{font-size:13px;color:var(--muted)}
.recipe-machine-scroll{max-height:540px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.recipe-machine-table{min-width:460px}
.recipe-machine-table tbody tr.selected{background:var(--orange-soft)}
.recipe-machine-table tbody tr.selected td{color:var(--ink);font-weight:600}
.recipe-machine-order{width:54px;font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.recipe-machine-name{font-size:14px;font-weight:600;color:var(--ink)}
.recipe-machine-count{width:72px;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums}
.recipe-period-tags{font-size:12px;color:var(--muted)}
.recipe-machine-status{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.recipe-machine-status.ready{background:var(--green-soft);color:var(--green)}
.recipe-machine-status.missing{background:var(--red-soft);color:var(--red)}
.recipe-machines-empty{padding:24px;text-align:center;color:var(--muted);background:var(--surface-alt);border:1px dashed #cbd5e1;border-radius:9px;font-size:13.5px}
.ready-summary{text-align:right;flex-shrink:0}
.ready-summary b{display:block;font-size:26px;font-weight:800;color:var(--ink);line-height:1.1}
.ready-summary small{font-size:12.5px;color:var(--muted)}
.recipe-list>div{display:grid;grid-template-columns:36px 1fr 110px 110px 84px;gap:14px;align-items:center;padding:13px 6px;border-top:1px solid var(--line-soft)}
.recipe-list>div:first-child{border-top:0}
.recipe-no{width:30px;height:30px;border-radius:7px;background:var(--surface-alt);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:12px;color:var(--muted)}
.recipe-list div>div{display:flex;flex-direction:column;min-width:0}
.recipe-list div>div b{font-size:14px;font-weight:600;color:var(--ink)}
.recipe-list div>div small{font-size:12.5px;color:var(--muted);margin-top:2px}
.recipe-list>.recipe-period-group{display:flex;align-items:center;justify-content:space-between;grid-template-columns:none;margin:14px 0 0;padding:8px 12px;border:1px solid var(--orange-border);border-radius:8px;background:var(--orange-soft);color:var(--orange);font-size:13px;font-weight:700}
.recipe-list>.recipe-period-group:first-child{margin-top:0}
.recipe-list>.recipe-period-group small{color:var(--orange);font-size:12px;font-weight:600}
.recipe-list>.recipe-period-group+div{border-top:0}
.recipe-list p{display:flex;flex-direction:column;gap:2px}
.recipe-list p small{font-size:11.5px;color:var(--muted)}
.recipe-list p b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.recipe-edit-row{display:grid;grid-template-columns:1fr 96px 40px;gap:8px;margin-bottom:8px}
.recipe-edit-row select,.recipe-edit-row input{height:42px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 10px;font-size:14px;background:var(--surface)}
.recipe-edit-row button,.add-line{border:1px dashed #cbd5e1;background:var(--surface-alt);border-radius:var(--radius-sm);color:var(--muted)}
.add-line{width:100%;padding:11px;color:var(--orange);font-weight:600;font-size:13.5px}
.add-line:hover{border-color:var(--orange);background:var(--orange-soft)}

/* PPE & Analytics */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;justify-content:space-between;box-shadow:var(--shadow-sm)}
.field-inline{display:flex;align-items:center;gap:8px}
.field-inline span{font-size:13px;font-weight:600;color:var(--muted)}
.alert-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.alert-cards article{background:var(--surface);border:1px solid var(--red-border);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.alert-cards article>span{width:34px;height:34px;border-radius:8px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;flex-shrink:0}
.alert-cards b{font-size:14px;font-weight:700;color:var(--ink)}
.alert-cards p{font-size:12.5px;color:var(--red);margin-top:2px}
.analysis-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-bottom:20px;align-items:stretch}
.bar-list{display:flex;flex-direction:column;gap:4px}
.bar-list button{border:0;background:transparent;width:100%;display:grid;grid-template-columns:28px 1fr;gap:10px;text-align:left;padding:8px 8px;border-radius:8px;transition:background .15s var(--ease)}
.bar-list button:hover{background:var(--surface-alt)}
.bar-list button>em{font-style:normal;font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--muted2);padding-top:2px}
.bar-list button>div{display:grid;grid-template-columns:1fr auto;position:relative;padding-bottom:11px;gap:6px}
.bar-list span{display:flex;flex-direction:column;min-width:0}
.bar-list b{font-size:14px;font-weight:600;color:var(--ink)}
.bar-list small{font-size:12px;color:var(--muted);margin-top:2px}
.bar-list strong{font-size:13.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bar-list i{position:absolute;bottom:0;left:0;height:5px;border-radius:3px;background:var(--orange)}
.abc-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.abc{padding:14px;border-radius:10px;border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 10px;background:var(--surface)}
.abc b,.abc-dot{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13.5px;grid-row:1/3;font-family:var(--font-mono)}
.abc span{font-weight:700;font-size:14px;color:var(--ink)}
.abc small{font-size:12px;color:var(--muted)}
.abc.A{border-color:var(--red-border);background:var(--red-soft)}.abc.A b,.abc-dot.A{background:var(--red)}
.abc.B{border-color:var(--yellow-border);background:var(--yellow-soft)}.abc.B b,.abc-dot.B{background:#d97706}
.abc.C{border-color:var(--green-border);background:var(--green-soft)}.abc.C b,.abc-dot.C{background:var(--green)}
.suggestions{margin-top:20px;padding-top:18px;border-top:1px solid var(--line-soft)}
.suggestions h3{font-size:14.5px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.suggestions button{border:1px solid var(--orange-border);background:var(--orange-soft);border-radius:9px;padding:11px 13px;width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;text-align:left;margin-bottom:8px;transition:background .15s var(--ease)}
.suggestions button:hover{background:#ffedd5}
.suggestions button>span{color:var(--orange)}
.suggestions b{font-size:13.5px;font-weight:700;color:var(--ink)}
.suggestions small{display:block;font-size:12px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.suggestions em{font-style:normal;font-size:12px;font-weight:700;color:var(--orange);white-space:nowrap}
.machine-dist>div{display:grid;grid-template-columns:1fr 1.2fr 52px;gap:12px;align-items:center;margin:14px 0}
.machine-dist span{display:flex;flex-direction:column}
.machine-dist span b{font-size:14px;color:var(--ink)}
.machine-dist span small{font-size:12px;color:var(--muted)}
.machine-dist div{height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.machine-dist i{display:block;height:100%;background:var(--orange);border-radius:4px}
.machine-dist strong{font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.smart-note{margin-top:16px;padding:14px 16px;background:var(--orange-soft);border:1px solid var(--orange-border);border-radius:9px;color:#9a3412;font-size:13.5px}
.smart-note p{font-size:12.5px;margin-top:4px}

/* Cost Analysis */
.cost-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin-bottom:20px;align-items:stretch}
.cost-grid>.panel{display:flex;flex-direction:column}
.cost-bar-list{display:flex;flex-direction:column;gap:4px}
.cost-bar-list button{border:0;background:transparent;width:100%;display:grid;grid-template-columns:28px 1fr;gap:10px;text-align:left;padding:9px 8px;border-radius:8px;transition:background .15s var(--ease)}
.cost-bar-list button:hover{background:var(--surface-alt)}
.cost-bar-list button>em{font-style:normal;font-family:var(--font-mono);font-weight:700;font-size:12.5px;color:var(--muted2);padding-top:2px}
.cost-bar-list button>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;position:relative;padding-bottom:11px;align-items:baseline}
.cost-bar-list .cb-meta{display:flex;flex-direction:column;min-width:0}
.cost-bar-list .cb-meta b{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost-bar-list .cb-meta small{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cost-bar-list .cb-val{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cost-bar-list .cb-val strong{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.cost-bar-list .cb-val small{display:block;font-size:11.5px;color:var(--muted)}
.cost-bar-list .cb-track{position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.cost-bar-list .cb-track i{display:block;height:100%;border-radius:3px;background:var(--orange)}
.cost-bar-list .cb-track i.isg{background:var(--blue)}
.cost-chart-wrap{display:flex;flex-direction:column;justify-content:space-between;flex:1;min-height:0;gap:14px}
.cost-chart-svg{width:100%;height:230px;display:block;overflow:visible}
.cost-chart-legend{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:13px;color:var(--ink2)}
.cost-chart-legend .ccl-items{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cost-chart-legend span{display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.cost-chart-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.cost-chart-legend i.mech{background:var(--orange)}
.cost-chart-legend i.isg{background:var(--blue)}
.cost-share-cell{display:flex;align-items:center;justify-content:flex-end;gap:8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.cost-share-mini{width:56px;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;flex-shrink:0}
.cost-share-mini i{display:block;height:100%;border-radius:3px;background:var(--orange)}
.cost-share-mini i.isg{background:var(--blue)}
.data-table tbody tr[data-cost-key]{cursor:pointer}
.data-table tfoot td{padding:12px;border-top:2px solid var(--line);background:var(--surface-alt);font-weight:700;color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}
.cost-modal-sec{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft)}
.cost-modal-sec h4{margin:0 0 10px;font-size:13.5px;font-weight:700;color:var(--ink)}
.cost-mini-table{width:100%;border-collapse:collapse;font-size:13px}
.cost-mini-table th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);padding:7px 8px;border-bottom:1px solid var(--line);background:var(--surface-alt)}
.cost-mini-table td{padding:8px;border-bottom:1px solid var(--line-soft);color:var(--ink2);font-variant-numeric:tabular-nums}
.cost-mini-table th.num-col,.cost-mini-table td.num-col{text-align:right}
.cost-mini-table tbody tr:last-child td{border-bottom:0}
.cost-kpi-sub{font-size:12px;color:var(--muted);margin-top:2px}
.kpi strong.kpi-money{font-size:26px;letter-spacing:-.03em}

/* Labels & Connection */
.label-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 32px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:28px;box-shadow:var(--shadow-sm)}
.label-hero>div:first-child{max-width:500px}
.label-hero h2{font-size:28px;font-weight:800;margin:6px 0 8px}
.label-hero p{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.label-preview{width:248px;border:2px solid var(--navy);border-radius:10px;padding:14px;display:grid;grid-template-columns:92px 1fr;gap:4px 10px;align-items:center;background:#fff;flex-shrink:0}
.label-preview svg{width:88px;grid-row:1/3}
.label-preview b{font-size:15px;font-weight:800;color:var(--ink)}
.label-preview small{font-size:12px;color:var(--muted)}
.label-select{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(275px,100%),1fr));gap:10px}
.label-select label{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:grid;grid-template-columns:18px 46px 1fr auto;gap:10px;align-items:center;cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease)}
.label-select label:hover{border-color:#cbd5e1;background:var(--surface-alt)}
.label-select label:has(input:checked){border-color:var(--orange);background:var(--orange-soft)}
.label-select input{width:16px;height:16px;accent-color:var(--orange);margin:0}
.qr-thumb svg{width:44px;display:block;border-radius:4px}
.label-select div{display:flex;flex-direction:column;min-width:0}
.label-select b{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label-select small{font-size:12px;color:var(--muted);margin-top:2px}
.label-select em{font-size:12.5px;font-style:normal;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.label-size-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:20px;align-items:stretch}
.label-presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.label-preset-btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 11px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease)}
.label-preset-btn:hover{border-color:#cbd5e1;background:var(--surface-alt)}
.label-preset-btn.active{border-color:var(--orange);background:var(--orange-soft)}
.label-preset-btn b{font-family:var(--font-mono);font-size:12.5px;font-weight:700;color:var(--ink)}
.label-preset-btn small{font-size:11px;color:var(--muted)}
.label-dims{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.label-dims .field{margin-bottom:0}
.label-dims input,.label-dims select{height:40px;padding:0 10px;font-size:13.5px}
.label-preview-box{border:1px dashed var(--line);border-radius:12px;background:var(--surface-alt);padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:178px;overflow:hidden}
.label-preview-bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.label-preview-stage{width:100%;flex:1;display:grid;place-items:center;min-height:142px;overflow:hidden}
.lbl-preview-card{background:#fff;color:#0F172A;box-sizing:border-box;box-shadow:0 4px 14px rgba(15,23,42,.1);overflow:hidden;transform-origin:center center}
.lbl-preview-card svg{display:block;flex:none}
.lbl-preview-txt{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.8mm;overflow:hidden}
.lbl-preview-title{font-weight:800;line-height:1.12;color:#0F172A;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:break-word;word-break:normal}
.lbl-preview-code{font-family:var(--font-mono);font-weight:700;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl-preview-sub{color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label-design-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:end;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)}
.label-pos-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface-alt);gap:3px}
.label-pos-seg button{border:0;background:transparent;padding:7px 13px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s}
.label-pos-seg button.active{background:var(--orange);color:#fff;font-weight:700}
.label-font-ctrl{display:flex;align-items:center;gap:8px;min-width:0}
.label-font-ctrl input[type="range"]{flex:1;min-width:90px;accent-color:var(--orange);cursor:pointer;height:24px}
.label-font-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:700;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.label-font-btn:hover{border-color:var(--orange);color:var(--orange)}
.label-font-auto{height:30px;padding:0 9px;border-radius:7px;border:1px solid var(--line);background:var(--surface-alt);font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;flex:none}
.label-font-auto.active{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
.label-fields-box{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px}
.label-fields-head{font-size:12.5px;font-weight:700;color:var(--ink2)}
.label-fields-grid{display:flex;flex-wrap:wrap;gap:7px}
.label-field-chk{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none;transition:border-color .12s,background .12s}
.label-field-chk:has(input:checked){border-color:var(--orange);background:var(--orange-soft);color:var(--ink)}
.label-field-chk input{margin:0;accent-color:var(--orange);width:14px;height:14px}
.label-custom-note{height:36px;padding:0 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--surface);color:var(--ink);width:100%;max-width:340px}
.label-custom-note:focus{outline:none;border-color:var(--orange)}
@media(max-width:960px){.label-size-grid{grid-template-columns:1fr}.label-dims{grid-template-columns:repeat(2,minmax(0,1fr))}.label-design-row{grid-template-columns:1fr}}
.connection-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-bottom:20px;align-items:stretch}
.mode-cards{display:grid;gap:9px;margin-bottom:16px}
.mode-cards label{border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease)}
.mode-cards label:hover{border-color:#cbd5e1}
.mode-cards label.selected{border-color:var(--orange);background:var(--orange-soft)}
.mode-cards input{accent-color:var(--orange);margin-top:3px}
.mode-cards span{display:flex;flex-direction:column}
.mode-cards b{font-size:14px;font-weight:700;color:var(--ink)}
.mode-cards small{font-size:12.5px;color:var(--muted);margin-top:3px}
.button-row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.download-card{padding:20px;border-radius:10px;background:var(--surface-alt);border:1px solid var(--line)}
.download-card b{font-size:15.5px;font-weight:700;color:var(--ink)}
.download-card p{font-size:13.5px;line-height:1.55;color:var(--muted);margin:8px 0 16px}
.security-list{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.security-list p{font-size:13.5px;color:var(--ink2);display:flex;align-items:flex-start;gap:8px}
.security-list span{color:var(--green);margin-top:2px}
.code-panel pre{max-height:520px;overflow:auto;background:#0b1220;color:#e2e8f0;border:1px solid #1e293b;border-radius:10px;padding:18px;white-space:pre;font-size:12.5px;line-height:1.6}

/* Forms, Details, Modals, Toasts */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{width:100%;height:42px;border:1px solid #cbd5e1;border-radius:var(--radius-sm);padding:0 12px;outline:0;background:var(--surface);font-size:14.5px;color:var(--ink);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(234,88,12,.14)}
.field small{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.qty{display:grid;grid-template-columns:42px 1fr 42px}
.qty input{border-radius:0;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.qty button{border:1px solid #cbd5e1;background:var(--surface-alt);font-size:18px;font-weight:600}
.qty button:hover{background:var(--line-soft)}
.qty button:first-child{border-radius:8px 0 0 8px;border-right:0}
.qty button:last-child{border-radius:0 8px 8px 0;border-left:0}
.rule-note{display:flex;gap:10px;padding:12px 14px;border-radius:9px;margin-top:8px;border:1px solid transparent}
.rule-note b{font-size:13px;white-space:nowrap}
.rule-note span{font-size:13px;line-height:1.45}
.rule-note.ok{background:var(--green-soft);border-color:var(--green-border);color:var(--green)}
.rule-note.warn{background:var(--yellow-soft);border-color:var(--yellow-border);color:var(--yellow)}
.item-summary{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.item-summary>div{display:flex;flex-direction:column;min-width:0}
.item-summary>div b{font-size:15px;font-weight:700;color:var(--ink)}
.item-summary>div small{font-size:12.5px;color:var(--muted)}
.item-summary>strong{margin-left:auto;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.item-detail-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
.item-detail-head h2{font-size:22px;font-weight:800;margin:8px 0 4px}
.item-detail-head p{font-size:13px;color:var(--muted)}
.stock-number{text-align:right;flex-shrink:0}
.stock-number small,.stock-number span{display:block;font-size:12.5px;color:var(--muted)}
.stock-number b{font-size:40px;font-weight:800;line-height:1.05;color:var(--ink)}
.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.detail-grid div{padding:12px 13px;background:var(--surface-alt);border:1px solid var(--line-soft);border-radius:9px;display:flex;flex-direction:column}
.detail-grid small{font-size:12px;color:var(--muted)}
.detail-grid b{font-size:14px;font-weight:700;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
.modal-actions-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.modal-actions-grid button{border:1px solid var(--line);background:var(--surface);padding:11px 14px;border-radius:9px;font-size:13.5px;font-weight:600;text-align:left;display:flex;align-items:center;gap:9px;color:var(--ink);transition:border-color .15s var(--ease),background .15s var(--ease)}
.modal-actions-grid button:hover{border-color:var(--orange-border);background:var(--orange-soft);color:var(--orange)}
.approval-warning{background:var(--red-soft);border:1px solid var(--red-border);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:center;color:var(--red)}
.approval-warning>b{width:34px;height:34px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;flex-shrink:0}
.approval-warning p{font-size:13.5px;line-height:1.45}
.tabs-mini{display:flex;margin:16px 0;border-bottom:1px solid var(--line)}
.tabs-mini button{flex:1;border:0;border-bottom:2px solid transparent;padding:10px;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;margin-bottom:-1px}
.tabs-mini button.active{color:var(--orange);border-color:var(--orange);font-weight:700}
.cabinet-head{display:flex;gap:14px;padding:14px;background:var(--blue-soft);border:1px solid var(--blue-border);border-radius:10px;align-items:center}
.qr-mini svg{width:64px;display:block;border-radius:5px}
.cabinet-head b{font-size:14.5px;color:var(--ink)}
.cabinet-head p{font-size:12.5px;color:var(--ink2);margin-top:3px}
.cabinet-list{margin:14px 0;max-height:270px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.cabinet-list label{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.cabinet-list label:last-child{border-bottom:0}
.cabinet-list label:hover{background:var(--surface-alt)}
.cabinet-list input{accent-color:var(--orange)}
.cabinet-list span{display:flex;flex-direction:column;font-size:14px;font-weight:600;color:var(--ink)}
.cabinet-list small{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
.cabinet-list em{font-style:normal;font-size:12px;color:var(--green);font-weight:700}
.camera{height:300px;background:#0b1220;border-radius:12px;overflow:hidden;position:relative}
.camera video{width:100%;height:100%;object-fit:cover}
.camera-frame{position:absolute;width:184px;height:184px;border:2.5px solid var(--orange);border-radius:10px;inset:50% auto auto 50%;transform:translate(-50%,-50%);box-shadow:0 0 0 999px rgba(15,23,42,.45)}
.camera-help{font-size:13px;color:var(--muted);margin:10px 0 14px}
#modalRoot{position:fixed;z-index:1000}
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.56);display:grid;place-items:center;padding:12px;backdrop-filter:blur(5px);overflow-x:hidden}
.modal{width:min(640px,calc(100vw - 24px));max-width:100%;min-width:0;max-height:92dvh;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;animation:pop .16s var(--ease)}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.modal>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal>header h3{font-size:17px;font-weight:700;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis}
.modal-body{padding:18px;overflow:auto;min-width:0}
.modal>footer{padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-alt);border-radius:0 0 var(--radius-lg) var(--radius-lg);display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.toasts,#toasts{position:fixed;z-index:5000;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px}
.toast{min-width:290px;max-width:440px;background:var(--navy);color:#f8fafc;border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:12px 15px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);animation:slide .18s var(--ease)}
.toast b{width:24px;height:24px;border-radius:6px;background:var(--green);display:grid;place-items:center;flex-shrink:0;color:#fff}
.toast.error b{background:var(--red)}
.toast span{font-size:13.5px;line-height:1.4}
@keyframes slide{from{transform:translateY(10px);opacity:0}}
.form-span-2{grid-column:1/-1}
.usage-grid{display:flex;flex-wrap:wrap;gap:7px}
.usage-grid label{display:inline-flex;align-items:center;gap:7px;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 11px;background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.usage-grid label:has(input:checked){border-color:var(--orange);background:var(--orange-soft);color:var(--orange-hover)}
.usage-grid input{width:16px!important;height:16px!important;min-width:16px;flex:0 0 16px;margin:0;padding:0;accent-color:var(--orange)}
.usage-grid input:disabled+span{opacity:.45}
.machine-options label{display:flex;align-items:center;justify-content:flex-start;gap:7px;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface);font-size:13px;font-weight:500;line-height:1.3;text-align:left;cursor:pointer}
.machine-options label:has(input:checked){border-color:var(--orange);background:var(--orange-soft);color:var(--orange-hover)}
.machine-options input{width:16px!important;height:16px!important;min-width:16px;flex:0 0 16px;margin:0;padding:0;accent-color:var(--orange)}
.machine-options label span{min-width:0;white-space:normal;overflow-wrap:anywhere}
.machine-picker{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-alt)}
.machine-picker[hidden]{display:none}
.machine-picker-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.machine-picker-head b{font-size:13px;font-weight:700;color:var(--ink)}
.machine-picker-head small{font-size:12px}
.machine-search{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;padding:0 11px;margin-bottom:9px;font-size:14px;background:var(--surface)}
.machine-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;max-height:230px;overflow:auto;padding-right:3px}
.auto-field input{background:var(--surface-alt);color:var(--muted)}
.created-qr{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;padding:16px;border:1px solid var(--orange-border);border-radius:12px;background:var(--orange-soft)}
.created-qr svg{width:120px;border-radius:6px}
.created-qr h3{font-size:18px;margin-bottom:4px;font-family:var(--font-mono)}
.created-qr p{font-size:13.5px;color:var(--ink2);margin:4px 0}
.price-preview{font-weight:700;color:var(--orange)!important;font-variant-numeric:tabular-nums}

/* KKD Zimmet & Digital Signature */
.ppe-pending-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.ppe-pending-card{border:1px solid var(--yellow-border);background:var(--surface);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-sm)}
.ppe-pending-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ppe-pending-head b{font-size:15px;font-weight:700;color:var(--ink)}
.ppe-pending-head small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ppe-pending-items{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:9px;background:var(--surface-alt);border:1px solid var(--line-soft)}
.ppe-pending-items div{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2)}
.ppe-pending-items strong{font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.ppe-pending-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:4px}
.ppe-pending-foot small{font-size:12px;color:var(--muted)}
.ppe-line-row{display:grid;grid-template-columns:1fr 92px 36px;gap:8px;align-items:center;margin-bottom:8px}
.ppe-line-row select,.ppe-line-row input{height:40px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;font-size:14px;background:var(--surface);color:var(--ink)}
.ppe-line-row input{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.ppe-line-row button{height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface-alt);color:var(--muted);font-size:18px;line-height:1}
.ppe-line-row button:hover{border-color:var(--red-border);background:var(--red-soft);color:var(--red)}
.legal-check{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface-alt);cursor:pointer;margin:12px 0;transition:border-color .15s var(--ease),background .15s var(--ease)}
.legal-check:has(input:checked){border-color:var(--green-border);background:var(--green-soft)}
.legal-check input{width:18px!important;height:18px!important;min-width:18px;margin-top:2px;accent-color:var(--green);cursor:pointer}
.legal-check span{font-size:12.5px;line-height:1.55;color:var(--ink2)}
.legal-check strong{display:block;font-size:13px;color:var(--ink);margin-bottom:3px}
.sig-wrap{border:1.5px solid #cbd5e1;border-radius:10px;background:#fff;overflow:hidden;margin-top:8px}
.sig-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface-alt);border-bottom:1px solid var(--line-soft);font-size:12.5px;color:var(--muted)}
.sig-head b{color:var(--ink);font-weight:700}
.sig-status{font-weight:600;color:var(--muted)}
.sig-status.ready{color:var(--green)}
.sig-stage{position:relative;background:#fff}
.sig-stage::after{content:'';position:absolute;left:18px;right:18px;bottom:26px;border-bottom:1px dashed #cbd5e1;pointer-events:none}
.sig-canvas{display:block;width:100%;height:140px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
.sig-wrap.compact .sig-canvas{height:114px}
.sig-foot{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;border-top:1px solid var(--line-soft);background:var(--surface-alt);font-size:12px;color:var(--muted)}
.sig-clear{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:7px;padding:5px 10px;font-size:12px;font-weight:600}
.sig-clear:hover{border-color:var(--red-border);color:var(--red);background:var(--red-soft)}
.ppe-mode-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.ppe-mode-toggle label{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--surface)}
.ppe-mode-toggle label:has(input:checked){border-color:var(--orange);background:var(--orange-soft)}
.ppe-mode-toggle input{margin-top:3px;accent-color:var(--orange)}
.ppe-mode-toggle b{display:block;font-size:13px;color:var(--ink)}
.ppe-mode-toggle small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.ppe-row-actions{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px;border-radius:7px}
.alert-cards article{justify-content:space-between}
.alert-cards .alert-card-main{display:flex;align-items:center;gap:12px;min-width:0}

/* Official A4 KKD Document */
.ppe-doc{background:#fff;border:1px solid #cbd5e1;border-radius:10px;padding:24px;color:#0f172a;font-size:13px;line-height:1.5}
.ppe-doc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:14px;border-bottom:2px solid #0f172a;margin-bottom:16px}
.ppe-doc-head h4{margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em;color:#0f172a}
.ppe-doc-head p{margin:3px 0 0;font-size:12px;color:#475569}
.ppe-doc-no{text-align:right;font-variant-numeric:tabular-nums}
.ppe-doc-no b{display:block;font-family:var(--font-mono);font-size:13.5px;color:#0f172a}
.ppe-doc-no small{font-size:11.5px;color:#475569}
.ppe-doc-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;padding:12px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:16px}
.ppe-doc-meta div{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;border-bottom:1px dotted #e2e8f0;padding-bottom:4px}
.ppe-doc-meta div:nth-last-child(-n+2){border-bottom:0;padding-bottom:0}
.ppe-doc-meta span{color:#64748b}
.ppe-doc-meta b{color:#0f172a;text-align:right}
.ppe-doc-table{width:100%;border-collapse:collapse;margin-bottom:16px;font-size:12.5px}
.ppe-doc-table th,.ppe-doc-table td{border:1px solid #cbd5e1;padding:7px 9px;text-align:left}
.ppe-doc-table th{background:#f1f5f9;font-weight:700;color:#0f172a;font-size:11px;text-transform:uppercase;letter-spacing:.02em}
.ppe-doc-table td.num-col,.ppe-doc-table th.num-col{text-align:right;font-variant-numeric:tabular-nums}
.ppe-doc-table td.wet-cell,.ppe-doc-table th.wet-cell{width:92px;min-width:92px;text-align:center}
.ppe-doc-table td.wet-cell{height:28px;color:#cbd5e1;font-size:10px}
.ppe-doc-summary{margin:0 0 14px;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;font-size:12px;line-height:1.6;color:#1e293b}
.ppe-doc-summary b{color:#0f172a;margin-right:6px}
.ppe-doc-legal{padding:12px 14px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;margin-bottom:18px;font-size:12px;line-height:1.6;color:#1e293b}
.ppe-doc-legal b{display:block;font-size:12px;color:#0f172a;margin-bottom:4px}
.ppe-doc-sigs{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ppe-doc-sigbox{border:1px solid #cbd5e1;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;min-height:152px}
.ppe-doc-sigbox small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#64748b}
.ppe-doc-sigbox b{display:block;font-size:13.5px;color:#0f172a;margin-top:2px}
.ppe-sig-preview{height:84px;display:flex;align-items:center;justify-content:center;border-bottom:1px dashed #cbd5e1;margin:8px 0}
.ppe-sig-preview.wet-space{align-items:flex-end;padding-bottom:6px;border-bottom:1px solid #94a3b8;color:#94a3b8;font-size:11px;letter-spacing:.03em}
.ppe-sig-preview svg{width:100%;max-width:240px;height:78px;display:block}
.ppe-sig-pending-txt{font-size:12px;color:#b45309;font-weight:600}
.ppe-doc-sigmeta{font-size:11px;color:#64748b;font-variant-numeric:tabular-nums}
.ppe-doc-page{page-break-after:always;break-after:page}
.ppe-doc-page:last-child{page-break-after:auto;break-after:auto}
#ppePrintRoot{display:none}

.akg-title-cell{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 14px;font-size:20px;font-weight:800;letter-spacing:-.01em;border-right:1px solid #0f172a}

.akg-meta-val{padding:3px 6px;border-right:1px solid #0f172a;border-bottom:1px solid #0f172a;display:flex;align-items:center}
.akg-meta-val:nth-child(6n){border-right:0}
.akg-meta>div:nth-last-child(-n+6){border-bottom:0}
.akg-meta-val input,.akg-meta-val select{width:100%;border:1px solid transparent;border-radius:4px;padding:4px 6px;font-size:12px;font-weight:700;color:#0f172a;background:transparent}

.akg-meta-val input[readonly]{background:#f8fafc;color:#334155}
.akg-tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.akg-tbl th{border:1px solid #0f172a;border-top:0;padding:5px 4px;font-size:10.5px;font-weight:700;text-align:center;line-height:1.25;background:#f8fafc}

.akg-tbl input.num-in{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.akg-tbl .akg-tot-cell{padding:4px 6px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;font-size:11.5px}
.akg-tbl .akg-pick-btn{width:22px;height:22px;border:1px solid #cbd5e1;border-radius:4px;background:#f8fafc;color:#475569;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:11px;padding:0;flex:none}

.akg-red{color:#dc2626}
.akg-grand{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.akg-pay{display:grid;grid-template-columns:130px 1fr 130px 1fr 90px 1fr 125px 1fr;border-bottom:1px solid #0f172a}
.akg-pay-lbl{padding:5px 7px;font-size:10.5px;font-weight:700;line-height:1.25;border-right:1px solid #0f172a;background:#f8fafc;display:flex;flex-direction:column;justify-content:center}
