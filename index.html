<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Mekanik ve İSG depoları için rol bazlı QR stok yönetimi">
<meta property="og:title" content="Mekanik + İSG Depo 2027 · V8.7">
<meta property="og:description" content="Mekanik ve İSG depoları için rol bazlı QR stok yönetimi">
<title>Mekanik + İSG Depo 2027 · V8.7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#ea580c;--orange-hover:#c2410c;--orange2:#f97316;--orange-soft:#fff7ed;--orange-border:#fed7aa;
  --navy:#0f172a;--navy2:#1e293b;--navy3:#334155;
  --ink:#0f172a;--ink2:#334155;--muted:#64748b;--muted2:#94a3b8;
  --line:#e2e8f0;--line-soft:#f1f5f9;--bg:#f4f6f9;--surface:#ffffff;--surface-alt:#f8fafc;
  --green:#15803d;--green-soft:#ecfdf5;--green-border:#bbf7d0;
  --red:#b91c1c;--red-soft:#fef2f2;--red-border:#fecaca;
  --blue:#1d4ed8;--blue-soft:#eff6ff;--blue-border:#bfdbfe;
  --yellow:#b45309;--yellow-soft:#fffbeb;--yellow-border:#fde68a;
  --shadow-sm:0 1px 2px rgba(15,23,42,.04);--shadow:0 10px 28px rgba(15,23,42,.08);--shadow-lg:0 24px 64px rgba(15,23,42,.24);
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --ease:cubic-bezier(.16,1,.3,1);
  --font-sans:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  font-family:var(--font-sans);color:var(--ink);background:var(--bg);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-size:15px;line-height:1.5;color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.025em}
small{color:var(--muted)}
code,pre,.mono{font-family:var(--font-mono)}
.num,.kpi strong,.data-table .big,.stock-number b,.ready-summary b,.critical-list strong,.donut span{font-variant-numeric:tabular-nums}
.ic{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;vertical-align:middle}
.ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic-sm svg{width:15px;height:15px}
.ic-lg svg{width:22px;height:22px}
.busy{cursor:progress}
.loader{display:none;position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.18);backdrop-filter:blur(2px)}
.busy .loader{display:grid;place-items:center}
.loader span{width:42px;height:42px;border:3px solid rgba(255,255,255,.35);border-top-color:var(--orange);border-radius:50%;animation:spin .65s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(480px,1.15fr) minmax(400px,.85fr);background:var(--surface)}
.login-art{position:relative;overflow:hidden;padding:48px 56px;color:#f8fafc;background:radial-gradient(circle at 82% 18%,rgba(234,88,12,.22),transparent 46%),linear-gradient(160deg,#0b1220 0%,#0f172a 58%,#162133 100%);display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid rgba(255,255,255,.06)}
.art-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.07) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,black 30%,transparent 100%);pointer-events:none}
.login-brand,.brand{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.brand-mark{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--orange);color:#fff;font-size:19px;font-weight:800;letter-spacing:-.04em;flex-shrink:0}
.login-brand div,.brand div{display:flex;flex-direction:column}
.login-brand b{font-size:16px;font-weight:700;letter-spacing:-.01em;color:#fff}
.login-brand small{color:#94a3b8;font-size:12px;margin-top:2px}
.login-copy{position:relative;z-index:1;max-width:560px}
.login-kicker{font-size:13px;font-weight:600;color:#fb923c;letter-spacing:.01em}
.login-copy h1{font-size:clamp(40px,4.6vw,62px);line-height:1.06;letter-spacing:-.04em;font-weight:800;margin:14px 0 18px;color:#fff}
.login-copy p{font-size:16.5px;line-height:1.65;max-width:480px;color:#cbd5e1}
.login-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;position:relative;z-index:1;padding-top:28px;border-top:1px solid rgba(148,163,184,.18);max-width:520px}
.login-stats div{display:flex;flex-direction:column;gap:4px}
.login-stats b{font-size:30px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.login-stats span{font-size:13px;color:#94a3b8}
.login-form{display:grid;place-items:center;padding:48px 40px 64px;position:relative;background:var(--surface)}
.login-form form{width:min(410px,100%)}
.login-form .kicker{font-size:13px;font-weight:600;color:var(--orange)}
.login-form h2{font-size:30px;font-weight:800;margin:8px 0 10px;color:var(--ink)}
.login-form form>p{color:var(--muted);font-size:14.5px;line-height:1.55;margin-bottom:24px}
.login-form>footer{position:absolute;bottom:20px;color:var(--muted2);font-size:12.5px}
.pin-wrap{position:relative}
.pin-wrap input{font-family:var(--font-mono);font-size:22px;letter-spacing:.26em;padding-right:48px;height:50px}
.pin-wrap button{position:absolute;right:6px;top:5px;border:0;background:transparent;width:40px;height:40px;border-radius:8px;color:var(--muted);display:grid;place-items:center}
.pin-wrap button:hover{background:var(--line-soft);color:var(--ink)}
.login-mode{margin-top:16px;text-align:center;color:var(--muted);font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px}
.login-mode i,.connection i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#94a3b8;flex-shrink:0}
.login-mode i.demo,.connection.demo i{background:#d97706}
.login-mode i.proxy,.connection.proxy i{background:#16a34a}
.login-mode i.direct,.connection.direct i{background:#2563eb}
details{margin-top:14px;background:var(--surface-alt);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--ink);font-size:13.5px;user-select:none}
details p{margin-top:8px;font-size:13.5px}
.demo-pins{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.demo-pins button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;color:var(--ink);transition:border-color .15s var(--ease),background .15s var(--ease)}
.demo-pins button:hover{border-color:var(--orange);background:var(--orange-soft)}
.demo-pins button b{color:var(--orange);font-family:var(--font-mono);font-weight:700}
.login-conn-body{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.login-conn-body .field{margin-bottom:0}
.login-conn-body .button-row{justify-content:space-between}
.wide{width:100%}

/* App Shell & Top Navigation */
#app{min-height:100vh;display:flex;flex-direction:column}
.sidebar{position:sticky;z-index:40;top:0;left:0;right:0;width:100%;background:var(--navy);color:#f8fafc;display:flex;flex-direction:column;border-bottom:1px solid rgba(255,255,255,.08)}
.nav-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 28px;min-height:56px}
.nav-right{display:flex;align-items:center;gap:12px;margin-left:auto}
.brand{padding:0;border:0;flex-shrink:0}
.brand .brand-mark{width:34px;height:34px;font-size:17px;border-radius:9px}
.brand b{font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:#fff;white-space:nowrap}
.brand small{font-size:11.5px;color:#94a3b8;margin-top:1px;white-space:nowrap}
.sidebar .connection{background:transparent;border:0;color:#cbd5e1;padding:0 6px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.sidebar .nav-refresh{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#f8fafc;padding:7px 12px;height:36px;font-size:13px}
.sidebar .nav-refresh:hover{background:rgba(255,255,255,.14);transform:none}
.sidebar nav{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;align-items:center;gap:2px;padding:0 24px;background:rgba(15,23,42,.5);border-top:1px solid rgba(255,255,255,.07)}
.sidebar nav::-webkit-scrollbar{display:none}
.nav-item{border:0;background:transparent;color:#94a3b8;text-align:left;display:inline-flex;align-items:center;gap:8px;padding:11px 14px;border-radius:0;position:relative;font-size:13.5px;font-weight:600;white-space:nowrap;flex-shrink:0;transition:color .15s var(--ease),background .15s var(--ease)}
.nav-item:hover{color:#fff;background:rgba(255,255,255,.04)}
.nav-item.active{color:#fff;font-weight:700}
.nav-item.active:after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2.5px;background:var(--orange);border-radius:2px 2px 0 0}
.nav-item.active .ic{color:#fb923c}
.nav-item em{margin-left:2px;background:var(--orange);color:#fff;font-style:normal;font-size:11.5px;font-weight:700;min-width:19px;height:19px;padding:0 6px;display:grid;place-items:center;border-radius:6px;font-variant-numeric:tabular-nums}
.side-foot{margin-top:0;border-left:1px solid rgba(255,255,255,.12);padding-left:14px;display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:8px;background:rgba(234,88,12,.22);border:1px solid rgba(234,88,12,.45);color:#fdba74;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.side-foot>div:nth-child(2){min-width:0;display:flex;flex-direction:column;max-width:180px}
.side-foot b{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot small{font-size:11.5px;color:#94a3b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot .icon-btn{color:#94a3b8;width:36px;height:36px;display:grid;place-items:center;border-radius:8px}
.side-foot .icon-btn:hover{color:#fff;background:rgba(255,255,255,.1)}
.mobile-menu{display:none;color:#fff;width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06)}

/* Main Workspace & Page Header */
.main{margin-left:0;width:100%;flex:1;min-height:0;display:flex;flex-direction:column}
.topbar{padding:18px 28px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}
.topbar-left{display:flex;flex-direction:column;gap:3px;min-width:0}
.crumb{font-size:12.5px;color:var(--muted);font-weight:500}
.topbar h1{font-size:23px;font-weight:800;color:var(--ink);line-height:1.2}
.topbar p{font-size:13.5px;color:var(--muted)}
.top-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
#content{width:100%;max-width:none;padding:24px 28px 48px;margin:0}

/* Surfaces, Buttons, Controls */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:22px 24px}
.panel+.panel{margin-top:20px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.panel-head h2{font-size:17.5px;font-weight:700;color:var(--ink)}
.panel-head p{font-size:13.5px;color:var(--muted);margin-top:3px}
.meta-inline{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.btn{border:1px solid transparent;border-radius:var(--radius-sm);padding:9px 16px;min-height:40px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;flex-shrink:0;transition:background .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn.primary:hover:not(:disabled){background:var(--orange-hover);border-color:var(--orange-hover)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--surface-alt);border-color:#cbd5e1}
.btn.white{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.22)}
.btn.white:hover:not(:disabled){background:rgba(255,255,255,.18)}
.btn.large{padding:11px 20px;min-height:46px;font-size:14.5px;font-weight:700}
.btn.approve{background:var(--green);color:#fff}
.btn.approve:hover:not(:disabled){background:#166534}
.btn.reject{background:var(--surface);border-color:var(--red-border);color:var(--red)}
.btn.reject:hover:not(:disabled){background:var(--red-soft)}
.icon-btn{border:0;background:transparent;width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;color:var(--muted);transition:background .15s var(--ease),color .15s var(--ease)}
.icon-btn:hover{background:var(--line-soft);color:var(--ink)}
.link{border:0;background:transparent;color:var(--orange);font-weight:600;font-size:13.5px;padding:4px 0;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.link:hover{color:var(--orange-hover);text-decoration:underline}
.notice{padding:13px 16px;border-radius:var(--radius-sm);background:var(--yellow-soft);border:1px solid var(--yellow-border);color:var(--yellow);font-size:13.5px;margin-bottom:14px}
.empty{padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface-alt);border:1px dashed #cbd5e1;border-radius:var(--radius-sm);font-size:14px}
.empty.good{color:var(--green);background:var(--green-soft);border-color:var(--green-border)}
.connection{font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}

/* KPI Strip & Dashboard */
.kpi-grid,.approval-kpis,.ppe-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.approval-kpis,.ppe-summary{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm)}
.kpi-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.kpi small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi-icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;background:var(--orange-soft);color:var(--orange);flex-shrink:0}
.kpi.blue .kpi-icon{background:var(--blue-soft);color:var(--blue)}
.kpi.red .kpi-icon{background:var(--red-soft);color:var(--red)}
.kpi.green .kpi-icon{background:var(--green-soft);color:var(--green)}
.kpi strong{font-size:32px;font-weight:800;letter-spacing:-.035em;line-height:1.05;color:var(--ink)}
.kpi p{font-size:13px;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:20px;margin-bottom:20px;align-items:stretch}
.critical-list{display:flex;flex-direction:column}
.critical-list button{border:0;border-top:1px solid var(--line-soft);background:transparent;padding:13px 10px;margin:0 -10px;border-radius:8px;display:grid;grid-template-columns:1fr minmax(90px,130px) auto;gap:16px;text-align:left;align-items:center;transition:background .15s var(--ease)}
.critical-list button:first-child{border-top:0}
.critical-list button:hover{background:var(--surface-alt)}
.critical-list .crit-info{display:flex;flex-direction:column;gap:3px;min-width:0}
.critical-list .crit-info b{font-size:14.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.critical-list .crit-info small{font-size:12.5px;color:var(--muted)}
.crit-meter{display:flex;flex-direction:column;gap:5px}
.crit-bar{height:6px;background:var(--line-soft);border-radius:3px;overflow:hidden}
.crit-bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.crit-meter small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.critical-list strong{font-size:16px;font-weight:700;color:var(--red);text-align:right;white-space:nowrap}
.critical-list strong small{font-size:12px;font-weight:500;color:var(--muted)}
.donut-wrap{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:10px 4px}
.donut{width:152px;height:152px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--orange) calc(var(--p)*1%),var(--blue) 0);position:relative;flex-shrink:0}
.donut:after{content:"";position:absolute;inset:22px;background:var(--surface);border-radius:50%}
.donut span{z-index:1;display:flex;flex-direction:column;align-items:center;font-size:28px;font-weight:800;line-height:1.1;color:var(--ink)}
.donut span small{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px}
.legend{flex:1;display:flex;flex-direction:column;gap:0}
.legend p{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:14px;color:var(--ink2)}
.legend p:last-child{border-bottom:0}
.legend p b{font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink)}
.legend i{width:9px;height:9px;border-radius:3px}
.legend i.orange{background:var(--orange)}
.legend i.blue{background:var(--blue)}
.legend i.red{background:var(--red)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.quick button{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:15px 16px;display:flex;align-items:center;gap:13px;text-align:left;transition:border-color .15s var(--ease),background .15s var(--ease)}
.quick button:hover{border-color:var(--orange-border);background:var(--orange-soft)}
.quick button>b{width:40px;height:40px;border-radius:9px;background:var(--surface-alt);border:1px solid var(--line);color:var(--orange);display:grid;place-items:center;flex-shrink:0}
.quick button:hover>b{background:var(--surface);border-color:var(--orange-border)}
.quick span{display:flex;flex-direction:column;font-weight:700;font-size:14px;color:var(--ink)}
.quick small{font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}

/* Operator QR */
.qr-hero{border-radius:var(--radius-lg);background:radial-gradient(circle at 86% 24%,rgba(234,88,12,.25),transparent 42%),linear-gradient(135deg,#0f172a 0%,#1e293b 100%);color:#f8fafc;padding:34px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.08)}
.qr-hero>div{position:relative;z-index:1}
.qr-kicker{font-size:13px;font-weight:600;color:#fb923c}
.qr-hero h2{font-size:32px;font-weight:800;margin:8px 0 10px;color:#fff}
.qr-hero p{color:#cbd5e1;max-width:520px;font-size:15px}
.qr-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.scan-visual{width:200px;display:grid;place-items:center;flex-shrink:0}
.scan-frame{width:144px;height:144px;position:relative;display:grid;place-items:center;color:rgba(255,255,255,.32)}
.scan-frame i{position:absolute;width:30px;height:30px;border-color:#fb923c;border-style:solid;border-radius:2px}
.scan-frame i:nth-child(1){left:0;top:0;border-width:3px 0 0 3px}
.scan-frame i:nth-child(2){right:0;top:0;border-width:3px 3px 0 0}
.scan-frame i:nth-child(3){left:0;bottom:0;border-width:0 0 3px 3px}
.scan-frame i:nth-child(4){right:0;bottom:0;border-width:0 3px 3px 0}
.scan-frame span{position:absolute;width:118px;height:2px;background:linear-gradient(90deg,transparent,#fb923c,transparent);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(-48px)}50%{transform:translateY(48px)}}
.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 20px}
.choice-grid>button{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:18px 20px;display:grid;grid-template-columns:46px 1fr auto;align-items:center;gap:15px;text-align:left;box-shadow:var(--shadow-sm);transition:border-color .15s var(--ease),background .15s var(--ease)}
.choice-grid>button:hover:not(:disabled){border-color:var(--orange-border);background:var(--orange-soft)}
.choice-icon{width:46px;height:46px;border-radius:10px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;flex-shrink:0}
.choice-icon.blue{background:var(--blue-soft);color:var(--blue)}
.choice-grid b{font-size:15.5px;font-weight:700;color:var(--ink)}
.choice-grid p{font-size:13px;color:var(--muted);margin-top:3px}
.choice-grid em{font-style:normal;color:var(--orange);font-size:13px;font-weight:700;white-space:nowrap}
.product-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
.product-strip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;text-align:left;display:flex;align-items:center;gap:12px;transition:border-color .15s var(--ease),background .15s var(--ease)}
.product-strip button:hover{border-color:#cbd5e1;background:var(--surface-alt)}
.product-strip button>span{width:36px;height:36px;border-radius:8px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;flex-shrink:0}
.product-strip button.isg-item>span{background:var(--blue-soft);color:var(--blue)}
.product-strip div{display:flex;flex-direction:column;min-width:0;flex:1}
.product-strip b{font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.product-strip small{font-size:12.5px;margin-top:2px;color:var(--muted);font-variant-numeric:tabular-nums}

/* Toolbars & High-Density Tables */
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.table-panel .toolbar{padding-bottom:16px;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface-alt);gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:6px;color:var(--muted);font-size:13px;font-weight:600;white-space:nowrap;transition:background .15s var(--ease),color .15s var(--ease)}
.seg button:hover{color:var(--ink)}
.seg button.active{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.search{height:40px;border:1px solid var(--line);border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px;padding:0 12px;flex:1;min-width:220px;background:var(--surface);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.search:focus-within{border-color:var(--orange);box-shadow:0 0 0 3px rgba(234,88,12,.14)}
.search .ic{color:var(--muted2)}
.search input{border:0;outline:0;width:100%;font-size:14px;background:transparent}
.toolbar select,.field-inline select{height:40px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);padding:0 12px;color:var(--ink);font-size:13.5px}
.table-scroll{overflow:auto;border:1px solid var(--line);border-radius:10px}
.data-table{width:100%;border-collapse:collapse;min-width:920px;background:var(--surface)}
.data-table th{font-size:12px;font-weight:700;color:var(--muted);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface-alt);white-space:nowrap;position:sticky;top:0;z-index:1}
.data-table th.num-col,.data-table td.num-col{text-align:right}
.data-table td{padding:11px 12px;border-bottom:1px solid var(--line-soft);font-size:13.5px;vertical-align:middle;color:var(--ink2)}
.data-table tbody tr:last-child td{border-bottom:0}
.data-table tbody tr{transition:background .12s var(--ease)}
.data-table tbody tr[data-item],.data-table tbody tr[data-analysis-item],.data-table tbody tr[data-recipe-machine]{cursor:pointer}
.data-table tbody tr:hover{background:#f8fafc}
.data-table td>b{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.data-table td>small{display:block;margin-top:2px;font-size:12.5px;color:var(--muted)}
.data-table .big{font-size:14.5px;font-weight:700;color:var(--ink);white-space:nowrap}
.data-table .big small{display:inline;font-size:12px;font-weight:500;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.badge.success{background:var(--green-soft);color:var(--green);border-color:var(--green-border)}
.badge.danger{background:var(--red-soft);color:var(--red);border-color:var(--red-border)}
.badge.warning{background:var(--yellow-soft);color:var(--yellow);border-color:var(--yellow-border)}
.badge.neutral{background:var(--surface-alt);color:var(--ink2);border-color:var(--line)}
.depot{font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;display:inline-block;white-space:nowrap}
.depot.mekanik{background:var(--orange-soft);color:var(--orange)}
.depot.isg{background:var(--blue-soft);color:var(--blue)}
.table-foot{display:flex;justify-content:space-between;align-items:center;padding-top:12px;font-size:13px;color:var(--muted)}
.stock-table{table-layout:fixed;min-width:1120px}
.stock-table th:nth-child(1){width:7.5%}
.stock-table th:nth-child(2){width:20%}
.stock-table th:nth-child(3){width:7.5%}
.stock-table th:nth-child(4){width:20%}
.stock-table th:nth-child(5){width:7%}
.stock-table th:nth-child(6){width:5.5%}
.stock-table th:nth-child(7){width:5.5%}
.stock-table th:nth-child(8){width:5.5%}
.stock-table th:nth-child(9){width:7%}
.stock-table th:nth-child(10){width:14.5%}
.stock-table td:nth-child(2),.stock-table td:nth-child(10){overflow-wrap:anywhere}
.usage-text{font-size:13px;color:var(--ink2);line-height:1.45}
.usage-text .usage-approval{color:var(--red);font-weight:700}
.usage-empty{color:var(--muted2)}

/* Approvals */
.approval-list{display:flex;flex-direction:column}
.approval-list article{display:grid;grid-template-columns:155px 1fr auto auto;align-items:center;gap:18px;padding:16px 4px;border-top:1px solid var(--line-soft)}
.approval-list article:first-child{border-top:0}
.approval-id{display:flex;flex-direction:column;gap:4px}
.approval-id span{font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--ink)}
.approval-id small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.approval-list article>div:nth-child(2) b{font-size:15px;font-weight:700;color:var(--ink)}
.approval-list article>div:nth-child(2) p,.approval-list article>div:nth-child(2) small{font-size:13px;color:var(--muted);margin-top:3px;display:block}
.approval-buttons{display:flex;gap:8px}

/* Maintenance Master-Detail */
.maintenance-top{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.maintenance-top>div:first-child{display:flex;gap:14px;flex-wrap:wrap}
.maintenance-top .field{min-width:240px;margin-bottom:0}
.maintenance-actions{display:flex;gap:8px;flex-wrap:wrap}
.maintenance-grid{display:grid;grid-template-columns:minmax(380px,.95fr) minmax(0,1.35fr);gap:20px;align-items:start}
.recipe-machines-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm)}
.recipe-machines-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.recipe-machines-head>div{display:flex;flex-direction:column;gap:3px}
.recipe-machines-head b{font-size:16px;font-weight:700;color:var(--ink)}
.recipe-machines-head small{font-size:13px;color:var(--muted)}
.recipe-machine-scroll{max-height:540px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.recipe-machine-table{min-width:460px}
.recipe-machine-table tbody tr.selected{background:var(--orange-soft)}
.recipe-machine-table tbody tr.selected td{color:var(--ink);font-weight:600}
.recipe-machine-order{width:54px;font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}
.recipe-machine-name{font-size:14px;font-weight:600;color:var(--ink)}
.recipe-machine-count{width:72px;font-weight:700;color:var(--orange);font-variant-numeric:tabular-nums}
.recipe-period-tags{font-size:12px;color:var(--muted)}
.recipe-machine-status{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.recipe-machine-status.ready{background:var(--green-soft);color:var(--green)}
.recipe-machine-status.missing{background:var(--red-soft);color:var(--red)}
.recipe-machines-empty{padding:24px;text-align:center;color:var(--muted);background:var(--surface-alt);border:1px dashed #cbd5e1;border-radius:9px;font-size:13.5px}
.ready-summary{text-align:right;flex-shrink:0}
.ready-summary b{display:block;font-size:26px;font-weight:800;color:var(--ink);line-height:1.1}
.ready-summary small{font-size:12.5px;color:var(--muted)}
.recipe-list>div{display:grid;grid-template-columns:36px 1fr 110px 110px 84px;gap:14px;align-items:center;padding:13px 6px;border-top:1px solid var(--line-soft)}
.recipe-list>div:first-child{border-top:0}
.recipe-no{width:30px;height:30px;border-radius:7px;background:var(--surface-alt);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);font-weight:700;font-size:12px;color:var(--muted)}
.recipe-list div>div{display:flex;flex-direction:column;min-width:0}
.recipe-list div>div b{font-size:14px;font-weight:600;color:var(--ink)}
.recipe-list div>div small{font-size:12.5px;color:var(--muted);margin-top:2px}
.recipe-list>.recipe-period-group{display:flex;align-items:center;justify-content:space-between;grid-template-columns:none;margin:14px 0 0;padding:8px 12px;border:1px solid var(--orange-border);border-radius:8px;background:var(--orange-soft);color:var(--orange);font-size:13px;font-weight:700}
.recipe-list>.recipe-period-group:first-child{margin-top:0}
.recipe-list>.recipe-period-group small{color:var(--orange);font-size:12px;font-weight:600}
.recipe-list>.recipe-period-group+div{border-top:0}
.recipe-list p{display:flex;flex-direction:column;gap:2px}
.recipe-list p small{font-size:11.5px;color:var(--muted)}
.recipe-list p b{font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.recipe-edit-row{display:grid;grid-template-columns:1fr 96px 40px;gap:8px;margin-bottom:8px}
.recipe-edit-row select,.recipe-edit-row input{height:42px;border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 10px;font-size:14px;background:var(--surface)}
.recipe-edit-row button,.add-line{border:1px dashed #cbd5e1;background:var(--surface-alt);border-radius:var(--radius-sm);color:var(--muted)}
.add-line{width:100%;padding:11px;color:var(--orange);font-weight:600;font-size:13.5px}
.add-line:hover{border-color:var(--orange);background:var(--orange-soft)}

/* PPE & Analytics */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;justify-content:space-between;box-shadow:var(--shadow-sm)}
.field-inline{display:flex;align-items:center;gap:8px}
.field-inline span{font-size:13px;font-weight:600;color:var(--muted)}
.alert-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.alert-cards article{background:var(--surface);border:1px solid var(--red-border);border-radius:10px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.alert-cards article>span{width:34px;height:34px;border-radius:8px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;flex-shrink:0}
.alert-cards b{font-size:14px;font-weight:700;color:var(--ink)}
.alert-cards p{font-size:12.5px;color:var(--red);margin-top:2px}
.analysis-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:20px;margin-bottom:20px;align-items:stretch}
.bar-list{display:flex;flex-direction:column;gap:4px}
.bar-list button{border:0;background:transparent;width:100%;display:grid;grid-template-columns:28px 1fr;gap:10px;text-align:left;padding:8px 8px;border-radius:8px;transition:background .15s var(--ease)}
.bar-list button:hover{background:var(--surface-alt)}
.bar-list button>em{font-style:normal;font-family:var(--font-mono);font-weight:700;font-size:13px;color:var(--muted2);padding-top:2px}
.bar-list button>div{display:grid;grid-template-columns:1fr auto;position:relative;padding-bottom:11px;gap:6px}
.bar-list span{display:flex;flex-direction:column;min-width:0}
.bar-list b{font-size:14px;font-weight:600;color:var(--ink)}
.bar-list small{font-size:12px;color:var(--muted);margin-top:2px}
.bar-list strong{font-size:13.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.bar-list i{position:absolute;bottom:0;left:0;height:5px;border-radius:3px;background:var(--orange)}
.abc-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.abc{padding:14px;border-radius:10px;border:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;align-items:center;gap:2px 10px;background:var(--surface)}
.abc b,.abc-dot{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13.5px;grid-row:1/3;font-family:var(--font-mono)}
.abc span{font-weight:700;font-size:14px;color:var(--ink)}
.abc small{font-size:12px;color:var(--muted)}
.abc.A{border-color:var(--red-border);background:var(--red-soft)}.abc.A b,.abc-dot.A{background:var(--red)}
.abc.B{border-color:var(--yellow-border);background:var(--yellow-soft)}.abc.B b,.abc-dot.B{background:#d97706}
.abc.C{border-color:var(--green-border);background:var(--green-soft)}.abc.C b,.abc-dot.C{background:var(--green)}
.suggestions{margin-top:20px;padding-top:18px;border-top:1px solid var(--line-soft)}
.suggestions h3{font-size:14.5px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.suggestions button{border:1px solid var(--orange-border);background:var(--orange-soft);border-radius:9px;padding:11px 13px;width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;text-align:left;margin-bottom:8px;transition:background .15s var(--ease)}
.suggestions button:hover{background:#ffedd5}
.suggestions button>span{color:var(--orange)}
.suggestions b{font-size:13.5px;font-weight:700;color:var(--ink)}
.suggestions small{display:block;font-size:12px;color:var(--ink2);margin-top:2px;font-variant-numeric:tabular-nums}
.suggestions em{font-style:normal;font-size:12px;font-weight:700;color:var(--orange);white-space:nowrap}
.machine-dist>div{display:grid;grid-template-columns:1fr 1.2fr 52px;gap:12px;align-items:center;margin:14px 0}
.machine-dist span{display:flex;flex-direction:column}
.machine-dist span b{font-size:14px;color:var(--ink)}
.machine-dist span small{font-size:12px;color:var(--muted)}
.machine-dist div{height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden}
.machine-dist i{display:block;height:100%;background:var(--orange);border-radius:4px}
.machine-dist strong{font-size:13.5px;text-align:right;font-variant-numeric:tabular-nums}
.smart-note{margin-top:16px;padding:14px 16px;background:var(--orange-soft);border:1px solid var(--orange-border);border-radius:9px;color:#9a3412;font-size:13.5px}
.smart-note p{font-size:12.5px;margin-top:4px}

/* Labels & Connection */
.label-hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 32px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:28px;box-shadow:var(--shadow-sm)}
.label-hero>div:first-child{max-width:500px}
.label-hero h2{font-size:28px;font-weight:800;margin:6px 0 8px}
.label-hero p{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.label-preview{width:248px;border:2px solid var(--navy);border-radius:10px;padding:14px;display:grid;grid-template-columns:92px 1fr;gap:4px 10px;align-items:center;background:#fff;flex-shrink:0}
.label-preview svg{width:88px;grid-row:1/3}
.label-preview b{font-size:15px;font-weight:800;color:var(--ink)}
.label-preview small{font-size:12px;color:var(--muted)}
.label-select{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.label-select label{border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:grid;grid-template-columns:18px 46px 1fr auto;gap:10px;align-items:center;cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease)}
.label-select label:hover{border-color:#cbd5e1;background:var(--surface-alt)}
.label-select label:has(input:checked){border-color:var(--orange);background:var(--orange-soft)}
.label-select input{width:16px;height:16px;accent-color:var(--orange);margin:0}
.qr-thumb svg{width:44px;display:block;border-radius:4px}
.label-select div{display:flex;flex-direction:column;min-width:0}
.label-select b{font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label-select small{font-size:12px;color:var(--muted);margin-top:2px}
.label-select em{font-size:12.5px;font-style:normal;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.connection-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:20px;margin-bottom:20px;align-items:stretch}
.mode-cards{display:grid;gap:9px;margin-bottom:16px}
.mode-cards label{border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;transition:border-color .15s var(--ease),background .15s var(--ease)}
.mode-cards label:hover{border-color:#cbd5e1}
.mode-cards label.selected{border-color:var(--orange);background:var(--orange-soft)}
.mode-cards input{accent-color:var(--orange);margin-top:3px}
.mode-cards span{display:flex;flex-direction:column}
.mode-cards b{font-size:14px;font-weight:700;color:var(--ink)}
.mode-cards small{font-size:12.5px;color:var(--muted);margin-top:3px}
.button-row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.download-card{padding:20px;border-radius:10px;background:var(--surface-alt);border:1px solid var(--line)}
.download-card b{font-size:15.5px;font-weight:700;color:var(--ink)}
.download-card p{font-size:13.5px;line-height:1.55;color:var(--muted);margin:8px 0 16px}
.security-list{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.security-list p{font-size:13.5px;color:var(--ink2);display:flex;align-items:flex-start;gap:8px}
.security-list span{color:var(--green);margin-top:2px}
.code-panel pre{max-height:520px;overflow:auto;background:#0b1220;color:#e2e8f0;border:1px solid #1e293b;border-radius:10px;padding:18px;white-space:pre;font-size:12.5px;line-height:1.6}

/* Forms, Details, Modals, Toasts */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>span{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field input,.field select,.field textarea{width:100%;height:42px;border:1px solid #cbd5e1;border-radius:var(--radius-sm);padding:0 12px;outline:0;background:var(--surface);font-size:14.5px;color:var(--ink);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(234,88,12,.14)}
.field small{font-size:12px;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.qty{display:grid;grid-template-columns:42px 1fr 42px}
.qty input{border-radius:0;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.qty button{border:1px solid #cbd5e1;background:var(--surface-alt);font-size:18px;font-weight:600}
.qty button:hover{background:var(--line-soft)}
.qty button:first-child{border-radius:8px 0 0 8px;border-right:0}
.qty button:last-child{border-radius:0 8px 8px 0;border-left:0}
.rule-note{display:flex;gap:10px;padding:12px 14px;border-radius:9px;margin-top:8px;border:1px solid transparent}
.rule-note b{font-size:13px;white-space:nowrap}
.rule-note span{font-size:13px;line-height:1.45}
.rule-note.ok{background:var(--green-soft);border-color:var(--green-border);color:var(--green)}
.rule-note.warn{background:var(--yellow-soft);border-color:var(--yellow-border);color:var(--yellow)}
.item-summary{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.item-summary>div{display:flex;flex-direction:column;min-width:0}

function buildPpe(range='30d'){

}
function buildAnalysis(p={}){
 const days=p.range==='all'?99999:p.range==='30d'?30:p.range==='3m'?90:365,since=Date.now()-days*86400000,map={};

 const rows=Object.values(map).sort((a,b)=>b.total-a.total),grand=rows.reduce((s,x)=>s+x.total,0);let c=0;rows.forEach(x=>{c+=x.total;x.abc=c/grand<=.8?'A':c/grand<=.95?'B':'C';const i=DEMO.stock.find(z=>z.id===x.itemId);x.min=i?.min||0;x.stock=i?.stock||0;x.velocity=x.total/Math.max(1,days/30);x.suggestion=x.velocity>x.min;});return{rows};
}

async function submitCheckout(extra={}){const f=$('#checkoutForm');let p;if(f){if(!f.reportValidity())return;p=Object.fromEntries(new FormData(f));p.qty=Number(p.qty);Object.assign(p,extra);}else if(extra.itemId){p={...extra,qty:Number(extra.qty)};}else return;setBusy(true);try{const r=await api('checkout',p);if(r.approvalRequired)return approvalGate(p,r.message);closeModal();await refreshData();const message=r.depotApproval?(r.message||'Depocu onayına istek gönderildi. Talep No: '+r.id):(r.pending?(r.message||'Talep onay havuzuna gönderildi. Talep No: '+r.id):'Çıkış tamamlandı. Kalan: '+num(r.remaining));toast(message,'ok');if(r.autoLogout)setTimeout(logout,700);}catch(e){toast(e.message,'error');}finally{setBusy(false);}}

const RECIPE_PERIODS=['AYLIK','3 AYLIK','6 AYLIK','YILLIK'];
function isAllRecipePeriods(period){return norm(period)==='TUMU';}
function recipeRows(machine,period){const all=isAllRecipePeriods(period);return(state.data.recipes||[]).filter(x=>(!machine||x.machine===machine)&&(!period||all||norm(x.period)===norm(period))).map(r=>{const i=state.data.stock.find(x=>x.id===r.itemId);return{...r,code:r.code||i?.code,name:r.name||i?.name,unit:r.unit||i?.unit,shelf:r.shelf||i?.shelf,stock:i?.stock??r.stock??0,ready:(i?.stock??r.stock??0)>=r.qty};}).sort((a,b)=>all?RECIPE_PERIODS.indexOf(norm(a.period))-RECIPE_PERIODS.indexOf(norm(b.period)):0);}
function recipeMachineSummaries(){const map=new Map(),stock=state.data.stock||[];(state.data.recipes||[]).forEach(r=>{const machine=String(r.machine||'').trim();if(!machine)return;const key=norm(machine),item=stock.find(x=>x.id===r.itemId),available=item?.stock??r.stock??0,ready=typeof r.ready==='boolean'?r.ready:available>=Number(r.qty||0);if(!map.has(key))map.set(key,{machine,count:0,missing:0,periods:new Set()});const row=map.get(key);row.count++;if(!ready)row.missing++;const period=norm(r.period);if(RECIPE_PERIODS.includes(period))row.periods.add(period);});return[...map.values()].map(x=>({...x,periods:RECIPE_PERIODS.filter(p=>x.periods.has(p))})).sort((a,b)=>a.machine.localeCompare(b.machine,'tr'));}
function recipeMachineTable(selectedMachine,summaries=recipeMachineSummaries()){if(!summaries.length)return'<div class="recipe-machines-empty">Henüz reçete tanımlanmış makine yok.</div>';return`<div class="recipe-machine-scroll"><table class="data-table recipe-machine-table"><thead><tr><th>#</th><th>Makine</th><th class="num-col">Kalem</th><th>Periyotlar</th><th>Durum</th></tr></thead><tbody>${summaries.map((x,i)=>`<tr class="recipe-machine-row ${norm(x.machine)===norm(selectedMachine)?'selected':''}" data-recipe-machine="${esc(x.machine)}" aria-selected="${norm(x.machine)===norm(selectedMachine)?'true':'false'}" title="${esc(x.machine)}"><td class="recipe-machine-order">${String(i+1).padStart(2,'0')}</td><td class="recipe-machine-name">${esc(x.machine)}</td><td class="recipe-machine-count num-col">${x.count}</td><td><span class="recipe-period-tags">${esc(x.periods.join(' · ')||'—')}</span></td><td><span class="recipe-machine-status ${x.missing?'missing':'ready'}">${x.missing?'Eksik: '+x.missing:'Hazır'}</span></td></tr>`).join('')}</tbody></table></div>`;}
function recipeMachinesPanel(selectedMachine){const summaries=recipeMachineSummaries();return`<section class="recipe-machines-panel"><div class="recipe-machines-head"><div><b>Reçetesi Olan Makineler</b><small>Satıra tıklayarak sağdaki bakım reçetesini açın.</small></div><span class="meta-inline">${summaries.length} makine</span></div>${recipeMachineTable(selectedMachine,summaries)}</section>`;}

function renderMaintenance(){const listed=state.data.lists.machines||[],recipeMachines=recipeMachineSummaries().map(x=>x.machine),machines=[...new Set([...listed,...recipeMachines])],first=machines[0]||'',period='TÜMÜ',rows=recipeRows(first,period);$('#content').innerHTML=`<section class="maintenance-top"><div>${field('Makine',`<select id="recipeMachine">${opts(machines,first)}</select>`)}${field('Periyot',`<select id="recipePeriod">${opts(['TÜMÜ',...RECIPE_PERIODS],period)}</select>`)}</div><div class="maintenance-actions">${state.user.role!=='OP'?`<button class="btn ghost" data-action="recipe-edit">${ic('edit','ic-sm')} Reçeteyi Düzenle</button>`:''}<button class="btn primary" data-action="recipe-bulk">${ic('check','ic-sm')} Seti Toplu Düş</button></div></section><div class="maintenance-grid">${recipeMachinesPanel(first)}<section class="panel" id="recipePanel">${recipeTable(first,period,rows)}</section></div>`;}
function recipeRowHtml(x,i,showPeriod=false){return`<div><span class="recipe-no">${String(i+1).padStart(2,'0')}</span><div><b>${esc(x.name)}</b><small><span class="mono">${esc(x.code)}</span> · Raf ${esc(x.shelf)}${showPeriod?` · ${esc(x.period)}`:''}</small></div><p><small>Gerekli</small><b>${num(x.qty)} ${esc(x.unit)}</b></p><p><small>Stok</small><b>${num(x.stock)} ${esc(x.unit)}</b></p><span class="badge ${x.ready?'success':'danger'}">${x.ready?'Hazır':'Eksik'}</span></div>`;}
function recipeListHtml(rows,period){if(!rows.length)return'<div class="empty">Bu makine ve periyot için tanımlı reçete yok.</div>';if(!isAllRecipePeriods(period))return rows.map((x,i)=>recipeRowHtml(x,i)).join('');let index=0;return RECIPE_PERIODS.map(p=>{const group=rows.filter(x=>norm(x.period)===norm(p));if(!group.length)return'';return`<div class="recipe-period-group"><span>${esc(p)}</span><small>${group.length} kalem</small></div>${group.map(x=>recipeRowHtml(x,index++,true)).join('')}`;}).join('');}

async function renderAnalysis(){if(!state.analysis)state.analysis=await api('movementAnalysis',{range:'year',depot:'Tümü'});const rows=state.analysis.rows||[];$('#content').innerHTML=`<section class="toolbar filters"><div class="field-inline"><span>Dönem</span><select id="anaRange"><option value="30d">Son 30 Gün</option><option value="3m">Son 3 Ay</option><option value="year" selected>Bu Yıl</option><option value="all">Tüm Zamanlar</option></select></div><div class="field-inline"><span>Depo</span><select id="anaDepot"><option>Tümü</option><option value="MEKANIK">Mekanik</option><option value="ISG">İSG</option></select></div><div class="field-inline"><span>Sıralama</span><select id="anaSort"><option value="frequency">İşlem Sıklığı</option><option value="total">Toplam Miktar</option></select></div></section><section class="analysis-grid"><article class="panel"><div class="panel-head"><div><h2>En Çok Hareket Görenler</h2><p>Kronik arıza ve yoğun tüketim göstergesi</p></div></div><div id="analysisBars">${analysisBars(rows,'frequency')}</div></article><article class="panel"><div class="panel-head"><div><h2>ABC Tüketim Sınıfları</h2><p>Kümülatif toplam tüketim payına göre</p></div></div><div class="abc-summary">${['A','B','C'].map(c=>`<div class="abc ${c}"><b>${c}</b><span>${rows.filter(x=>x.abc===c).length} ürün</span><small>${c==='A'?'İlk %80':c==='B'?'Sonraki %15':'Son %5'}</small></div>`).join('')}</div><div class="suggestions"><h3>Akıllı stok önerileri</h3>${rows.filter(x=>x.suggestion).slice(0,4).map(x=>`<button data-analysis-item="${x.itemId}"><span>${ic('trend','ic-sm')}</span><div><b>${esc(x.name)}</b><small>Tüketim hızı ${num(x.velocity)} / ay · Min ${num(x.min)}</small></div><em>Min. Stok Artırılmalı</em></button>`).join('')||'<div class="empty">Mevcut dönem için ek stok önerisi yok.</div>'}</div></article></section><section class="panel"><div class="panel-head"><div><h2>Detaylı tüketim tablosu</h2><p>Makine bazlı dağılımı görmek için herhangi bir satıra tıklay let cameraStream=null,cameraTimer=null;
async function openScanner(){modal('QR Kodunu Okut',`<div class="camera"><video id="cameraVideo" playsinline muted></video><div class="camera-frame"></div></div><p class="camera-help">Kamera izni verin ve kodu çerçeveye hizalayın. Desteklenmiyorsa kodu elle girin.</p>${field('Manuel kod','<input id="scanManual" placeholder="RUL-6205 veya ISG-DOLAP">')}`,`<button class="btn ghost" data-close>Vazgeç</button><button class="btn primary" data-action="scan-manual-go">Devam Et</button>`);try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const v=$('#cameraVideo');v.srcObject=cameraStream;await v.play();if('BarcodeDetector'in window){const det=new BarcodeDetector({formats:['qr_code']});cameraTimer=setInterval(async()=>{try{const codes=await det.detect(v);if(codes[0]?.rawValue){handleQr(codes[0].rawValue);}}catch{}},500);}}catch(e){toast('Kamera açılamadı; kodu elle girebilirsiniz.','error');}}

function handleQr(code){stopCamera();closeModal();code=String(code).trim();if(norm(code)==='ISG-DOLAP')return cabinetModal();const item=state.data.stock.find(x=>norm(x.code)===norm(code)||norm(x.id)===norm(code));if(!item)return toast('QR kodu stok kartıyla eşleşmedi: '+code,'error');checkoutModal(item);}

function qrMatrix(text){const CH='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';text=String(text).toUpperCase().replace(/[^0-9A-Z $%*+\-./:]/g,'-').slice(0,25);let bits='0010'+text.length.toString(2).padStart(9,'0');for(let i=0;i<text.length;i+=2){if(i+1<text.length)bits+=(CH.indexOf(text[i])*45+CH.indexOf(text[i+1])).toString(2).padStart(11,'0');else bits+=CH.indexOf(text[i]).toString(2).padStart(6,'0');}bits+='0'.repeat(Math.min(4,152-bits.length));bits+='0'.repeat((8-bits.length%8)%8);let data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8),2));for(let p=0;data.length<19;p++)data.push(p%2?17:236);const exp=new Array(512),log=new Array(256);let gx=1;for(let i=0;i<255;i++){exp[i]=gx;log[gx]=i;gx<<=1;if(gx&256)gx^=0x11d;}for(let i=255;i<512;i++)exp[i]=exp[i-255];const mul=(a,b)=>a&&b?exp[log[a]+log[b]]:0;let gen=[1];for(let i=0;i<7;i++){let nx=new Array(gen.length+1).fill(0);for(let j=0;j<gen.length;j++){nx[j]^=gen[j];nx[j+1]^=mul(gen[j],exp[i]);}gen=nx;}let rem=new Array(7).fill(0);for(const b of data){const f=b^rem[0];rem.shift();rem.push(0);for(let j=0;j<7;j++)rem[j]^=mul(gen[j+1],f);}let stream='';data.concat(rem).forEach(b=>stream+=b.toString(2).padStart(8,'0'));const n=21,m=Array.from({length:n},()=>Array(n).fill(false)),fun=Array.from({length:n},()=>Array(n).fill(false));const set=(r,c,v)=>{if(r>=0&&r<n&&c>=0&&c<n){m[r][c]=!!v;fun[r][c]=true;}};function finder(r,c){for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const rr=r+dr,cc=c+dc;if(rr<0||rr>=n||cc<0||cc>=n)continue;set(rr,cc,dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)));}}finder(0,0);finder(0,n-7);finder(n-7,0);for(let i=8;i<n-8;i++){set(6,i,i%2===0);set(i,6,i%2===0);}for(let i=0;i<=8;i++)if(i!==6){set(8,i,false);set(i,8,false);}for(let i=0;i<8;i++)set(8,n-1-i,false);for(let i=0;i<7;i++)set(n-1-i,8,false);set(n-8,8,true);let k=0,up=true;for(let right=n-1;right>=1;right-=2){if(right===6)right--;for(let v=0;v<n;v++){const r=up?n-1-v:v;for(let j=0;j<2;j++){const c=right-j;if(fun[r][c])continue;let b=k<stream.length&&stream[k++]==='1';if((r+c)%2===0)b=!b;m[r][c]=b;}}up=!up;}let dat=8,rf=dat;for(let i=0;i<10;i++)rf=(rf<<1)^(((rf>>9)&1)*0x537);const f=((dat<<10)|rf)^0x5412,fb=i=>((f>>i)&1)!==0;for(let i=0;i<=5;i++)m[i][8]=fb(i);m[7][8]=fb(6);m[8][8]=fb(7);m[8][7]=fb(8);for(let i=9;i<15;i++)m[14-i][8]=fb(i);for(let i=0;i<8;i++)m[8][n-1-i]=fb(i);for(let i=8;i<15;i++)m[n-15+i][8]=fb(i);m[n-8][8]=true;return m;}
function qrSvg(text){const m=qrMatrix(text),q=4,n=m.length;let p='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])p+=`M${x+q},${y+q}h1v1h-1z`;return`<svg viewBox="0 0 ${n+q*2} ${n+q*2}" xmlns="http://www.w3.org/2000/svg" aria-label="QR ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#0f172a"/></svg>`;}

 const itemEl=e.target.closest('[data-item]');if(itemEl){const item=state.data.stock.find(x=>x.id===itemEl.dataset.item);if(item)return itemDetail(item);}const co=e.target.closest('[data-checkout]');if(co){const item=state.data.stock.find(x=>x.id===co.dataset.checkout);if(item)return checkoutModal(item);}const ap=e.target.closest('[data-approval]');if(ap){setBusy(true);try{await api('approvalDecide',{id:ap.dataset.id,decision:ap.dataset.approval});await refreshData();toast('Talep '+(ap.dataset.approval==='ONAYLA'?'onaylandı ve stoktan düşüldü.':'reddedildi.'));}catch(x){toast(x.message,'error');}finally{setBusy(false);}return;}const ai=e.target.closest('[data-analysis-item]');if(ai)return analysisDetail(ai.dataset.analysisItem);const q=e.target.closest('[data-qty]');if(q){const i=$('[name=qty]');i.value=Math.max(.01,Number(i.value)+Number(q.dataset.qty));}

async function changeHandler(e){if(e.target.name==='usageOption'){if(e.target.checked&&e.target.value==='Tekli Makine')$('[name="usageOption"][value="Çoklu Makine"]').checked=false;if(e.target.checked&&e.target.value==='Çoklu Makine')$('[name="usageOption"][value="Tekli Makine"]').checked=false;return syncItemForm();}if(e.target.name==='machineOption'){if(selectedRegistrationUsage().includes('Tekli Makine')&&e.target.checked)$$('[name="machineOption"]').forEach(x=>{if(x!==e.target)x.checked=false;});return syncItemForm();}if(e.target.id==='stockStatus'){state.stockFilter.status=e.target.value;return renderStock();}if(e.target.matches('[data-filter-depot]')){state.stockFilter.depot=e.target.dataset.filterDepot;return renderStock();}if(e.target.id==='recipeMachine'||e.target.id==='recipePeriod'){const m=$('#recipeMachine').value,p=$('#recipePeriod').value;syncRecipeMachineSelection(m);$('#recipePanel').innerHTML=recipeTable(m,p,recipeRows(m,p));return;}if(e.target.matches('[data-ppe]')){$$('[data-ppe]').forEach(x=>x.classList.toggle('active',x===e.target));setBusy(true);try{state.ppe=await api('ppeAnalysis',{range:e.target.dataset.ppe});await renderPpe();$$(`[data-ppe="${e.target.dataset.ppe}"]`).forEach(x=>x.classList.add('active'));}catch(x){toast(x.message,'error');}finally{setBusy(false);}return;}if(['anaRange','anaDepot'].includes(e.target.id)){setBusy(true);try{state.analysis=await api('movementAnalysis',{range:$('#anaRange').value,depot:$('#anaDepot').value});await renderAnalysis();}catch(x){toast(x.message,'error');}finally{setBusy(false);}return;}if(e.target.id==='anaSort')$('#analysisBars').innerHTML=analysisBars(state.analysis.rows,e.target.value);}
async function clickStockOp(e){const b=e.target.closest('[data-stock-op]');if(!b)return;setBusy(true);try{await api(b.dataset.stockOp,{itemId:b.dataset.id,[b.dataset.stockOp==='stockIn'?'qty':'actual']:Number($('#stockValue').value)});closeModal();await refreshData();toast('Stok işlemi kaydedildi.');}catch(x){toast(x.message,'error');}finally{setBusy(false);}}
function keepInputFocus(id,fn){const el=$('#'+id),pos=el?.selectionStart;fn();const next=$('#'+id);if(next){next.focus();if(typeof pos==='number')next.setSelectionRange(pos,pos);}}
function inputHandler(e){if(e.target.id==='itemInitial'||e.target.id==='itemUnitPrice')updateRegistrationTotal();if(e.target.id==='itemMachineSearch')filterRegistrationMachines(e.target.value);if(e.target.id==='stockSearch'){state.stockFilter.query=e.target.value;clearTimeout(inputHandler.t);inputHandler.t=setTimeout(()=>keepInputFocus('stockSearch',renderStock),160);}if(e.target.id==='movSearch'){state.movQuery=e.target.value;clearTimeout(inputHandler.mt);inputHandler.mt=setTimeout(()=>keepInputFocus('movSearch',renderMovements),160);}}

document.addEventListener('click',e=>{actionHandler(e);clickStockOp(e);const d=e.target.closest('[data-filter-depot],[data-ppe]');if(d)changeHandler({target:d});if(e.target.closest('[data-action="toggle-pin"]')){const i=$('[name=pin]');i.type=i.type==='password'?'text':'password';}});
document.addEventListener('change',changeHandler);document.addEventListener('input',inputHandler);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modalRoot')?.hidden)closeModal();});
renderLogin();
})();</script>
