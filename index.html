<script type="text/plain" id="gasCode">/*
 * MEKANİK + İSG DEPO V8.7 — Google Apps Script backend
 * V8.7-ONAY2:
 *   - ONAY_HAVUZU gerçek sütun eşleştirmesi (TALEP NO | TARİH | OPERATÖR | ID | MALZEME | MAKİNE | ADET | DURUM | ONAYLAYAN | ONAY TARİHİ) — yeni sütun açılmaz.
 *   - İSG Depo Sorumlusu (ISG_ADMIN) kendi deposundaki onay taleplerini görebilir ve onaylayıp/reddedebilir.
 *   - Bağımsız Depo QR Terminali desteği (anında Depocu PIN onayı, onay havuzu ve onaysız parçada direkt düşüm).
 * V8.7: DEPO ONAYI GEREKLİ akışı.
 * V8.6: PLANLI_BAKIM_RECETE başlıkları (MAKİNE | PERİYOT | MALZEME ID | PARÇA KODU | MALZEME | STANDART ADET).
 * V8.5: Hareketler tarih düzeltmesi.  V8.4: Mevcut sayfalara yeni sütun eklenmez.
 * V8.3/V8.2: Başlık eşleştirme ve formüller.  V8.1: Doğrudan bağlantı varsayılan AÇIK (kapatmak: ALLOW_DIRECT=false).
 * Dağıtım: Dağıt → Dağıtımları yönet → Düzenle (kalem) → Sürüm: Yeni sürüm → Dağıt
 */

const CFG = Object.freeze({
  sheets: {
    data: 'VERİ', stock: 'STOK_KARTLARI', incoming: 'GIRIS_HAREKETLERI',
    outgoing: 'CIKIS_HAREKETLERI', approvals: 'ONAY_HAVUZU',
    recipes: 'PLANLI_BAKIM_RECETE', ppeForms: 'KKD_ZIMMET', orders: 'SIPARIS_TALEPLERI', log: 'LOG', faults: 'Açık Arizalar'
  },
  spreadsheetId: '1AtCrVmav8bIQno5aeP-sFtS3L90KwdipMpZtFeP1KT4',
  apiVersion: 'V8.8.3-MAIL',
  sessionHours: 8,
  roles: ['OP', 'MEK_ADMIN', 'ISG_ADMIN', 'YONETICI'],
  periods: ['AYLIK', '3 AYLIK', '6 AYLIK', 'YILLIK']
});

const KKD_LEGAL_TEXT = '6331 sayılı İş Sağlığı ve Güvenliği Kanunu ve Kişisel Koruyucu Donanımların İşyerlerinde Kullanılması Hakkında Yönetmelik uyarınca yukarıda belirtilen KKD’leri eksiksiz, sağlam ve kullanıma hazır teslim aldığımı; çalışma süresince talimatlara uygun şekilde kullanacağımı, bakımını yapacağımı ve hasar/eskime durumunda derhal bildirip yenisini talep edeceğimi beyan ve taahhüt ederim.';

/* Yalnızca sayfa HİÇ yoksa oluştururken kullanılır. Mevcut sayfaya sütun eklenmez. */
const HEADERS = Object.freeze({
  stock: ['ID','MALZEME TİPİ','PARÇA KODU','MALZEME ADI','MALZEME TÜRÜ','FİRMA','BİRİM','MALZEME DEPO ŞEKLİ','RAF','MAKİNE','MİN STOK','GİREN','ÇIKAN','ANLIK STOK','DURUM','AKTİF/PASİF','OLUŞTURAN','TARİH','BİRİM FİYAT','TOPLAM FİYAT'],
  incoming: ['KAYIT NO','TARİH','ID','PARÇA KODU','MALZEME','ADET','BİRİM','YAPAN','İŞLEM TÜRÜ','ÖNCEKİ STOK','YENİ STOK','NOT','BİRİM FİYAT','TOPLAM FİYAT'],
  outgoing: ['KAYIT NO','TARİH','ID','PARÇA KODU','MALZEME','OPERATÖR','MAKİNE','ADET','BİRİM','ÇIKIŞ TÜRÜ','ONAY','ONAYLAYAN','TALEP NO'],
  approvals: ['TALEP NO','TARİH','OPERATÖR','ID','MALZEME','MAKİNE','ADET','DURUM','ONAYLAYAN','ONAY TARİHİ'],
  recipes: ['MAKİNE','PERİYOT','MALZEME ID','PARÇA KODU','MALZEME','STANDART ADET'],
  ppeForms: ['FORM NO','TARİH','OPERATÖR','TESLİM EDEN','STOK ID','PARÇA KODU','MALZEME','ADET','BİRİM','DURUM','ONAY METNİ','İMZA','İMZA TARİHİ','ÇIKIŞ ID','NOT'],
  orders: ['FORM NO','DOKÜMAN KODU','TALEP TARİHİ','TALEP EDEN','ROL','BÖLÜM','MALİYET MERKEZİ','EKLİ DOKÜMAN','KALEMLER_JSON','TOPLAM TUTAR','PARA BİRİMİ','ÖDEME ŞEKLİ','ÖDEME VADESİ','NAKLİYE','TESLİMAT YERİ','DETAYLAR','ONAYLAR_JSON','DURUM','KAYNAK','STOK İŞLENDİ','OLUŞTURMA TARİHİ'],
  log: ['TARİH','KULLANICI','ROL','İŞLEM','KAYNAK ID','DETAY']
});

/* ===================== GİRİŞ NOKTALARI ===================== */
function doGet(e) {
  const action = String((e && e.parameter && e.parameter.action) || 'health');
  if (action !== 'health') return json_({ok:false, error:'GET yalnız sağlık kontrolü içindir.'});
  return json_({ok:true, data:{service:'MEKANIK_ISG_DEPO_V8.7', apiVersion:CFG.apiVersion, time:new Date().toISOString()}});
}
function doPost(e) {
  try {
    const body = JSON.parse((e && e.postData && e.postData.contents) || '{}');
    verifyTransport_(body);
    return json_({ok:true, data:route_(body.action, body.payload || {}, body.session || '')});
  } catch (err) {
    return json_({ok:false, error:String((err && err.message) || err)});
  }
}
function route_(action, p, token) {
  if (action === 'health') return {service:'MEKANIK_ISG_DEPO_V8.7', apiVersion:CFG.apiVersion, time:new Date().toISOString()};
  if (action === 'auth') return authenticate_(p.pin);
  if (action === 'onayHavuzu') action = p.operation === 'create' ? 'approvalCreate' : p.operation === 'decide' ? 'approvalDecide' : 'approvalList';
  if (action === 'planliBakimRecete') action = p.operation === 'save' ? 'recipeSave' : p.operation === 'bulkCheckout' ? 'recipeBulkCheckout' : 'recipeList';
  if (action === 'kkdAnaliz') action = 'ppeAnalysis';
  if (action === 'kkdZimmetListe') action = 'ppeFormList';
  if (action === 'kkdZimmetOlustur') action = 'ppeFormCreate';
  if (action === 'kkdZimmetImzala') action = 'ppeFormSign';
  if (action === 'hareketAnaliz') action = 'movementAnalysis';
  if (action === 'maliyetAnaliz') action = 'costAnalysis';
  const user = verifySession_(token);
  const read = {
    bootstrap: () => bootstrap_(user), stockList: () => filteredStock_(user),
    approvalList: () => approvalList_(user), recipeList: () => recipeList_(user, p),
    ppeFormList: () => ppeFormList_(user), purchaseOrderList: () => purchaseOrderList_(user),
    ppeAnalysis: () => ppeAnalysis_(user, p), movementAnalysis: () => movementAnalysis_(user, p),
    costAnalysis: () => costAnalysis_(user, p)
  };
  if (read[action]) return read[action]();
  const write = {
    checkout: () => checkout_(user, p), stockIn: () => stockIn_(user, p), stockCount: () => stockCount_(user, p),
    itemCreate: () => itemCreate_(user, p), itemUpdate: () => itemUpdate_(user, p),
    approvalCreate: () => approvalCreate_(user, p), approvalDecide: () => approvalDecide_(user, p),
    recipeSave: () => recipeSave_(user, p), recipeBulkCheckout: () => recipeBulkCheckout_(user, p),
    ppeFormCreate: () => ppeFormCreate_(user, p), ppeFormSign: () => ppeFormSign_(user, p),
    purchaseOrderCreate: () => purchaseOrderCreate_(user, p),
    purchaseOrderUpdate: () => purchaseOrderUpdate_(user, p),
    purchaseOrderStatus: () => purchaseOrderStatus_(user, p),
    purchaseOrderEmail: () => purchaseOrderEmail_(user, p)
  };
  if (!write[action]) throw new Error('Bilinmeyen işlem: ' + action);
  const lock = LockService.getScriptLock(); lock.waitLock(20000);
  try { return write[action](); } finally { lock.releaseLock(); }
}
/* Doğrudan erişim varsayılan AÇIK. Sadece ALLOW_DIRECT=false ise kapanır. */
function verifyTransport_(body) {
  const props = PropertiesService.getScriptProperties();
  const expected = String(props.getProperty('PROXY_TOKEN') || '').trim();
  const directProp = String(props.getProperty('ALLOW_DIRECT') || '').trim().toLowerCase();
  if (expected && body && body._proxyToken === expected) return;
  if (directProp !== 'false') return;
  throw new Error('Doğrudan erişim kapalı (ALLOW_DIRECT=false).');
}

/* ===================== E-TABLO YARDIMCILARI ===================== */
function depotBook_() {
  const id = String(PropertiesService.getScriptProperties().getProperty('DEPOT_SPREADSHEET_ID') || CFG.spreadsheetId).trim();
  return id ? SpreadsheetApp.openById(id) : SpreadsheetApp.getActive();
}
function faultBook_() {
  const id = PropertiesService.getScriptProperties().getProperty('FAULT_SPREADSHEET_ID');
  return id ? SpreadsheetApp.openById(id) : null;
}
function sh_(name) {
  const s = depotBook_().getSheetByName(name);
  if (!s) throw new Error(name + ' sayfası bulunamadı.');
  return s;
}
function ensureHeaders_(name, headers) {
  const ss = depotBook_(); let s = ss.getSheetByName(name);
  if (!s) s = ss.insertSheet(name);
  if (!s.getLastRow() || !s.getLastColumn()) s.getRange(1,1,1,headers.length).setValues([headers]).setFontWeight('bold').setBackground('#1f3a5f').setFontColor('#fff');
  return s;
}
function values_(name) {
  const s = sh_(name), lastRow = s.getLastRow(), lastCol = s.getLastColumn();
  return lastRow && lastCol ? s.getRange(1,1,lastRow,lastCol).getDisplayValues() : [];
}
function objects_(name) {
  const v = values_(name); if (v.length < 2) return [];
  const h = v[0].map(norm_), out = [];
  v.slice(1).forEach((r,i) => {
    if (!r.some(Boolean)) return;
    const o = {_row:i + 2};
    h.forEach((k,j) => { if (k && o[k] === undefined) o[k] = r[j]; });
    out.push(o);
  });
  return out;
}
function setValuesSafe_(range, values) {
  try {
    range.setValues(values);
  } catch (err) {
    if (!/doğrulama|dogrulama|validation/i.test(String((err && err.message) || err))) throw err;
    try {
      const dvs = range.getDataValidations().map(r => r.map(dv => dv ? dv.copy().setAllowInvalid(true).build() : null));
      range.setDataValidations(dvs);
      range.setValues(values);
    } catch (err2) {
      range.clearDataValidations();
      range.setValues(values);
    }
  }
}
function setValueSafe_(cell, value) {
  try {
    cell.setValue(value);
  } catch (err) {
    if (!/doğrulama|dogrulama|validation/i.test(String((err && err.message) || err))) throw err;
    try {
      const dv = cell.getDataValidation();
      if (dv) cell.setDataValidation(dv.copy().setAllowInvalid(true).build());
      else cell.clearDataValidations();
      cell.setValue(value);
    } catch (err2) {
      cell.clearDataValidations();
      cell.setValue(value);
    }
  }
}
function append_(name, headers, obj) {
  const s = ensureHeaders_(name, headers);
  const h = s.getRange(1,1,1,s.getLastColumn()).getDisplayValues()[0];
  const row = h.map(x => obj[norm_(x)] === undefined ? '' : obj[norm_(x)]);
  const r = firstEmptyRow_(s);
  setValuesSafe_(s.getRange(r, 1, 1, row.length), [row]);
  return r;
}
function firstEmptyRow_(s) {
  const last = Math.max(s.getLastRow(), 1);
  if (last < 2) return 2;
  const v = s.getRange(2, 1, last - 1, Math.min(s.getLastColumn(), 10)).getDisplayValues();
  for (let i = v.length - 1; i >= 0; i--) { if (v[i].some(Boolean)) return i + 3; }
  return 2;
}
function nextNo_(name) {
  const c = headerCol_(name, ['KAYIT NO']); if (!c) return '';
  const s = sh_(name); if (s.getLastRow() < 2) return 1;
  const max = s.getRange(2, c, s.getLastRow() - 1, 1).getValues().reduce((m, r) => Math.max(m, Number(r[0]) || 0), 0);
  return max + 1;
}
function norm_(s) {
  return String(s == null ? '' : s).trim()
    .replace(/i/g,'İ').replace(/ı/g,'I')
    .toUpperCase()
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/İ/g,'I').replace(/Ş/g,'S').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/Ç/g,'C')
    .replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'');
}
function n_(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let s = String(v == null ? 0 : v).replace(/[₺€$£\s]|TL/gi, '').trim();
  if (!s) return 0;
  if (s.indexOf(',') >= 0 && s.indexOf('.') >= 0) {
    s = s.lastIndexOf(',') > s.lastIndexOf('.') ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  } else if (s.indexOf(',') >= 0) {
    s = s.replace(',', '.');
  } else if (/^-?\d{1,3}(\.\d{3})+$/.test(s)) {
    s = s.replace(/\./g, '');
  }
  const x = Number(s);
  return isFinite(x) ? x : 0;
}
function s_(v) { return v == null ? '' : String(v); }
function uid_(prefix) { return prefix + '-' + Utilities.getUuid().slice(0,8).toUpperCase(); }
function now_() { return Utilities.formatDate(new Date(), Session.getScriptTimeZone() || 'Europe/Istanbul', 'yyyy-MM-dd HH:mm:ss'); }
function json_(obj) { return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON); }
function colLetter_(n) { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }
function headerCol_(sheetName, names) {
  const s = depotBook_().getSheetByName(sheetName); if (!s || !s.getLastColumn()) return 0;
  const h = s.getRange(1,1,1,s.getLastColumn()).getDisplayValues()[0].map(norm_);
  for (const n of names) { const i = h.indexOf(norm_(n)); if (i >= 0) return i + 1; }
  return 0;
}

/* ===================== TARİH ===================== */
function parseDate_(v) {
  if (v instanceof Date) return isNaN(v) ? new Date(0) : v;
  const t = String(v || '').trim(); if (!t) return new Date(0);
  let m = t.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
  const d = new Date(t); return isNaN(d) ? new Date(0) : d;
}
function iso_(v) {
  const d = parseDate_(v); if (!d.getTime()) return '';
  return Utilities.formatDate(d, Session.getScriptTimeZone() || 'Europe/Istanbul', "yyyy-MM-dd'T'HH:mm:ss");
}

/* ===================== KULLANICI / OTURUM ===================== */
function role_(v) {
  const x = norm_(v);
  if (x === 'OP' || x.indexOf('OPERAT') >= 0 || x.indexOf('OPARAT') >= 0) return 'OP';
  if (x === 'MEK_ADMIN' || x.indexOf('MEKANIK') >= 0) return 'MEK_ADMIN';
  if (x === 'ISG_ADMIN' || x.indexOf('ISG') >= 0) return 'ISG_ADMIN';
  if (x === 'YONETICI' || x === 'ADMIN' || x.indexOf('YONETIC') >= 0 || x.indexOf('SEF') >= 0) return 'YONETICI';
  return '';
}
function users_() {
  const v = values_(CFG.sheets.data); if (v.length < 2) return [];
  const h = v[0].map(norm_);
  const ix = (...names) => { for (const name of names) { const i = h.indexOf(norm_(name)); if (i >= 0) return i; } return -1; };
  let nameI = ix('BAKIM OPERATÖR','BAKIM OPARATÖR','PERSONEL','AD SOYAD');
  let pinI = ix('ŞİFRE','SIFRE','PIN');
  let roleI = ix('YETKİ','YETKI','ROL');
  const activeI = ix('AKTİF/PASİF','DURUM');
  if (nameI < 0) nameI = 9; if (pinI < 0) pinI = nameI + 1; if (roleI < 0) roleI = nameI + 2;
  return v.slice(1).map((r,i) => ({
    row:i + 2, name:String(r[nameI] || '').trim(), pin:String(r[pinI] || '').replace(/\s+/g,'').trim(), role:role_(r[roleI]),
    active:activeI < 0 ? true : !/(PASIF|HAYIR)/.test(norm_(r[activeI]))
  })).filter(x => x.name && x.pin && x.role && x.active);
}
function authenticate_(pin) {
  pin = String(pin || '').replace(/\s+/g,'').trim();
  if (!/^\d{4,8}$/.test(pin)) throw new Error('PIN 4-8 rakam olmalıdır.');
  const u = users_().find(x => constantTime_(x.pin, pin));
  if (!u) throw new Error('PIN geçersiz veya kullanıcı pasif.');
  const safe = {name:u.name, role:u.role};
  log_(safe, 'OTURUM_ACILDI', '', {});
  return {user:safe, session:signSession_(safe)};
}
function sessionSecret_() {
  const props = PropertiesService.getScriptProperties();
  let secret = props.getProperty('SESSION_SECRET');
  if (!secret) { secret = Utilities.getUuid() + Utilities.getUuid(); props.setProperty('SESSION_SECRET', secret); }
  return secret;
}
function signSession_(u) {
  const data = Utilities.base64EncodeWebSafe(Utilities.newBlob(JSON.stringify({name:u.name, role:u.role, exp:Date.now() + CFG.sessionHours*3600000})).getBytes());
  return data + '.' + Utilities.base64EncodeWebSafe(Utilities.computeHmacSha256Signature(data, sessionSecret_()));
}
function verifySession_(token) {
  const parts = String(token || '').split('.');
  if (parts.length !== 2) throw new Error('Oturum gerekli.');
  const sig = Utilities.base64EncodeWebSafe(Utilities.computeHmacSha256Signature(parts[0], sessionSecret_()));
  if (!constantTime_(sig, parts[1])) throw new Error('Oturum imzası geçersiz.');
  const p = JSON.parse(Utilities.newBlob(Utilities.base64DecodeWebSafe(parts[0])).getDataAsString());
  if (!p.exp || Date.now() > p.exp || CFG.roles.indexOf(p.role) < 0) throw new Error('Oturum süresi doldu.');
  return {name:p.name, role:p.role};
}
function constantTime_(a, b) {
  a = String(a); b = String(b); let d = a.length ^ b.length;
  for (let i = 0; i < Math.max(a.length, b.length); i++) d |= (a.charCodeAt(i) || 0) ^ (b.charCodeAt(i) || 0);
  return d === 0;
}
function requireRole_(u, roles) { if (roles.indexOf(u.role) < 0) throw new Error('Bu işlem için yetkiniz yok.'); }
function canDepot_(u, depot) {
  if (u.role === 'YONETICI' || u.role === 'OP') return true;
  if (u.role === 'MEK_ADMIN') return depot === 'MEKANIK';
  if (u.role === 'ISG_ADMIN') return depot === 'ISG';
  return false;
}
function isDepotApproverRole_(role, depot) {
  return role === 'YONETICI' || (depot === 'ISG' ? role === 'ISG_ADMIN' : role === 'MEK_ADMIN');
}
function managerByPin_(pin) {
  const clean = String(pin || '').replace(/\s+/g,'').trim();
  const u = users_().find(x => constantTime_(x.pin, clean) && x.role === 'YONETICI');
  return u ? {name:u.name, role:u.role} : null;
}
function depotApproverByPin_(pin, depot) {
  const clean = String(pin || '').replace(/\s+/g,'').trim();
  const u = users_().find(x => constantTime_(x.pin, clean) && isDepotApproverRole_(x.role, depot));
  return u ? {name:u.name, role:u.role} : null;
}

/* ===================== STOK ===================== */
function incomingPriceMap_() {
  const byId = {}, byCode = {}, byName = {};
  if (!depotBook_().getSheetByName(CFG.sheets.incoming)) return {byId:byId, byCode:byCode, byName:byName};
  objects_(CFG.sheets.incoming).forEach(o => {
    let price = n_(o.BIRIM_FIYAT || o.BIRIM_FIYATI || o.FIYAT);
    if (!(price > 0)) {
      const tot = n_(o.TOPLAM_FIYAT), qty = n_(o.ADET || o.MIKTAR || o.GIRIS_AD);
      if (tot > 0 && qty > 0) price = tot / qty;
    }
    if (!(price > 0)) return;
    const sid = s_(o.STOK_ID).trim(), code = norm_(o.PARCA_KODU), name = norm_(o.MALZEME || o.MALZEME_ADI);
    if (sid) byId[sid] = price;
    if (code) byCode[code] = price;
    if (name) byName[name] = price;
  });
  return {byId:byId, byCode:byCode, byName:byName};
}
function stock_(prices) {
  const pm = prices || incomingPriceMap_();
  return objects_(CFG.sheets.stock).map(o => {
    const stock = n_(o.ANLIK_STOK);
    const rawPrice = n_(o.BIRIM_FIYAT || o.BIRIM_FIYATI || o.FIYAT);
    const unitPrice = rawPrice > 0 ? rawPrice : (pm.byId[s_(o.ID).trim()] || pm.byCode[norm_(o.PARCA_KODU)] || pm.byName[norm_(o.MALZEME_ADI)] || 0);
    const totalPrice = n_(o.TOPLAM_FIYAT) || (unitPrice > 0 ? stock * unitPrice : 0);
    return {
      id:o.ID,
      depot:/ISG/.test(o.DEPO ? norm_(o.DEPO) : norm_(o.MALZEME_TIPI) + '_' + norm_(o.MALZEME_DEPO_SEKLI)) ? 'ISG' : 'MEKANIK',
      type:o.MALZEME_TIPI || '', code:o.PARCA_KODU || '', name:o.MALZEME_ADI || '',
      category:o.MALZEME_TURU || o.KATEGORI || '', company:o.FIRMA || '', unit:o.BIRIM || 'AD',
      usage:o.MALZEME_DEPO_SEKLI || '', shelf:o.RAF || o.RAF_NO || '', machine:o.MAKINE || o.MAKINE_PARCAY || '',
      min:n_(o.MIN_STOK), unitPrice:unitPrice, totalPrice:totalPrice,
      incoming:n_(o.GIREN), outgoing:n_(o.CIKAN), stock:stock,
      active:!/(PASIF|HAYIR)/.test(norm_(o.AKTIF_PASIF)), row:o._row
    };
  }).map(x => Object.assign(x, {depotApproval:needsDepotApproval_(x)})).filter(x => x.id && x.active);
}
/* V8.7: MALZEME DEPO ŞEKLİ içinde "Depo Onayı Gerekli" varsa true. */
function needsDepotApproval_(item) { return /DEPO_ONAYI/.test(norm_(item && item.usage)); }
function filteredStock_(u) { return stock_().filter(x => canDepot_(u, x.depot)); }
function item_(id) {
  const x = stock_().find(i => i.id === id || norm_(i.code) === norm_(id));
  if (!x) throw new Error('Stok kartı bulunamadı: ' + id);
  return x;
}
function outs_() {
  const pm = incomingPriceMap_(), st = stock_(pm);
  return objects_(CFG.sheets.outgoing).map(o => {
    const code = s_(o.PARCA_KODU), item = st.find(i => norm_(i.code) === norm_(code) || (o.STOK_ID && i.id === o.STOK_ID));
    const name = s_(o.MALZEME || o.MALZEME_ADI || (item && item.name));
    const unitPrice = n_(o.BIRIM_FIYAT || o.BIRIM_FIYATI || o.FIYAT)
      || (item ? item.unitPrice : 0)
      || pm.byId[s_(o.STOK_ID).trim()]
      || pm.byCode[norm_(code)]
      || pm.byName[norm_(name)]
      || 0;
    return {
      id:s_(o.ID), no:s_(o.KAYIT_NO), date:iso_(o.TARIH || o.KULLANIM_TARIHI),
      person:s_(o.OPERATOR || o.CIKIS_YAPAN), itemId:item ? item.id : s_(o.STOK_ID), code:code,
      name:name, qty:n_(o.ADET || o.CIKIS_AD || o.MIKTAR),
      unit:s_(o.BIRIM || (item && item.unit)), unitPrice:unitPrice,
      machine:s_(o.MAKINE || o.KULLANILACAK_MAKINE_BOLUM),
      source:s_(o.CIKIS_TURU || o.KAYNAK || 'QR'),
      depot:o.DEPO ? (norm_(o.DEPO) === 'ISG' ? 'ISG' : 'MEKANIK') : (item ? item.depot : 'MEKANIK')
    };
  }).filter(x => x.code || x.name);
}
function bootstrap_(u) {
  return {
    user:u, stock:filteredStock_(u), approvals:u.role === 'OP' ? [] : approvalList_(u), recipes:recipeList_(u, {}),
    ppeForms:ppeFormList_(u), orders:purchaseOrderList_(u),
    movements:recentMovements_(u), lists:dataLists_(), serverTime:now_(), apiVersion:CFG.apiVersion, capabilities:capabilities_(u)
  };
}
function recentMovements_(u) {
  if (u.role === 'OP') return [];
  return outs_().filter(x => canDepot_(u, x.depot))
    .sort((a,b) => parseDate_(b.date) - parseDate_(a.date)).slice(0, 200);
}
function capabilities_(u) {
  return {
    mechanical:['MEK_ADMIN','YONETICI'].indexOf(u.role) >= 0, isg:['ISG_ADMIN','YONETICI'].indexOf(u.role) >= 0,
    operator:u.role === 'OP', full:u.role === 'YONETICI'
  };
}
function dataLists_() {
  const v = values_(CFG.sheets.data); if (!v.length) return {};
  const clean = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  let hdrRow = 0;
  for (let r = 0; r < Math.min(5, v.length); r++) {
    const rowNorm = v[r].map(norm_);
    if (rowNorm.some(x => x === 'MAKINE_ADI' || x === 'MAKINE' || x.indexOf('MALIYET') >= 0)) { hdrRow = r; break; }
  }
  const h = (v[hdrRow] || []).map(norm_);
  const body = v.slice(hdrRow + 1);
  const colIdx = (...names) => {
    for (const n of names) { const i = h.indexOf(norm_(n)); if (i >= 0) return i; }
    return -1;
  };
  const get = (...names) => {
    const i = colIdx(...names);
    return i < 0 ? [] : [...new Set(body.map(r => clean(r[i])).filter(Boolean))];
  };
  let macCol = colIdx('MAKİNE ADI','MAKİNE','MAKINE ADI','MAKINE');
  if (macCol < 0) macCol = h.findIndex(x => x.indexOf('MAKINE') >= 0);
  if (macCol < 0 && body.some(r => clean(r[8]))) macCol = 8;
  let mcCol = colIdx('MALİYET MERKEZLERİ','MALIYET MERKEZLERI','MALİYET MERKEZİ','MALIYET MERKEZI','COST CENTER');
  if (mcCol < 0) mcCol = h.findIndex(x => x.indexOf('MALIYET') >= 0);
  if (mcCol < 0 && ((v[hdrRow] && v[hdrRow].length > 12) || body.some(r => clean(r[12])))) mcCol = 12;
  const costCenters = mcCol < 0 ? [] : [...new Set(body.map(r => clean(r[mcCol])).filter(Boolean))];
  const machineCostCenters = {};
  if (macCol >= 0 && mcCol >= 0) {
    body.forEach(r => {
      const m = clean(r[macCol]), c = clean(r[mcCol]);
      if (m && c && !machineCostCenters[m]) machineCostCenters[m] = c;
    });
  }
  return {
    types:get('MALZEME TÜR','MALZEME TÜRÜ','KATEGORİ'), companies:get('FİRMA BİLGİLERİ','FİRMA'), units:get('BİRİM'),
    usage:get('MALZEME DEPO ŞEKLİ'), shelves:get('RAFNO','RAF NO'), machines:macCol >= 0 ? [...new Set(body.map(r => clean(r[macCol])).filter(Boolean))] : [],
    costCenters:costCenters, machineCostCenters:machineCostCenters,
    _meta:{headerRow:hdrRow + 1, macCol:macCol + 1, mcCol:mcCol + 1, headers:(v[hdrRow] || []).slice(0, 16)},
    operators:users_().filter(x => x.role === 'OP').map(x => x.name)
  };
}

/* ===================== ÇIKIŞ ===================== */
function checkout_(u, p) {
  const item = item_(p.itemId || p.code); const qty = n_(p.qty);
  if (qty <= 0) throw new Error('Miktar 0’dan büyük olmalıdır.');
  if (!canDepot_(u, item.depot)) throw new Error('Bu depoya erişim yetkiniz yok.');
  if (item.stock < qty) throw new Error('Yetersiz stok. Mevcut: ' + item.stock + ' ' + item.unit);
  const isIsg = item.depot === 'ISG', isConsumable = !item.machine || /(SARF|ORTAK)/.test(norm_(item.type + ' ' + item.usage));
  const machine = isIsg ? (p.machine || 'PERSONEL KKD') : String(p.machine || item.machine || '').trim();
  if (!isIsg && !machine) throw new Error('Kullanılacak makine/bölüm seçilmelidir.');
  /* V8.7: Depo onayı gereken parça → Depocu PIN ile anında onay veya Onay Havuzu'na */
  if (needsDepotApproval_(item) && !isDepotApproverRole_(u.role, item.depot)) {
    if (p.depotApproverPin) {
      const depocu = depotApproverByPin_(p.depotApproverPin, item.depot);
      if (!depocu) throw new Error('Depocu PIN geçersiz veya bu depo için yetkisiz.');
      const id = writeExit_(u, item, qty, machine, 'DEPO ONAYI', depocu.name, '');
      let ppeFormNo = '';
      if (isIsg && p.ppeAccepted && validSignature_(p.ppeSignature)) {
        ppeFormNo = recordSignedPpeExit_(u, item, qty, id, p.ppeSignature, depocu.name, p.note || 'QR / İSG Dolabı');
      }
      log_(u, 'STOK_CIKIS_DEPO_ONAYLI', id, {item:item.id, qty:qty, machine:machine, approver:depocu.name, ppeFormNo:ppeFormNo});
      return {completed:true, depotApproved:true, approver:depocu.name, id:id, ppeFormNo:ppeFormNo, remaining:item.stock - qty, autoLogout:u.role === 'OP'};
    }
    if (p.promptDepotApproval && !p.sendApproval) {
      return {depotApprovalRequired:true, message:'Bu parça için Depo Onayı Gerekli.'};
    }
    const r = approvalCreate_(u, {itemId:item.id, qty:qty, machine:machine, reason:'Depo Onayı Gerekli', depotApproval:true});
    return {pending:true, depotApproval:true, id:r.id, message:'Depocu onayına istek gönderildi. Talep No: ' + r.id, autoLogout:u.role === 'OP'};
  }
  let approver = '';
  if (!p.qrTerminal && !isIsg && !isConsumable && !hasActiveMaintenance_(machine)) {
    const manager = managerByPin_(p.managerPin);
    if (manager) approver = manager.name;
    else if (p.sendApproval) return approvalCreate_(u, {itemId:item.id, qty:qty, machine:machine, reason:'Açık arıza veya planlı bakım kaydı bulunamadı'});
    else return {approvalRequired:true, message:'Bu makinede açık arıza veya planlı bakım kaydı bulunamadı — Yönetici Onayı Gerekli'};
  }
  const id = writeExit_(u, item, qty, machine, p.source || 'QR', approver, '');
  let ppeFormNo = '';
  if (isIsg && p.ppeAccepted && validSignature_(p.ppeSignature)) {
    ppeFormNo = recordSignedPpeExit_(u, item, qty, id, p.ppeSignature, approver || u.name, p.note || 'QR / İSG Dolabı');
  }
  log_(u, 'STOK_CIKIS', id, {item:item.id, qty:qty, machine:machine, approver:approver, ppeFormNo:ppeFormNo});
  return {completed:true, id:id, ppeFormNo:ppeFormNo, remaining:item.stock - qty, autoLogout:u.role === 'OP'};
}
function hasActiveMaintenance_(machine) {
  let book; try { book = faultBook_(); } catch (e) { return true; }
  if (!book) return true;
  const s = book.getSheetByName(CFG.sheets.faults); if (!s) return true;
  const v = s.getDataRange().getDisplayValues(); if (v.length < 2) return false;
  const h = v[0].map(norm_), mi = findIndex_(h, ['MAKİNE','MAKINE ADI','EKİPMAN']), si = findIndex_(h, ['DURUM','STATÜ','STATUS']);
  return v.slice(1).some(r => norm_(r[mi]) === norm_(machine) && !/(KAPALI|TAMAMLANDI|IPTAL)/.test(norm_(r[si])));
}
function findIndex_(headers, names) { for (const n of names) { const i = headers.indexOf(norm_(n)); if (i >= 0) return i; } return 0; }
function writeExit_(u, item, qty, machine, source, approver, talepNo) {
  const id = uid_('CKS'), t = now_();
  append_(CFG.sheets.outgoing, HEADERS.outgoing, {
    KAYIT_NO:nextNo_(CFG.sheets.outgoing), TARIH:t, ID:id, PARCA_KODU:item.code, MALZEME:item.name,
    OPERATOR:u.name, MAKINE:machine, ADET:qty, BIRIM:item.unit, CIKIS_TURU:source || 'QR',
    ONAY:approver ? 'ONAYLANDI' : 'GEREKMEDİ', ONAYLAYAN:approver || '', TALEP_NO:talepNo || ''
  });

}

/* ===================== ONAY ===================== */
function parseApprovalRow_(o, stock) {

  const itemId = (s_(o.STOK_ID).trim() || (isReqInId ? '' : rawId)).trim();
  const rawCode = s_(o.PARCA_KODU).trim();
  const rawName = s_(o.MALZEME || o.MALZEME_ADI).trim();
  const item = (itemId && stock.find(i => i.id === itemId || norm_(i.code) === norm_(itemId)))
    || (rawCode && stock.find(i => norm_(i.code) === norm_(rawCode)))
    || (rawName && stock.find(i => norm_(i.name) === norm_(rawName))) || null;
  const machine = s_(o.MAKINE || (item && item.machine)).trim();

  const rawStatus = norm_(o.DURUM || o.ONAY_DURUMU || o.STATUS);

    : 'BEKLIYOR';

  const incomplete = !resolvedItemId || qty <= 0;
  const depotApproval = (!!item && needsDepotApproval_(item)) || /DEPO_ONAYI/.test(norm_(o.NEDEN));
  const reason = s_(o.NEDEN).trim() || (incomplete ? 'Eksik sütun kaydı (eski şablon) — Reddet ile kapatılabilir' : (depotApproval ? 'Depo Onayı Gerekli' : 'Onay bekliyor'));
  return {
    _row:o._row,
    id:id,
    date:iso_(o.TARIH || o.TALEP_TARIHI) || s_(o.TARIH || o.TALEP_TARIHI).trim(),
    requester:s_(o.OPERATOR || o.TALEP_EDEN).trim(),
    itemId:resolvedItemId,

    name:rawName || (item ? item.name : (machine ? 'Eksik Kayıt (' + machine + ')' : 'Eksik Talep Kaydı')),
    machine:machine,

    unit:s_(o.BIRIM || (item && item.unit) || 'AD').trim(),

}
function approvalCreate_(u, p) {

  if (item.depot !== 'MEKANIK' && !depotApproval) throw new Error('Onay havuzu yalnız mekanik depo veya Depo Onayı Gerekli parçalar içindir.');
  const qty = n_(p.qty); if (qty <= 0 || qty > item.stock) throw new Error('Talep miktarı geçersiz.');
  const id = uid_('ONAY'), t = now_(), machine = p.machine || item.machine;
  const reason = depotApproval ? 'Depo Onayı Gerekli' : (p.reason || 'Yönetici onayı gerekli');
  const hasTalepNo = headerCol_(CFG.sheets.approvals, ['TALEP NO']) > 0;
  const row = hasTalepNo
    ? {TALEP_NO:id, TARIH:t, OPERATOR:u.name, ID:item.id, STOK_ID:item.id, PARCA_KODU:item.code, MALZEME:item.name, MALZEME_ADI:item.name, MAKINE:machine, ADET:qty, MIKTAR:qty, BIRIM:item.unit, DEPO:item.depot, NEDEN:reason, DURUM:'BEKLIYOR', ONAYLAYAN:'', ONAY_TARIHI:''}
    : {ID:id, TALEP_NO:id, TALEP_TARIHI:t, TARIH:t, TALEP_EDEN:u.name, OPERATOR:u.name, STOK_ID:item.id, PARCA_KODU:item.code, MALZEME_ADI:item.name, MALZEME:item.name, MAKINE:machine, MIKTAR:qty, ADET:qty, BIRIM:item.unit, DEPO:item.depot, NEDEN:reason, DURUM:'BEKLIYOR', KARAR_VEREN:'', KARAR_TARIHI:''};
  append_(CFG.sheets.approvals, HEADERS.approvals, row);
  log_(u, 'ONAY_TALEBI', id, {item:item.id, qty:qty, depot:item.depot, depotApproval:depotApproval});
  return {pending:true, depotApproval:depotApproval, id:id,
    message:depotApproval ? 'Depocu onayına istek gönderildi. Talep No: ' + id : 'Talep onay havuzuna gönderildi. Talep No: ' + id,
    autoLogout:u.role === 'OP'};
}
function approvalList_(u) {
  requireRole_(u, ['MEK_ADMIN','ISG_ADMIN','YONETICI']);
  if (!depotBook_().getSheetByName(CFG.sheets.approvals)) return [];
  const st = stock_();
  return objects_(CFG.sheets.approvals)
    .map(o => parseApprovalRow_(o, st))
    .filter(x => u.role === 'YONETICI' || (u.role === 'MEK_ADMIN' && x.depot === 'MEKANIK') || (u.role === 'ISG_ADMIN' && x.depot === 'ISG'));
}
function approvalDecide_(u, p) {

  ids.forEach(id => { const m = id.match(new RegExp('^' + prefix + '-(\\d+)$')); if (m) max = Math.max(max, Number(m[1])); });

}

  if (c.inKey && c.inQty) set(c.giren, blank + 'SUMIF(' + q(I) + L(c.inKey) + ':' + L(c.inKey) + sep + K + sep + q(I) + L(c.inQty) + ':' + L(c.inQty) + '))');
  if (c.outKey && c.outQty) set(c.cikan, blank + 'SUMIF(' + q(O) + L(c.outKey) + ':' + L(c.outKey) + sep + K + sep + q(O) + L(c.outQty) + ':' + L(c.outQty) + '))');

  append_(CFG.sheets.incoming, HEADERS.incoming, first);

 syncDraining=true;
 let ranAny=false;
 try{
  while(true){
   const next=[...syncQueue].reverse().find(j=>j.status==='queued');
   if(!next)break;
   ranAny=true;
   next.status='saving';next.error='';
   renderSyncIndicator();
   try{
    const res=await next.run();
    next.status='done';next.doneAt=new Date();
    if(next.onSuccess)await next.onSuccess(res);
   }catch(err){
    next.status='error';next.error=err?.message||'Kayıt sırasında hata oluştu.';
    if(next.onError)await next.onError(err);
    toast(`${next.label} kaydedilemedi: ${next.error}`,'error');
   }
   renderSyncIndicator();
  }
 }finally{
  syncDraining=false;
 }
 if(ranAny&&syncQueuePendingCount()===0){
  if(syncQueueErrorCount()===0){
   syncDoneFlash=true;
   renderSyncIndicator();
   clearTimeout(syncDoneTimer);
   syncDoneTimer=setTimeout(()=>{syncDoneFlash=false;renderSyncIndicator();},2600);
  }
  scheduleBgSync(550);
 }
}
function retrySyncJob(id){
 const job=syncQueue.find(j=>j.id===id&&j.status==='error');
 if(!job)return;
 job.status='queued';job.error='';
 renderSyncIndicator();
 drainSyncQueue();
}
function retryAllSyncJobs(){
 let n=0;
 syncQueue.forEach(j=>{if(j.status==='error'){j.status='queued';j.error='';n++;}});
 if(n){renderSyncIndicator();drainSyncQueue();}
}
function dismissSyncJob(id){
 const idx=syncQueue.findIndex(j=>j.id===id&&j.status!=='saving');
 if(idx>=0){syncQueue.splice(idx,1);renderSyncIndicator();}
}
function clearDoneSyncJobs(){
 for(let i=syncQueue.length-1;i>=0;i--)if(syncQueue[i].status==='done')syncQueue.splice(i,1);

}
function renderSyncQueueBody(){
 const box=$('#syncQueueBody');if(!box)return;
 const pending=syncQueuePendingCount(), errors=syncQueueErrorCount();
 const queuedOrdered=[...syncQueue].reverse().filter(j=>j.status==='queued');
 const fmtT=d=>d?new Intl.DateTimeFormat('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(d):'';
 const summary=`<div class="sp-summary" style="margin-top:0;margin-bottom:12px"><span>${pending>0?`<b>${pending}</b> kayıt arka planda sırayla gönderiliyor…`:errors>0?`<b>${errors}</b> kayıt hata nedeniyle bekliyor.`:'Tüm kayıtlar sunucuyla senkronize.'}</span><span>Toplam geçmiş: <b>${syncQueue.length}</b></span></div>`;
 const rowsHtml=syncQueue.length?syncQueue.map(j=>{
  const qPos=j.status==='queued'?queuedOrdered.findIndex(x=>x.id===j.id)+1:0;
  const tag=j.status==='saving'?`<span class="sq-tag saving"><span class="sq-spin" style="width:10px;height:10px;border-width:1.8px"></span> Kaydediliyor</span>`:j.status==='queued'?`<span class="sq-tag queued">Sırada #${qPos}</span>`:j.status==='done'?`<span class="sq-tag done">Kaydedildi ✓</span>`:`<span class="sq-tag error">Hata</span>`;
  const actions=j.status==='error'?`<button type="button" class="btn primary sm" data-sync-retry="${esc(j.id)}">Tekrar Dene</button><button type="button" class="btn ghost sm" data-sync-dismiss="${esc(j.id)}">Kaldır</button>`:'';
  return`<div class="sq-row ${j.status}"><div class="sq-row-info"><b>${esc(j.label)}</b><small>${esc(j.detail)}${j.detail?' · ':''}${fmtT(j.doneAt||j.ts)}</small>${j.error?`<div class="sq-row-err">${esc(j.error)}</div>`:''}</div><div class="sq-row-right">${tag}${actions}</div></div>`;
 }).join(''):'<div class="empty">Henüz kuyrukta veya geçmişte kayıt işlemi yok.</div>';

function initSigPad(canvas){
 if(!canvas)return null;
 const ctx=canvas.getContext('2d'), statusEl=$(`[data-sig-status="${canvas.id}"]`);
 let strokes=[], cur=null, drawing=false;
 const setup=()=>{
  const rect=canvas.getBoundingClientRect(), w=Math.max(260,Math.round(rect.width||360)), h=Math.max(100,Math.round(rect.height||140));
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=w*dpr; canvas.height=h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineWidth=2.3; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0f172a';
  redraw();
 };
 const redraw=()=>{
  const rect=canvas.getBoundingClientRect(), w=rect.width||360, h=rect.height||140;
  ctx.clearRect(0,0,w,h);
  strokes.forEach(st=>{
   if(!st.length)return;
   ctx.beginPath();
   ctx.moveTo(st[0][0]*w,st[0][1]*h);
   for(let i=1;i<st.length;i++)ctx.lineTo(st[i][0]*w,st[i][1]*h);
   if(st.length===1)ctx.lineTo(st[0][0]*w+0.5,st[0][1]*h+0.5);
   ctx.stroke();
  });
 };
 const updateStatus=()=>{
  const ok=pointCount()>=4;
  if(statusEl){statusEl.textContent=ok?'İmza hazır':'İmza bekleniyor';statusEl.classList.toggle('ready',ok);}
 };
 const pointCount=()=>strokes.reduce((s,st)=>s+st.length,0);
 const rel=e=>{
  const rect=canvas.getBoundingClientRect();
  return[Math.max(0,Math.min(1,(e.clientX-rect.left)/(rect.width||1))),Math.max(0,Math.min(1,(e.clientY-rect.top)/(rect.height||1)))];
 };
 canvas.addEventListener('pointerdown',e=>{
  e.preventDefault(); canvas.setPointerCapture?.(e.pointerId); drawing=true;
  const pt=rel(e); cur=[pt]; strokes.push(cur); redraw(); updateStatus();
 });
 canvas.addEventListener('pointermove',e=>{
  if(!drawing||!cur)return; e.preventDefault();
  const pt=rel(e), last=cur[cur.length-1];
  const dx=(pt[0]-last[0])*360, dy=(pt[1]-last[1])*130;
  if(dx*dx+dy*dy<5)return;
  cur.push(pt); redraw(); updateStatus();
 });
 const end=()=>{drawing=false;cur=null;};
 canvas.addEventListener('pointerup',end);
 canvas.addEventListener('pointercancel',end);
 setup();
 return{
  clear(){strokes=[];cur=null;redraw();updateStatus();},
  isEmpty(){return pointCount()<4;},
  exportSvgPath(){
   if(pointCount()<4)return'';
   const W=360,H=130;
   const d=strokes.filter(st=>st.length).map(st=>st.map((pt,i)=>`${i===0?'M':'L'}${Math.round(pt[0]*W)},${Math.round(pt[1]*H)}`).join('')).join('');
   return'SIG1:'+d;
  }
 };
}

}

 if(isIsg)setTimeout(()=>{activeSigPad=initSigPad($('#coSigCanvas'));},40);

async function submitCheckout(extra={}){
 const f=$('#checkoutForm');let p;
 if(f){
  if(!f.reportValidity())return;
  p=Object.fromEntries(new FormData(f));p.qty=Number(p.qty);
  if($('#coSigCanvas')){
   if(!$('#coPpeAccept')?.checked)return toast('Lütfen 6331 sayılı İSG Kanunu teslim ve kullanım beyanını onaylayın.','error');
   if(!activeSigPad||activeSigPad.isEmpty())return toast('Lütfen imza alanına imzanızı çizin.','error');
   p.ppeAccepted=true;p.ppeSignature=activeSigPad.exportSvgPath();
  }
  Object.assign(p,extra);
 }else if(extra.itemId){p={...extra,qty:Number(extra.qty)};}else return;

 const item=state.data?.stock?.find(x=>x.id===p.itemId);
 const isIsg=item?.depot==='ISG';
 const consumable=item&&(!item.machine||/SARF|ORTAK/.test(norm(item.type+' '+item.usage)));
 const reqSession=state.session;
 const canOptimistic=!!item&&!p.managerPin&&!p.depotApproverPin&&!needsDepotApprovalUi(item)&&(isIsg||consumable||p.sendApproval);

 if(canOptimistic){
  const prevStock=Number(item.stock)||0, prevOut=Number(item.outgoing)||0;
  const estRem=p.sendApproval?prevStock:Math.max(0,prevStock-p.qty);
  const tempMovId='TMP-'+Date.now();
  if(!p.sendApproval){
   item.stock=estRem;
   item.outgoing=prevOut+p.qty;
   if(Array.isArray(state.data.movements)){
    state.data.movements.unshift({id:tempMovId,date:new Date().toISOString(),person:state.user?.name||'',itemId:item.id,code:item.code,name:item.name,depot:item.depot,qty:p.qty,unit:item.unit,machine:p.machine||(isIsg?'PERSONEL KKD':''),source:'QR'});
   }
  }
  state.analysis=null;state.ppe=null;state.cost=null;
  closeModal();renderNav();showPage(state.page,false);
  beginSave(p.sendApproval?'Onay talebi kaydediliyor...':`${item.name} çıkışı kaydediliyor...`);
  api('checkout',p,reqSession).then(r=>{
   if(r.approvalRequired){
    if(!p.sendApproval){item.stock=prevStock;item.outgoing=prevOut;if(Array.isArray(state.data?.movements))state.data.movements=state.data.movements.filter(m=>m.id!==tempMovId);}
    endSave(false,'Yönetici onayı gerekli');
    renderNav();showPage(state.page,false);
    return approvalGate(p,r.message);
   }
   if(!r.pending&&!r.depotApproval&&r.remaining!==undefined)item.stock=Number(r.remaining);
   saveBootCache(state.user?.role,state.data);
   const doneText=r.depotApproval?'Depocu onayına gönderildi ✓':(r.pending?'Onay havuzuna kaydedildi ✓':(r.ppeFormNo?`KKD zimmeti kaydedildi (${r.ppeFormNo}) ✓`:`Çıkış kaydedildi (Kalan: ${num(item.stock)}) ✓`));
   endSave(true,doneText);
   scheduleBgSync();
   if(r.autoLogout)setTimeout(logout,900);
  }).catch(e=>{
   if(!p.sendApproval){item.stock=prevStock;item.outgoing=prevOut;if(Array.isArray(state.data?.movements))state.data.movements=state.data.movements.filter(m=>m.id!==tempMovId);}
   endSave(false,'Kayıt hatası: '+e.message);
   toast(e.message,'error');
   renderNav();showPage(state.page,false);
  });
  return;
 }

 beginSave('Çıkış kaydediliyor...');
 try{
  const r=await api('checkout',p,reqSession);
  if(r.approvalRequired){endSave(false,'Yönetici onayı gerekli');return approvalGate(p,r.message);}
  closeModal();
  if(item&&!r.pending&&!r.depotApproval){
   item.stock=r.remaining!==undefined?Number(r.remaining):Math.max(0,(Number(item.stock)||0)-p.qty);
   item.outgoing=(Number(item.outgoing)||0)+p.qty;
  }
  state.analysis=null;state.ppe=null;state.cost=null;
  saveBootCache(state.user?.role,state.data);
  renderNav();await showPage(state.page,false);
  const message=r.depotApproval?(r.message||'Depocu onayına istek gönderildi. Talep No: '+r.id):(r.pending?(r.message||'Talep onay havuzuna gönderildi. Talep No: '+r.id):(r.ppeFormNo?`İmzalı KKD teslimi tamamlandı (${r.ppeFormNo}). Kalan: ${num(r.remaining)}`:'Çıkış tamamlandı. Kalan: '+num(r.remaining)));
  endSave(true,r.pending||r.depotApproval?'Talep kaydedildi ✓':'Çıkış kaydedildi ✓');
  toast(message,'ok');
  scheduleBgSync();
  if(r.autoLogout)setTimeout(logout,900);
 }catch(e){endSave(false,e.message);toast(e.message,'error');}
}

function hl(value,query){const s=String(value??''),q=norm(query);if(!q||!s)return esc(s);let folded='';const map=[];for(let i=0;i<s.length;i++){const f=s[i].toLocaleUpperCase('tr-TR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');for(let j=0;j<f.length;j++){folded+=f[j];map.push(i);}}let out='',lastOrig=0,from=0,idx;while((idx=folded.indexOf(q,from))!==-1){const start=map[idx],end=map[idx+q.length-1]+1;out+=esc(s.slice(lastOrig,start))+'<mark class="search-hl">'+esc(s.slice(start,end))+'</mark>';lastOrig=end;from=idx+q.length;}return out+esc(s.slice(lastOrig));}
function stockRowClass(x){if(Number(x.stock)<=Number(x.min))return'row-eksik';const u=norm(x.usage||'').replace(/[_-]+/g,' ');if(u.includes('PLANLI BAKIM'))return'row-planli';if(u.includes('KRITIK'))return'row-kritik';return'row-tam';}
function usageLabelUi(value){const n=norm(value).replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();if(n.includes('DEPO ONAYI GEREKLI'))return['Depo Onayı Gerekli',true];if(n==='KRITIK MALZEME')return['Kritik Malzeme',false];if(n==='PLANLI BAKIM')return['Planlı Bakım',false];if(n==='SARF'||n==='BAKIM SARF')return['Sarf',false];if(n==='ISG'||n==='ISG / KKD'||n==='ISG KKD')return['İSG',false];if(n==='TEKLI MAKINE')return['Tekli Makine',false];if(n==='COKLU MAKINE')return['Çoklu Makine',false];return[String(value).trim(),false];}
function usageChipsHtml(value,q=''){const parts=String(value||'').split('|').map(x=>x.trim()).filter(Boolean);if(!parts.length)return'<span class="usage-empty">—</span>';return`<span class="usage-text" title="${esc(String(value))}">${parts.map(x=>{const[label,approval]=usageLabelUi(x);return approval?`<span class="usage-approval">${hl(label,q)}</span>`:hl(label,q);}).join(' · ')}</span>`;}
function visibleStock(){return state.data.stock.filter(x=>(state.stockFilter.depot==='TUMU'||x.depot===state.stockFilter.depot)&&(state.stockFilter.status==='TUMU'||(state.stockFilter.status==='EKSİK'?x.stock<=x.min:x.stock>x.min))&&(!state.stockFilter.category||norm(x.category)===norm(state.stockFilter.category))&&(!state.stockFilter.usage||String(x.usage||'').split('|').some(u=>norm(usageLabelUi(u)[0])===norm(state.stockFilter.usage)))&&(!state.stockFilter.query||norm([x.code,x.name,x.category,x.usage,x.machine,x.shelf].join(' ')).includes(norm(state.stockFilter.query))));}
function renderStock(){

 const cats=[...catMap.values()].sort((a,b)=>a.localeCompare(b,'tr'));

 const usages=[...useMap.values()];
 $('#content').innerHTML=`<section class="panel table-panel"><div class="toolbar"><div class="seg">${['TUMU',...depots].map(x=>`<button class="${state.stockFilter.depot===x?'active':''}" data-filter-depot="${x}">${x==='TUMU'?'Tümü':x==='ISG'?'İSG Depo':'Mekanik'}</button>`).join('')}</div><div class="search">${ic('search','ic-sm')}<input id="stockSearch" placeholder="Kod, malzeme, kullanım şekli, makine veya raf ara..." value="${esc(q)}"></div><select id="stockCategory" aria-label="Malzeme Türü"><option value="">Malzeme Türü</option>${cats.map(c=>`<option value="${esc(c)}" ${norm(state.stockFilter.category)===norm(c)?'selected':''}>${esc(c)}</option>`).join('')}</select><select id="stockUsage" aria-label="Malzeme Depo Şekli"><option value="">Malzeme Depo Şekli</option>${usages.map(u=>`<option value="${esc(u)}" ${norm(state.stockFilter.usage)===norm(u)?'selected':''}>${esc(u)}</option>`).join('')}</select><select id="stockStatus"><option value="TUMU">Tüm durumlar</option><option ${state.stockFilter.status==='TAM'?'selected':''}>TAM</option><option ${state.stockFilter.status==='EKSİK'?'selected':''}>EKSİK</option></select></div><div class="table-scroll"><table class="data-table stock-table"><thead><tr><th>Durum</th><th>Parça / Malzeme</th><th>Depo</th><th>Kullanım Şekli</th><th class="num-col">Stok</th><th class="num-col">Min</th><th class="num-col">Giren</th><th class="num-col">Çıkan</th><th>Raf</th><th>Makine</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr data-item="${x.id}" class="${stockRowClass(x)}"><td><span class="badge ${x.stock<=x.min?'danger':'success'}">${x.stock<=x.min?'Eksik':'Tam'}</span></td><td><b>${hl(x.name,q)}</b>${x._syncing?'<span class="sync-row-tag">Kaydediliyor…</span>':''}<small><span class="mono">${hl(x.code,q)}</span> · ${hl(x.category,q)}${needsDepotApprovalUi(x)?' · <strong style="color:var(--yellow)">Depo Onayı</strong>':''}</small></td><td><span class="depot ${x.depot.toLowerCase()}">${x.depot==='ISG'?'İSG':'Mekanik'}</span></td> function stockPrintMatch(scope,depot,category,onlyMissing){
 if(scope==='filtered')return visibleStock().filter(x=>!onlyMissing||Number(x.stock)<=Number(x.min));
 return(state.data?.stock||[]).filter(x=>{
  if(depot&&depot!=='TUMU'&&x.depot!==depot)return false;
  if(category&&norm(x.category)!==norm(category))return false;
  const u=norm(x.usage||'').replace(/[_-]+/g,' ');
  const missing=Number(x.stock)<=Number(x.min);
  if(scope==='missing'&&!missing)return false;
  if(scope==='critical'&&!u.includes('KRITIK'))return false;
  if(scope==='maintenance'&&!u.includes('PLANLI BAKIM'))return false;
  if(scope==='ok'&&missing)return false;
  if(onlyMissing&&!missing)return false;
  return true;
 });
}

function recipeMachineSummaries(){const map=new Map(),stock=state.data.stock||[];(state.data.recipes||[]).forEach(r=>{const machine=String(r.machine||'').trim();if(!machine)return;const key=norm(machine),item=stock.find(x=>x.id===r.itemId),available=item?.stock??r.stock??0,ready=typeof r.ready==='boolean'?r.ready:available>=Number(r.qty||0);if(!map.has(key))map.set(key,{machine,count:0,missing:0,periods:new Set()});const row=map.get(key);row.count++;if(!ready)row.missing++;const period=norm(r.period);if(RECIPE_PERIODS.includes(period))row.periods.add(period);});return[...map.values()].map(x=>({...x,periods:RECIPE_PERIODS.filter(p=>x.periods.has(p))})).sort((a,b)=>a.machine.localeCompare(b.machine,'tr'));}

function openPpePrintFrame(html,fileTitle=''){

 if(fileTitle)document.title=fileTitle;

function normalizePpeData(res,range='30d'){

 const fallback=buildPpeFromMovements(state.data?.movements||[],state.data?.lists?.operators||[],range,res?.cards||null);
 return{...fallback,fallback:true};
}
async function loadPpeAnalysis(range=state.ppeRange||'30d',force=false){

async function loadCostAnalysis(force=false){
 const f=state.costFilter;
 if(!force&&state.cost&&state.cost._range===f.range&&state.cost._depot===f.depot)return state.cost;
 const depotParam=f.depot==='TUMU'?'Tümü':f.depot;
 try{
  const res=await api('costAnalysis',{range:f.range,depot:depotParam});
  state.cost={...res,_range:f.range,_depot:f.depot};
 }catch(err){
  if(/Bilinmeyen işlem|costAnalysis/i.test(String(err?.message||err))){
   const local=buildCostLocal(state.data?.movements||[],state.data?.stock||[],{range:f.range,depot:depotParam},state.user?.role,true);
   state.cost={...local,_range:f.range,_depot:f.depot};
  }else{throw err;}
 }
 return state.cost;
}
function costMonthlySvg(monthly=[]){
 if(!monthly.length)return'<div class="empty">Seçili dönemde aylık maliyet verisi bulunamadı.</div>';
 const W=560,H=210,padL=64,padR=16,padT=18,padB=32,plotW=W-padL-padR,plotH=H-padT-padB;
 const maxRaw=Math.max(0,...monthly.map(m=>m.total));
 const step=plotW/monthly.length, barW=Math.min(40,Math.max(14,step*0.58));
 if(maxRaw<=0){
  const baseY=(padT+plotH).toFixed(1), midY=(padT+plotH/2).toFixed(1);
  const labels=monthly.map((m,i)=>{
   const cx=(padL+step*i+step/2).toFixed(1);
   return`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">${esc(m.label)}</text>`;
  }).join('');
  return`<svg class="cost-chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Aylık maliyet trendi"><line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="#cbd5e1"/><text x="${padL-8}" y="${Number(baseY)+4}" text-anchor="end" font-size="11" fill="#64748b" font-family="var(--font-mono)">0 ₺</text><text x="${(padL+plotW/2).toFixed(1)}" y="${midY}" text-anchor="middle" font-size="12.5" fill="#94a3b8">Birim fiyat girildikçe aylık harcama çubukları burada görünür</text>${labels}</svg>`;
 }
 const maxVal=maxRaw<4?Math.ceil(maxRaw*4)/4:maxRaw;
 const ticks=[0,0.25,0.5,0.75,1];
 const grid=ticks.map(t=>{
  const y=(padT+plotH*(1-t)).toFixed(1), val=maxVal*t;
  const lbl=val>=1000?num(Math.round(val/100)/10)+'B':(maxVal<10&&val>0?num(Math.round(val*10)/10):num(Math.round(val)));
  return`<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e2e8f0" stroke-dasharray="${t===0?'':'3 3'}"/><text x="${padL-8}" y="${Number(y)+4}" text-anchor="end" font-size="11" fill="#64748b" font-family="var(--font-mono)">${esc(lbl)}</text>`;
 }).join('');
 const bars=monthly.map((m,i)=>{
  const cx=padL+step*i+step/2, x=(cx-barW/2).toFixed(1);
  const mechH=(m.mech/maxVal)*plotH, isgH=(m.isg/maxVal)*plotH;
  const mechY=(padT+plotH-mechH).toFixed(1), isgY=(padT+plotH-mechH-isgH).toFixed(1);
  const tip=`${m.label}: Toplam ${money(m.total)} (Mekanik ${money(m.mech)} · İSG ${money(m.isg)})`;
  return`<g><title>${esc(tip)}</title>${mechH>0?`<rect x="${x}" y="${mechY}" width="${barW.toFixed(1)}" height="${Math.max(2,mechH).toFixed(1)}" rx="3" fill="#ea580c"/>`:''}${isgH>0?`<rect x="${x}" y="${isgY}" width="${barW.toFixed(1)}" height="${Math.max(2,isgH).toFixed(1)}" rx="3" fill="#1d4ed8"/>`:''}<text x="${cx.toFixed(1)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">${esc(m.label)}</text></g>`;
 }).join('');
 return`<svg class="cost-chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Aylık maliyet trendi">${grid}${bars}</svg>`;
}

function labelTextData(item,cfg){
 const name=cfg.showName?(item.name||'İSG DOLABI'):'';
 const idTxt=cfg.showId?(item.id||item.code||'ISG-DOLAP'):'';
 const line1=[cfg.showCode&&item.code?item.code:'',cfg.showShelf?(item.shelf?('Raf '+item.shelf):'Tek Sabit QR'):''].filter(Boolean).join(' · ');
 const line2=[cfg.showCategory&&item.category?item.category:'',cfg.showMachine&&item.machine?item.machine:'',cfg.customText.trim()].filter(Boolean).join(' · ');
 const hasText=!!(name||idTxt||line1||line2);
 return{name,idTxt,line1,line2,hasText};
}
function labelMetrics(cfg){
 const w=cfg.w,h=cfg.h,pos=cfg.textPos||'right';
 const pad=+Math.max(0.8,Math.min(2.0,Math.min(w,h)*0.035)).toFixed(2);
 const iw=Math.max(10,w-pad*2),ih=Math.max(8,h-pad*2);
 const isBottom=pos==='bottom';
 const gap=+Math.max(1.0,Math.min(2.4,Math.min(iw,ih)*0.055)).toFixed(2);
 const qr=+(isBottom?Math.min(iw,ih*0.68):Math.min(ih,iw*0.58)).toFixed(2);
 const ref=isBottom?Math.min(iw*0.55,ih*0.42):ih;
 const autoTitlePt=+Math.max(5.5,Math.min(18,ref*0.32)).toFixed(1);
 const titlePt=cfg.fontPt>0?cfg.fontPt:autoTitlePt;
 const codePt=+Math.max(4.5,titlePt*0.78).toFixed(1);
 const subPt=+Math.max(4,titlePt*0.68).toFixed(1);
 const border=Math.min(w,h)<30?'0.35mm':'0.45mm';
 const radius=+Math.max(0.8,Math.min(2.5,Math.min(w,h)*0.045)).toFixed(1);
 return{w,h,pos,isBottom,pad,iw,ih,gap,qr,autoTitlePt,titlePt,codePt,subPt,border,radius};
}

}

function flatKey(s){return String(s||'').replace(/\s+/g,' ').trim().replace(/i/g,'İ').replace(/ı/g,'I').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/İ/g,'I').replace(/Ş/g,'S').replace(/Ğ/g,'G').replace(/Ü/g,'U').replace(/Ö/g,'O').replace(/Ç/g,'C').replace(/[^A-Z0-9]+/g,'');}
function resolveCostCenterForDepartment(dept){
 const key=String(dept||'').replace(/\s+/g,' ').trim();
 if(!key)return '';
 const map=state.data?.lists?.machineCostCenters||{};
 if(map[key])return map[key];
 const fk=flatKey(key);
 for(const [m,cc] of Object.entries(map)){if(flatKey(m)===fk)return cc;}
 const ccs=state.data?.lists?.costCenters||[];
 const exactCc=ccs.find(c=>flatKey(c)===fk);
 return exactCc||'';
}
function emptyOrderRow(seed={}){
 return{itemId:seed.itemId||'',name:seed.name||'',code:seed.code||'',supplier:seed.supplier||'',qty:Number(seed.qty)||0,unit:seed.unit||'',unitPrice:Number(seed.unitPrice)||0,currency:seed.currency||'TL',total:Math.round((Number(seed.qty)||0)*(Number(seed.unitPrice)||0)*100)/100,deliveryDate:seed.deliveryDate||''};
}
function padOrderRows(items=[],minRows=14){
 const out=(items||[]).map(x=>emptyOrderRow(x));
 while(out.length<minRows)out.push(emptyOrderRow());
 return out;
}
function createBlankOrderDraft(seedItems=[],seedDept=''){
 const defs=loadOrderDefaults();
 const reqBy=state.user?.name||'';
 const yr=new Date().getFullYear();
 let maxN=0;(state.data?.orders||[]).forEach(x=>{const m=String(x.formNo||'').match(new RegExp('^SAT-'+yr+'-(\\d+)$'));if(m)maxN=Math.max(maxN,Number(m[1]));});
 const nextNo=`SAT-${yr}-${String(maxN+1).padStart(3,'0')}`;
 const items=padOrderRows(seedItems,Math.max(14,seedItems.length));
 const dept=seedDept||defs.department||'';
 const autoCc=resolveCostCenterForDepartment(dept);
 return{
  isNew:true,formNo:nextNo,docCode:defs.docCode||'IZM_350600_LJT_001',
  requestDate:formatTrDate(new Date()),requestedBy:reqBy,requestedByRole:state.user?.role||'',
  department:dept,costCenter:autoCc||(seedDept?'':(defs.costCenter||dept)),attachmentQty:'',
  items,totalAmount:items.reduce((s,x)=>s+x.total,0),currency:'TL',
  paymentTerm:defs.paymentTerm||'Peşin / Cash',paymentMaturity:defs.paymentMaturity||'',
  transport:defs.transport||'',deliveryPlace:defs.deliveryPlace||'',details:'',
  approvals:{requirer:reqBy,managerName:defs.managerName||'FUAT ÇETİN',managerDate:'',approval1Name:defs.approval1Name||'İbrahim Özdemir',approval1Date:'',approval2Name:defs.approval2Name||'Yüksel Kurun',approval2Date:'',approval3Name:defs.approval3Name||'İbrahim Özdemir',approval3Date:''},
  status:'TALEP_OLUSTURULDU',source:'PANEL',stockSynced:false
 };
}
function openOrderEditor(orderOrNull=null,seedItems=[],seedDept=''){
 if(orderOrNull){
  const copy=JSON.parse(JSON.stringify(orderOrNull));
  copy.isNew=false;
  copy.items=padOrderRows(copy.items||[],Math.max(14,(copy.items||[]).length));
  copy.approvals=Object.assign({requirer:copy.requestedBy||'',managerName:'FUAT ÇETİN',managerDate:'',approval1Name:'İbrahim Özdemir',approval1Date:'',approval2Name:'Yüksel Kurun',approval2Date:'',approval3Name:'İbrahim Özdemir',approval3Date:''},copy.approvals||{});
  state.orderDraft=copy;
 }else{
  state.orderDraft=createBlankOrderDraft(seedItems,seedDept);
 }
 state.orderView='editor';
 if(state.page!=='orders')showPage('orders');
 else{$('#pageActions').innerHTML=pageActionHtml('orders');renderOrders();}
}
function openOrderFromItem(itemId){

 const need=Math.max(1,(Number(it.min)||1)-Math.max(0,Number(it.stock)||0));
 const firstMac=String(it.machine||'').split('|')[0].trim();
 openOrderEditor(null,[{itemId:it.id,name:it.name,code:it.code,supplier:it.company||'',qty:need,unit:it.unit||'AD',unitPrice:Number(it.unitPrice)||0,currency:'TL',deliveryDate:formatTrDate(new Date())}],firstMac);
}
function openOrderFromMissing(){
 const missing=(state.data?.stock||[]).filter(x=>Number(x.stock)<=Number(x.min));
 if(!missing.length)return toast('Eksik stok kalemi bulunamadı.');
 const seeds=missing.slice(0,25).map(it=>({itemId:it.id,name:it.name,code:it.code,supplier:it.company||'',qty:Math.max(1,(Number(it.min)||1)-Math.max(0,Number(it.stock)||0)),unit:it.unit||'AD',unitPrice:Number(it.unitPrice)||0,currency:'TL',deliveryDate:formatTrDate(new Date())}));
 openOrderEditor(null,seeds);
 toast(`${seeds.length} eksik malzeme AKG sipariş formuna aktarıldı.`);
}
let lastCostMapAutoSync=0;
function tryRefreshMissingCostMap(){
 if(state.mode==='demo'||!state.session)return;
 if(Object.keys(state.data?.lists?.machineCostCenters||{}).length)return;
 if(Date.now()-lastCostMapAutoSync<10000)return;
 lastCostMapAutoSync=Date.now();
 const sess=state.session, role=state.user?.role;
 api('bootstrap',{},sess).then(fresh=>{
  if(state.session!==sess||!fresh)return;
  state.data=fresh;
  saveBootCache(role,fresh);
  if(state.orderDraft&&state.orderDraft.department){
   const autoCc=resolveCostCenterForDepartment(state.orderDraft.department);
   if(autoCc&&(!state.orderDraft.costCenter||flatKey(state.orderDraft.costCenter)===flatKey(state.orderDraft.department))){
    state.orderDraft.costCenter=autoCc;
   }
  }
  renderNav();
  if(state.page==='orders')renderOrders();
 }).catch(()=>{});
}

 return new Promise(resolve=>{
  try{
   const svg=akgLogoSvg(74);
   const blob=new Blob([svg],{type:'image/svg+xml;charset=utf-8'});
   const url=URL.createObjectURL(blob);
   const img=new Image();
   img.onload=()=>{
    try{
     const c=document.createElement('canvas');c.width=520;c.height=148;
     const ctx=c.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,520,148);
     ctx.drawImage(img,0,0,520,148);
     _akgLogoPngCache=c.toDataURL('image/png');
    }catch{}
    URL.revokeObjectURL(url);resolve(_akgLogoPngCache||'');
   };
   img.onerror=()=>{URL.revokeObjectURL(url);resolve('');};
   img.src=url;
  }catch{resolve('');}
 });
}

function receiveOrderToStock(){

 d.status='TESLIM_ALINDI';d.stockSynced=true;
 const filled=d.items.filter(x=>x.name||x.code);
 const payload={...d,items:filled,totalAmount:Math.round(filled.reduce((s,x)=>s+x.total,0)*100)/100};
 delete payload.isNew;
 stockItems.forEach(ln=>{
  const st=state.data.stock.find(x=>x.id===ln.itemId);
  if(st){st.stock=(Number(st.stock)||0)+Number(ln.qty);st.incoming=(Number(st.incoming)||0)+Number(ln.qty);st.unitPrice=Number(ln.unitPrice);}

 saveBootCache(state.user?.role,state.data);renderNav();showPage('orders',false);
 enqueueSave({
  label:'Sipariş Teslim & Stok Girişi',
  detail:`${payload.formNo} · ${stockItems.length} stok kalemi`,
  run:async()=>{
   for(const ln of stockItems){await api('stockIn',{itemId:ln.itemId,qty:Number(ln.qty),unitPrice:Number(ln.unitPrice)});}
   await api('purchaseOrderUpdate',payload);
  },
  onSuccess:()=>{saveBootCache(state.user?.role,state.data);refreshViewQuietly();}
 });
 toast(`${payload.formNo} teslim alındı ve ${stockItems.length} kalem stok girişi sıraya alındı.`);
}

function qrMatrix(text){const CH='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';text=String(text).toUpperCase().replace(/[^0-9A-Z $%*+\-./:]/g,'-').slice(0,25);let bits='0010'+text.length.toString(2).padStart(9,'0');for(let i=0;i<text.length;i+=2){if(i+1<text.length)bits+=(CH.indexOf(text[i])*45+CH.indexOf(text[i+1])).toString(2).padStart(11,'0');else bits+=CH.indexOf(text[i]).toString(2).padStart(6,'0');}bits+='0'.repeat(Math.min(4,152-bits.length));bits+='0'.repeat((8-bits.length%8)%8);let data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8),2));for(let p=0;data.length<19;p++)data.push(p%2?17:236);const exp=new Array(512),log=new Array(256);let gx=1;for(let i=0;i<255;i++){exp[i]=gx;log[gx]=i;gx<<=1;if(gx&256)gx^=0x11d;}for(let i=255;i<512;i++)exp[i]=exp[i-255];const mul=(a,b)=>a&&b?exp[log[a]+log[b]]:0;let gen=[1];for(let i=0;i<7;i++){let nx=new Array(gen.length+1).fill(0);for(let j=0;j<gen.length;j++){nx[j]^=gen[j];nx[j+1]^=mul(gen[j],exp[i]);}gen=nx;}let rem=new Array(7).fill(0);for(const b of data){const f=b^rem[0];rem.shift();rem.push(0);for(let j=0;j<7;j++)rem[j]^=mul(gen[j+1],f);}let stream='';data.concat(rem).forEach(b=>stream+=b.toString(2).padStart(8,'0'));const n=21,m=Array.from({length:n},()=>Array(n).fill(false)),fun=Array.from({length:n},()=>Array(n).fill(false));const set=(r,c,v)=>{if(r>=0&&r<n&&c>=0&&c<n){m[r][c]=!!v;fun[r][c]=true;}};function finder(r,c){for(let dr=-1;dr<=7;dr++)for(let dc=-1;dc<=7;dc++){const rr=r+dr,cc=c+dc;if(rr<0||rr>=n||cc<0||cc>=n)continue;set(rr,cc,dr>=0&&dr<=6&&dc>=0&&dc<=6&&(dr===0||dr===6||dc===0||dc===6||(dr>=2&&dr<=4&&dc>=2&&dc<=4)));}}finder(0,0);finder(0,n-7);finder(n-7,0);for(let i=8;i<n-8;i++){set(6,i,i%2===0);set(i,6,i%2===0);}for(let i=0;i<=8;i++)if(i!==6){set(8,i,false);set(i,8,false);}for(let i=0;i<8;i++)set(8,n-1-i,false);for(let i=0;i<7;i++)set(n-1-i,8,false);set(n-8,8,true);let k=0,up=true;for(let right=n-1;right>=1;right-=2){if(right===6)right--;for(let v=0;v<n;v++){const r=up?n-1-v:v;for(let j=0;j<2;j++){const c=right-j;if(fun[r][c])continue;let b=k<stream.length&&stream[k++]==='1';if((r+c)%2===0)b=!b;m[r][c]=b;}}up=!up;}let dat=8,rf=dat;for(let i=0;i<10;i++)rf=(rf<<1)^(((rf>>9)&1)*0x537);const f=((dat<<10)|rf)^0x5412,fb=i=>((f>>i)&1)!==0;for(let i=0;i<=5;i++)m[i][8]=fb(i);m[7][8]=fb(6);m[8][8]=fb(7);m[8][7]=fb(8);for(let i=9;i<15;i++)m[14-i][8]=fb(i);for(let i=0;i<8;i++)m[8][n-1-i]=fb(i);for(let i=8;i<15;i++)m[n-15+i][8]=fb(i);m[n-8][8]=true;return m;}
function qrSvg(text,q=1){const m=qrMatrix(text),n=m.length;let p='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(m[y][x])p+=`M${x+q},${y+q}h1v1h-1z`;return`<svg viewBox="0 0 ${n+q*2} ${n+q*2}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" aria-label="QR ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><path d="${p}" fill="#0f172a"/></svg>`;}

 }
